  from { opacity: 0; transform: translateX(-50%) translateY(8px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  width: 22px; height: 22px; border: 2.5px solid rgba(var(--rose-rgb), 0.2);
  border-top-color: var(--accent-soft); border-radius: 50%;
  animation: spin 0.6s linear infinite; margin: 34px auto;
}
/* ── 按压手感：按下去要跟手，松开要慢慢弹回来 ──
   :active 期间用极短的 --t-press 立刻缩到位，手一松回弹走各自本来的 --t-base + --ease-spring（带一点过冲）。
   放在样式表最后，靠 :active 的特指度盖住前面各家自己的 transition。 */
button:active,
.nav-item:active,
.recent-row:active,
.song-row:active,
.pls-row:active,
.roam-pill:active {
  transition-duration: var(--t-press) !important;
  transition-timing-function: var(--ease-press) !important;
}

/* 列表行原本按下去毫无反应（只有按钮有）。加一层极轻的下沉，
   幅度必须小 —— 整行缩放太明显会晕。 */
.recent-row, .song-row, .pls-row {
  transition: transform var(--t-base) var(--ease-spring),
              background var(--t-fast) var(--ease-out);
}
.recent-row:active, .song-row:active, .pls-row:active { transform: scale(0.978); }

/* ── 拆卡片：内容直接落在底上，靠间距、字号、留白分层；常驻的底色/描边/阴影全卸掉，只在手指真的碰到时才给一点回应 ── */
/* .song-list 保留大盘子，行在盘内无框平铺 */
.home-card,
.recent-row,
.pls-row {
  background: none !important;
  border-color: transparent !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}
/* 卸了底色，行与行就得靠间距分开，不然糊成一坨 */
.recent-list { gap: 2px; }
.pls-list { gap: 4px; }

/* 摸上去 / 按下去才浮出底色 —— 静止时干净，交互时有回应 */
@media (hover: hover) {
  .recent-row:hover, .pls-row:hover, .song-row:hover {
    background: rgba(var(--glass-rgb), calc(0.55 * var(--glass-k))) !important;
  }
}
.recent-row:active, .pls-row:active, .song-row:active {
  background: rgba(var(--glass-rgb), calc(0.66 * var(--glass-k))) !important;
}

/* 删除键别常驻瞪着人：平时半透明，碰到那一行才亮起来 */
.pls-row-del, .song-rm {
  opacity: 0.28;
  transition: opacity var(--t-fast) var(--ease-out);
}
@media (hover: hover) {
  .pls-row:hover .pls-row-del, .song-row:hover .song-rm { opacity: 0.75; }
}

</style>

<script>
/* ═══════════════════════════════════════════
   music — standalone vanilla JS music player
   ═══════════════════════════════════════════ */

// 版本号供主页识别已经打开的旧播放器；避免 named window 永远复用旧 JS。
window.TUTOOTH_MUSIC_VERSION = '2026-08-10.1';

/* 播放器有三种活法，样式与功能各走各的：
     独立窗   —— /music/ 直接打开，完整形态
     迷你窗   —— body.window-mini，整窗缩成一块玫瑰奶糖
     抽屉里   —— body.embedded，聊天页「一起听」的 iframe
   抽屉不是等比缩小，是按场景裁功能：iframe 只有 561px，播放器自己的顶栏（←/music/⤢）在抽屉里三个键全是废的，
   撤掉顶栏省 52px、导航瘦身省 18px，都还给内容区。 */
const isEmbedded = (() => {
  try { return window.self !== window.top; } catch { return true; }  // 跨域取不到 top 也算嵌着
})();
if (isEmbedded) document.documentElement.setAttribute('data-embedded', '1');   // 抽屉里没有浮钮，首行不用让

// ── API helpers ──
async function apiFetch(path, opts) {
  // 和主站共用 Caddy 门禁；浏览器不再各自保存第二枚 music token。
  const res = await fetch(path, { ...opts, headers: { ...(opts?.headers || {}) } });
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data.error || `Music API ${res.status}`);
  return data;
}
/* GET 结果记十分钟：十分钟内再要直接给（页面不转圈），超过半分钟就背后悄悄再拉一次换新；写操作一发，全清。
   给出去的是副本，谁改了拿到的对象也脏不了缓存。轮询/登录/二维码那几条不记。 */
const apiCache = new Map();
const API_TTL = 10 * 60e3, API_FRESH = 30e3;
const API_NOCACHE = /remote|clientlog|qr|login|status|logout|\/music\/url\b|\/music\/now\b/;   // /music/url 有自己的 urlCache，而且直连回退要等它「cached」翻真，不能记
const apiCopy = d => { try { return structuredClone(d); } catch { return JSON.parse(JSON.stringify(d)); } };
async function api(path, opts) {
  const method = String((opts && opts.method) || 'GET').toUpperCase();
  if (method !== 'GET') { apiCache.clear(); return apiFetch(path, opts); }
  if (API_NOCACHE.test(path)) return apiFetch(path, opts);
  const hit = apiCache.get(path), now = Date.now();
  if (hit && now - hit.t < API_TTL) {
    if (now - hit.t > API_FRESH && !hit.refreshing) {
      hit.refreshing = true;
      apiFetch(path, opts).then(d => apiCache.set(path, { t: Date.now(), data: d })).catch(() => { hit.refreshing = false; });
    }
    return apiCopy(hit.data);
  }
  const d = await apiFetch(path, opts);
  if (d && d.ok !== false && !d.error) apiCache.set(path, { t: Date.now(), data: d });   // 失败的答案不记，下次再问
  return apiCopy(d);
}
async function apiPost(path, body) {
  return api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
}

// ── Toast ──
let toastTimer = null;
// 网易登录过期横幅：跟着 /music/remote 捎回来的 netease_login 亮灭；换好 cookie 十分钟内自己消失。
function setLoginBanner(on) {
  let el = document.getElementById('nl-banner');
  if (!on) { if (el) el.remove(); return; }
  if (el) return;
  el = document.createElement('div'); el.id = 'nl-banner'; el.className = 'nl-banner';
  el.innerHTML = '网易云登录过期了，新歌放不了（缓存过的还能听）。点这条，扫码重新登录。';
  el.addEventListener('click', openQrLogin);   // 横幅本身就是登录入口，抽屉里也能用
  document.body.appendChild(el);
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

// ── LRC Parser ──
function parseLrc(lrc) {
  const lines = [];
  for (const line of lrc.split('\n')) {
    const m = line.match(/\[(\d+):(\d+)\.(\d+)\](.*)/);
    if (m) {
      const time = parseInt(m[1]) * 60 + parseInt(m[2]) + parseInt(m[3]) / (m[3].length === 2 ? 100 : 1000);
      const text = m[4].trim();
      if (text) lines.push({ time, text });
    }
  }
  lines.sort((a, b) => a.time - b.time);
  return lines;
}

// ── Time Format ──
function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  return Math.floor(s / 60) + ':' + Math.floor(s % 60).toString().padStart(2, '0');
}

// ── Global Audio State ──
const audio = new Audio();
audio.preload = 'auto';

const state = {
  song: null,       // { name, artist, cover, songId, album }
  playing: false,
  progress: 0,      // 0..1
  currentTime: 0,
  duration: 0,
  roam: false,
  queue: [],
  history: [],
  listeners: new Set(),
  songListeners: new Set(),
};

function notify() { state.listeners.forEach(fn => fn()); }
function notifySong() { state.songListeners.forEach(fn => fn(state.song)); postSongToParent(); updateSkinBg(); }

/* ── 对外广播当前歌 ──
   聊天页把播放器嵌成 iframe 抽屉，靠这条 postMessage 知道现在在放什么。同源，但仍显式指定 targetOrigin，不用 '*'。
   父页也可以主动喊一声 {type:'music:ask'}，这边立刻回一条当前状态。 */
function songSnapshot() {
  const s = state.song;
  if (!s) return null;
  return {
    songId: s.songId || '', name: s.name || '', artist: s.artist || '',
    album: s.album || '', cover: s.cover || '', playing: !!state.playing,
  };
}
function postSongToParent() {
  if (window.parent === window) return;      // 独立标签打开时没人要听,省了
  try {
    window.parent.postMessage({ type: 'music:song', song: songSnapshot() }, location.origin);
  } catch {}
}
/* ── 报「现在唱到哪一句」 ──
   歌词本来只在打开歌词页时才解析（loadLyrics），所以这里自己按需取一份并缓存。连原文带翻译一起给，前后各带一句当上下文。 */
let lyricSnapCache = { songId: '', lines: [], trans: new Map() };

async function fetchLyricFor(songId) {
  if (lyricSnapCache.songId === songId && lyricSnapCache.lines.length) return lyricSnapCache;
  const snap = { songId, lines: [], trans: new Map() };
  try {
    const d = await api('/music/lyric?id=' + songId);
    if (d.ok && d.lrc) snap.lines = parseLrc(d.lrc);
    if (d.tlyric) for (const tl of parseLrc(d.tlyric)) snap.trans.set(Math.round(tl.time * 100), tl.text);
  } catch {}
  lyricSnapCache = snap;
  return snap;
}


/* 长按选句：歌词页里浮出小输入条，想说的话就地写，「递过去」直接寄出（music:lyric-send → 聊天端立发，带留言和整包歌词） */
let lyChatIdx = -1;
function lyricPick(j) {
  const l = lyricLines[j];
  if (!l) return null;
  return { time: l.time, text: l.text, trans: lyricTransMap.get(Math.round(l.time * 100)) || '' };
}
function openLyricChat(i) {
  if (!state.song?.songId) return;
  const bar = document.getElementById('ly-chatline');
  const quote = document.getElementById('ly-chatline-quote');
  if (!bar || !lyricLines[i]) return;
  lyChatIdx = i;
  const l = lyricLines[i];
  quote.textContent = '「' + l.text + '」';
  bar.classList.toggle('standalone', window.parent === window);   // 独立窗没有聊天可寄，只留「批注」
  bar.hidden = false;
  const input = document.getElementById('ly-chatline-input');
  input.value = '';
  if (window.parent !== window) input.focus();
}
// 长按的那句 → 批注本：句子先摆进输入框，接着写；保存时这句也收进「记过的句子」
let memoryLine = '';
function noteLyricLine() {
  if (lyChatIdx < 0 || !lyricLines[lyChatIdx] || !state.song?.songId) return;
  memoryLine = lyricLines[lyChatIdx].text;
  closeLyricChat();
  openMemory(state.song.songId);
}
function closeLyricChat() {
  const bar = document.getElementById('ly-chatline');
  if (bar) bar.hidden = true;
  lyChatIdx = -1;
}
function sendLyricChat() {
  if (lyChatIdx < 0 || !lyricLines[lyChatIdx]) return;
  const note = (document.getElementById('ly-chatline-input')?.value || '').trim();
  const payload = {
    type: 'music:lyric-send', song: songSnapshot(), at: lyricLines[lyChatIdx].time,
    prev: lyricPick(lyChatIdx - 1), line: lyricPick(lyChatIdx), next: lyricPick(lyChatIdx + 1),
    note, hasLyric: true,
  };
  try { window.parent.postMessage(payload, location.origin); } catch {}
  closeLyricChat();
  showToast('发过去了');
}
document.addEventListener('click', (e) => {
  if (e.target.closest('#ly-chatline-send')) sendLyricChat();
  if (e.target.closest('#ly-chatline-note')) noteLyricLine();
  if (e.target.closest('#ly-chatline-close')) closeLyricChat();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'ly-chatline-input') sendLyricChat();
});

window.addEventListener('message', (ev) => {
  if (ev.origin !== location.origin) return;
  const d = ev.data || {};
  if (d.type === 'music:ask') postSongToParent();
  // 聊天页的歌曲卡片点「一起听」时打过来：直接放这首
  if (d.type === 'music:play' && d.song && d.song.songId) {
    // 歌词卡点一下，直接跳进那句的时间点（at 秒数随 music:play 捎来）。
    // 同曲免重载：台上已是这首就不换碟，只在唱针离目标 3 秒开外才挪针——双喊、重复点卡都不再打断。
    const sid = String(d.song.songId);
    const at = Number(d.at);
    if (state.song && String(state.song.songId) === sid && audio.src) {
      if (at > 0 && Math.abs(audio.currentTime - at) > 3) {
        try { audio.currentTime = at; } catch {}
      }
      audio.play().catch(() => {});
    } else {
      loadAndPlay({
        songId: sid, name: d.song.name || '', artist: d.song.artist || '',
        album: d.song.album || '', cover: d.song.cover || '',
      });
      if (at > 0) {
        audio.addEventListener('canplay', function seekOnce() {
          audio.removeEventListener('canplay', seekOnce);
          try { audio.currentTime = at; } catch {}
        });
      }
    }
  }
});
function onAudioChange(fn) { state.listeners.add(fn); return () => state.listeners.delete(fn); }
function onSongChange(fn) { state.songListeners.add(fn); return () => state.songListeners.delete(fn); }
/* 歌单详情/搜索结果里的高亮行只在整页重画时算一次：换歌就按 songId 对一遍行，只挪 .active，不重画列表 */
function syncActiveRows() {
  const id = state.song && String(state.song.songId);
  document.querySelectorAll('.song-row').forEach(row => {
    const list = row.dataset.search != null ? searchResults : plDetailSongs;
    const i = parseInt(row.dataset.search != null ? row.dataset.search : row.dataset.idx);
    const s = list && list[i];
    row.classList.toggle('active', !!(id && s && String(s.songId) === id));
  });
}
onSongChange(syncActiveRows);

let lastTickPost = 0;
let bgLastPoll = 0, bgLastBeat = 0;
audio.addEventListener('timeupdate', () => {
  // 过半就预取下一首的地址（随机模式此时抽签）
  if (audio.duration && audio.currentTime > audio.duration * 0.5 && !prefetchedNext) { const n = peekNext(); if (n) { if (!prefetchedNext) prefetchedNext = n; prefetchUrl(n); } }
  // setInterval 在后台会被掐成一分钟一次甚至挂起；音频的 timeupdate 只要在放就一直响，拿它当后台的钟：5 秒一问远程点播、5 秒一报心跳
  const now = Date.now();
  if (document.hidden) {
    if (now - bgLastPoll > 3000) { bgLastPoll = now; pollRemote(); }
    if (now - bgLastBeat > 5000) { bgLastBeat = now; beatNow(); }
  }
  state.currentTime = audio.currentTime;
  state.duration = audio.duration || 0;
  state.progress = state.duration ? audio.currentTime / state.duration : 0;
  notify();
  // 每秒给父页报一次进度，喂聊天页顶上那颗胶囊。timeupdate 一秒能跳四五次，不节流会把 postMessage 刷爆。
  if (window.parent !== window) {
    const now = Math.floor(state.currentTime);
    if (now !== lastTickPost) {
      lastTickPost = now;
      try {
        window.parent.postMessage({
          type: 'music:tick', at: state.currentTime,
          duration: state.duration, playing: state.playing,
        }, location.origin);
      } catch {}
    }
  }
});
audio.addEventListener('play', () => { state.playing = true; notify(); postSongToParent(); });
audio.addEventListener('pause', () => { state.playing = false; notify(); postSongToParent(); });

/* 听歌记账上报：听完/切歌时把本次实际播放秒数写回网易云，听歌量和年度报告才认这里的账。
   30 秒以下不记，跟官方口径一致；失败静默，不打扰听歌。 */
function scrobbleToNetease(end) {
  const s = state.song;
  const t = Math.floor(audio.currentTime || 0);
  if (!s || !s.songId || t < 30) return;
  apiPost('/music/netease/scrobble', { songId: s.songId, seconds: t, end }).catch(() => {});
}

audio.addEventListener('ended', () => {
  state.playing = false;
  notify();
  scrobbleToNetease('playend');
  if (state.song) {
    apiPost('/music/listen-complete', {
      songId: state.song.songId,
      name: state.song.name,
      artist: state.song.artist
    }).catch(() => {});
  }
  if (playMode === 'one' && state.song) {   // 单曲循环:原地再来一遍(听完计数照记)
    audio.currentTime = 0;
    audio.play().catch(() => {});
    return;
  }
  playNext();
});

let loadSeq = 0;   // 连点两首时旧的取歌作废，晚到的 url 不许倒车覆盖
/* ── 后台换歌：一首放完要先去要下一首地址，等回来再 play，手机浏览器在后台不给「隔了一会儿才 play」放行。
   正在放的这首过半时就把下一首的地址预取好（urlCache，直链/缓存路径都存，留 15 分钟），放完那一瞬间同步切、不碰网络。 ── */
const urlCache = new Map();          // songId → { url, direct, cache_url, at }
let prefetchedNext = null;           // 预取时挑定的下一首（随机模式在这儿就先抽好签）
function urlCacheGet(id) { const c = urlCache.get(String(id)); if (!c) return null; if (Date.now() - c.at > 15 * 60e3) { urlCache.delete(String(id)); return null; } return c; }
async function prefetchUrl(song) {
  if (!song || !song.songId || urlCacheGet(song.songId)) return;
  try { const d = await api('/music/url?id=' + song.songId); if (d && d.url) urlCache.set(String(song.songId), { url: d.url, direct: !!d.direct, cache_url: d.cache_url || '', at: Date.now() }); } catch (_) {}
}
function peekNext() {
  if (prefetchedNext) return prefetchedNext;
  if (state.queue.length > 0) return state.queue[0];
  if (state.ctx.length > 0) {
    if (playMode === 'shuffle') { const i = Math.floor(Math.random() * state.ctx.length); prefetchedNext = state.ctx[i]; return prefetchedNext; }
    return state.ctx[0];
  }
  return null;
}
async function loadAndPlay(song) {
  if (!song || !song.songId) return;
  const my = ++loadSeq;
  if (state.song && String(state.song.songId) !== String(song.songId)) {
    scrobbleToNetease('ui');               // 换歌前给上一首记账
  }
  state.song = song;
  notifySong();
  // 换歌那一刻先把旧的停住归零：歌词跟的是 audio.currentTime，旧歌不停它就一直往前走。新歌地址到了再放。
  try { audio.pause(); if (audio.src) audio.currentTime = 0; } catch (_) {}
  // 听歌计数：/music/recent/add 记「最近在听+listenCount」
  if (song.songId) apiPost('/music/recent/add', { song }).catch(() => {});
  // 第一次听的歌服务器要现从网易拉整个 mp3，可能好几秒——给个响
  // 预取命中：同步换源、同步 play，后台也能接上（不进 await）
  const hit = urlCacheGet(song.songId);
  if (hit) {
    audio.src = hit.url; audio.play().catch(() => {});
    if (hit.direct && hit.cache_url) armDirectFallback(my, song, hit.cache_url);
    return;
  }
  const slow = setTimeout(() => { if (loadSeq === my) showToast('正在加载~'); }, 700);
  try {
    const d = await api('/music/url?id=' + song.songId);
    clearTimeout(slow);
    if (d && d.url) urlCache.set(String(song.songId), { url: d.url, direct: !!d.direct, cache_url: d.cache_url || '', at: Date.now() });
    if (loadSeq !== my) return;          // 已经点了别的，这趟作废
    if (d.url) {
      // 同源音频请求沿用站点登录，内部 music token 由 Caddy 注入。
      // 没缓存的歌服务器直接给网易 CDN 直链（direct），国内直连最快；直链放不出来就回头要缓存版。
      audio.src = d.url;
      audio.play().catch(() => {});
      if (d.direct && d.cache_url) armDirectFallback(my, song, d.cache_url);
    } else {
      showToast(d && d.error === 'netease_login_expired' ? '网易云登录过期了，去设置里扫一下' : '这首网易没给，放不了');
    }
  } catch (e) {
    clearTimeout(slow);
    if (loadSeq === my) showToast('没拿到，再点一下');
    console.error('loadAndPlay error', e);
  }
}

// 直链兜底：CDN 直链偶尔放不出来（跨域/过期/运营商），audio 报 error 时每 2 秒回 /music/url 问一次，
// 服务器后台缓存好了就换成缓存版接着放；最多等 40 秒。
function armDirectFallback(my, song, cacheUrl) {
  const onErr = async () => {
    audio.removeEventListener('error', onErr);
    if (loadSeq !== my) return;
    showToast('这首还没到，再等等');
    for (let i = 0; i < 20 && loadSeq === my; i++) {
      await new Promise(r => setTimeout(r, 2000));
      try { const d2 = await api('/music/url?id=' + song.songId); if (d2.cached && d2.url && loadSeq === my) { audio.src = d2.url; audio.play().catch(() => {}); return; } } catch (_) {}
    }
    if (loadSeq === my) showToast('这首放不了，换一首吧');
  };
  audio.addEventListener('error', onErr, { once: true });
  const clear = () => { audio.removeEventListener('error', onErr); audio.removeEventListener('playing', clear); };
  audio.addEventListener('playing', clear, { once: true });
}

// 等新歌能放了再跳到指定秒（换歌后 currentTime 得等元数据到了才能设）
function seekWhenReady(at) {
  const my = loadSeq;
  const go = () => { if (loadSeq !== my) return; try { audio.currentTime = at; } catch (_) {} audio.play().catch(() => {}); };
  if (audio.readyState >= 1 && audio.src) go();
  else audio.addEventListener('loadedmetadata', go, { once: true });
}
function togglePlay() {
  if (audio.paused) audio.play().catch(() => {});
  else audio.pause();
}

function setQueue(songs) { state.queue = songs.slice(); renderNpBar(); }
function addToQueue(song) { state.queue.push(song); showToast('排在后面了'); renderNpBar(); if (typeof renderQueue === 'function') renderQueue(); }

async function playNext() {
  // 顺位：①优先队列（手动/远程插的） ②播放上下文（按模式） ③漫游
  if (state.queue.length > 0) {
    if (state.song) state.history.push(state.song);
    prefetchedNext = null;
    loadAndPlay(state.queue.shift());
    renderNpBar();
    return;
  }
  if (state.ctx.length > 0) {
    if (state.song) state.history.push(state.song);
    let pick;
    if (playMode === 'shuffle') {
      const i = prefetchedNext ? state.ctx.indexOf(prefetchedNext) : -1;   // 预取时抽好的签
      pick = i >= 0 ? state.ctx.splice(i, 1)[0] : state.ctx.splice(Math.floor(Math.random() * state.ctx.length), 1)[0];
    } else pick = state.ctx.shift();
    prefetchedNext = null;
    loadAndPlay(pick);
    renderNpBar();
    return;
  }
  if (state.roam && state.song?.songId) {
    try {
      const d = await api('/music/roam?id=' + state.song.songId);
      if (d.ok && d.song) {
        loadAndPlay({
          name: d.song.name, artist: d.song.artist,
          cover: d.song.cover || '', songId: d.song.id || d.song.songId, album: d.song.album
        });
        return;
      }
    } catch {}
  }
}

function playPrev() {
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }
  if (state.history.length > 0) {
    loadAndPlay(state.history.pop());
  }
}

// ── Independent player window / system media controls ──
const FULL_WINDOW_SIZE = { width: 430, height: 820 };
const MINI_WINDOW_SIZE = { width: 360, height: 150 };
let mediaSessionSongKey = '';
let miniResizeCheck = 0;
let mobileReturnFallback = 0;

function resizePlayerWindow(size) {
  // Browsers only allow resizing script-opened desktop windows. Mobile safely ignores it.
  try { window.resizeTo(size.width, size.height); } catch {}
}

function updatePlayerTitle() {
  document.title = state.song ? `${state.song.name} · 一起听` : '一起听';
}

function canUseDesktopMiniWindow() {
  // resizeTo 只对脚本打开的桌面细指针窗口可靠；手机/平板会忽略缩窗请求。
  return Boolean(window.opener && !window.opener.closed)
    && window.matchMedia('(pointer: fine)').matches
    && !window.matchMedia('(display-mode: standalone)').matches;
}

function minimizeMusicWindow() {
  if (!state.song) {
    showToast('先放一首歌吧');
    return false;
  }
  if (!canUseDesktopMiniWindow()) {
    document.body.classList.remove('window-mini');
    updatePlayerTitle();
    showToast('歌会接着放，左上角回家');
    return false;
  }
  closeLyrics();
  closeMemory();
  closeComments();
  closeQueue();
  closeMv();
  closeAddToList();
  document.body.classList.add('window-mini');
  updatePlayerTitle();
  resizePlayerWindow(MINI_WINDOW_SIZE);
  window.clearTimeout(miniResizeCheck);
  miniResizeCheck = window.setTimeout(() => {
    miniResizeCheck = 0;
    if (!document.body.classList.contains('window-mini')) return;
    // 桌面浏览器也可能因窗口策略拒绝 resizeTo；这时立即还原，绝不留下整屏“假小窗”。
    if (window.outerHeight > MINI_WINDOW_SIZE.height + 130) {
      document.body.classList.remove('window-mini');
      updatePlayerTitle();
      showToast('缩不了窗，还原了');
    }
  }, 320);
  return true;
}

function expandMusicWindow() {
  window.clearTimeout(miniResizeCheck);
  miniResizeCheck = 0;
  document.body.classList.remove('window-mini');
  updatePlayerTitle();
  if (canUseDesktopMiniWindow()) resizePlayerWindow(FULL_WINDOW_SIZE);
}

function returnHomeWithoutStopping() {
  // 先让原生 target 尝试切回主页；桌面弹窗同时缩成真正的小窗。
  if (window.opener && !window.opener.closed) {
    try { window.opener.name = 'tutooth-home'; } catch {}
  }
  if (canUseDesktopMiniWindow()) {
    if (state.song) minimizeMusicWindow();
    return;
  }

  document.body.classList.remove('window-mini');
  showToast('回家了');
  window.clearTimeout(mobileReturnFallback);
  mobileReturnFallback = window.setTimeout(() => {
    mobileReturnFallback = 0;
    // 不用 location.assign('/') 导航走：手机 web 的音频只要文档一卸载就停，后台标签才活得下去。
    // 主页已经在另一个标签开好了，这里只提示怎么切，音乐照唱。真想强制跳转，给一个明确的按钮自己按。
    if (document.visibilityState === 'visible' && location.pathname.startsWith('/music')) {
      showStuckHint();
    }
  }, 1200);
}

let stuckHintEl = null;
function showStuckHint() {
  if (stuckHintEl) return;
  stuckHintEl = document.createElement('div');
  stuckHintEl.className = 'stuck-hint';
  stuckHintEl.innerHTML = `
    <span>主页已经在另一个标签开好啦，从标签栏切过去就行 —— 这边继续唱着。</span>
    <button type="button" data-act="go">还是直接跳过去（会停止播放）</button>
    <button type="button" data-act="stay">知道了</button>`;
  stuckHintEl.addEventListener('click', (ev) => {
    const act = ev.target.closest('button')?.dataset.act;
    if (!act) return;
    if (act === 'go') location.assign('/');
    stuckHintEl.remove();
    stuckHintEl = null;
  });
  document.body.appendChild(stuckHintEl);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    window.clearTimeout(mobileReturnFallback);
    mobileReturnFallback = 0;
  }
});

/* ── 返回键接管 ──
   手机上播放器是 window.open 出来的新标签，没有历史记录：没历史可退时按返回 = 关掉这个标签 = 文档卸载 = 音乐当场停。
   进页面先垫一格历史，把返回键接管过来——按返回不再关标签，而是走「回家」那条不杀音乐的路（切到主页标签，播放器留在后台继续唱）。
   每次接管后把格子垫回去，免得连按两下又退到关标签。只在手机/没有桌面小窗能力的场景接管。 */
function installBackGuard() {
  if (window.matchMedia('(pointer: fine)').matches && window.opener && !window.opener.closed) return;
  try { history.pushState({ musicGuard: 1 }, ''); } catch { return; }
  window.addEventListener('popstate', () => {
    try { history.pushState({ musicGuard: 1 }, ''); } catch {}
    if (state.playing || state.song) {
      // 走和左上角「回家」按钮完全同一条路:先让原生 target 去切主页标签,
      // 切不过去再弹提示。直接调函数是不够的——anchor 的 target 只认真实点击。
      const homeBtn = document.getElementById('music-home-btn');
      if (homeBtn) homeBtn.click(); else returnHomeWithoutStopping();
    } else {
      // 没在放歌就不拦，老老实实回家
      location.assign('/');
    }
  });
}

function syncMediaSession() {
  if (!('mediaSession' in navigator) || !state.song) return;

  const songKey = String(state.song.songId || `${state.song.name}|${state.song.artist}`);
  if (songKey !== mediaSessionSongKey && 'MediaMetadata' in window) {
    const artwork = [];
    if (state.song.cover) {
      try { artwork.push({ src: new URL(state.song.cover, location.href).href }); } catch {}
    }
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: state.song.name || '一起听',
        artist: state.song.artist || '',
        album: state.song.album || '',
        artwork
      });
      mediaSessionSongKey = songKey;
    } catch {}
  }

  try { navigator.mediaSession.playbackState = state.playing ? 'playing' : 'paused'; } catch {}
  if (Number.isFinite(state.duration) && state.duration > 0 && Number.isFinite(state.currentTime)) {
    try {
      navigator.mediaSession.setPositionState({
        duration: state.duration,
        playbackRate: audio.playbackRate || 1,
        position: Math.min(state.duration, Math.max(0, state.currentTime))
      });
    } catch {}
  }
}

function setupMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const actions = {
    play: () => audio.play().catch(() => {}),
    pause: () => audio.pause(),
    previoustrack: playPrev,
    nexttrack: playNext,
    seekto: details => {
      if (Number.isFinite(details.seekTime) && state.duration) {
        audio.currentTime = Math.min(state.duration, Math.max(0, details.seekTime));
      }
    }
  };
  Object.entries(actions).forEach(([action, handler]) => {
    try { navigator.mediaSession.setActionHandler(action, handler); } catch {}
  });
}

function toggleRoam() {
  state.roam = !state.roam;
  notify();
}

// ── Escape HTML ──
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── 封面:缺失或加载失败时露出奶油底玫瑰音符占位(纯展示,不影响数据) ──
function coverBox(url, cls) {
  const safe = url ? esc(url) : '';
  const img = safe ? `<img src="${safe}" alt="" loading="lazy" onerror="this.classList.add('gone')">` : '';
  return `<div class="coverbx ${cls}">${img}</div>`;
}

const BUILD = '10-28 02:10';   // 版本号：每次上墙改一下，页面打开会把它连同主页间距一起报回 /music/clientlog
function reportLayout(tag) {
  try {
    const r = sel => { const e = document.querySelector(sel); if (!e) return null; const b = e.getBoundingClientRect(); return [Math.round(b.left), Math.round(b.top), Math.round(b.bottom)]; };

}

}
window.addEventListener('error', e => reportClientError(e.message, e.error && e.error.stack));

// ── 皮肤：奶油玫瑰、黑白夜、自定义 ──
// 选中的记在 localStorage，聊天页的抽屉是同源 iframe，也跟着换。
const SKINS = { rose: '粉色', mono: '黑白', custom: '自定义' };
let skinOwnBg = null;   // 服务器上有没有传过底图：null 没问过 / true / false
function getSkin() { try { let v = localStorage.getItem('music_skin'); if (v === 'glass') v = 'custom'; return SKINS[v] ? v : 'rose'; } catch { return 'rose'; } }
function applySkin(s) {
  if (!SKINS[s]) s = 'rose';
  if (s === 'rose') document.documentElement.removeAttribute('data-skin');
  else document.documentElement.setAttribute('data-skin', s);
  try { localStorage.setItem('music_skin', s); } catch {}
  updateSkinBg();
  document.querySelectorAll('.skin-sw').forEach(b => b.classList.toggle('active', b.dataset.skin === s));
  document.documentElement.style.setProperty('--bg-show', String(getBgShow()));
  document.documentElement.style.setProperty('--bg-blur', getBgBlur() + 'px');
  setAccent(getAccent());
}
// 自定义皮的底：传的图优先（/music/skin/bg），没有就拿正在放的封面小图糊一层。
// 字色跟着图走：把图画到 16×16 的画布上算平均亮度，暗图配浅字（data-ink=light）。
async function updateSkinBg() {
  let el = document.getElementById('skin-bg');
  if (!el) { el = document.createElement('div'); el.id = 'skin-bg'; document.body.prepend(el); }
  const html = document.documentElement;
  const setCover = () => {
    const s = state.song;
    const c = s && (s.cover || s.picUrl || s.pic || '');
    if (!c) { el.style.backgroundImage = ''; html.style.removeProperty('--skin-bg-img'); el.classList.add('empty'); return; }
    const u = String(c).replace(/^http:/, 'https:');
    el.classList.remove('empty');
    el.style.backgroundImage = `url("${u}${u.includes('?') ? '&' : '?'}param=120y120")`;
    html.style.setProperty('--skin-bg-img', el.style.backgroundImage);   // 歌词页 ::before 用同一张
  };
  // 粉色 / 黑白：封面糊开当底，罩各自的纱
  if (getSkin() !== 'custom') { html.removeAttribute('data-ink'); html.setAttribute('data-bg', 'cover'); setCover(); return; }
  if (skinOwnBg === null) {
    try { const r = await fetch('/music/skin/bg', { method: 'GET', cache: 'no-store' }); skinOwnBg = r.ok; } catch { skinOwnBg = false; }
    if (getSkin() !== 'custom') return;
  }
  if (skinOwnBg) {
    let v = '';
    try { v = localStorage.getItem('music_skin_bg_v') || ''; } catch {}
    const url = '/music/skin/bg' + (v ? '?v=' + v : '');
    el.style.backgroundImage = `url("${url}")`;
    html.style.setProperty('--skin-bg-img', el.style.backgroundImage);
    el.classList.remove('empty');
    html.setAttribute('data-bg', 'own');
    pickInkFor(url);
    return;
  }
  html.setAttribute('data-bg', 'cover'); html.setAttribute('data-ink', 'light');
  setCover();
}
function pickInkFor(url) {
  const img = new Image();
  img.onload = () => {
    try {
      const cv = document.createElement('canvas'); cv.width = 16; cv.height = 16;
      const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, 16, 16);
      const d = ctx.getImageData(0, 0, 16, 16).data;
      let sum = 0;
      for (let i = 0; i < d.length; i += 4) sum += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      const luma = sum / (d.length / 4);
      if (getSkin() === 'custom') document.documentElement.setAttribute('data-ink', luma < 128 ? 'light' : 'dark');
    } catch {}
  };
  img.src = url;
}
// 传图：先在浏览器里缩到长边 1600、转成 jpg（手机原图动辄五六兆，HEIC 也顺手解了），再整块 POST 给服务器。
async function uploadSkinBg(file) {
  if (!file) return;
  showToast('图在缩…');
  let blob = file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.88));
    if (!blob) blob = file;
  } catch { blob = file; }
  try {
    const r = await fetch('/music/skin/bg', { method: 'POST', headers: { 'Content-Type': blob.type || 'image/jpeg' }, body: blob });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { showToast(d.error || '没传上'); return; }
    skinOwnBg = true;
    try { localStorage.setItem('music_skin_bg_v', String(Date.now())); } catch {}
    applySkin('custom');
    showToast('换好了');
    const v = document.getElementById('skinbg-val'); if (v) v.textContent = '用的是你传的图';
  } catch { showToast('没传上'); }
}
async function clearSkinBg() {
  try { await fetch('/music/skin/bg', { method: 'POST', headers: { 'Content-Type': 'image/jpeg' } }); } catch {}
  skinOwnBg = false;
  updateSkinBg();
  const v = document.getElementById('skinbg-val'); if (v) v.textContent = '没传图，先拿封面垫着';
  showToast('去掉了');
}

function setBgBlur(v) {

// 主题色：一个 hex，每套皮各记各的；从它算出深一档、浅一档、通道三元组，

const ACCENT_VARS = ['--accent', '--accent-soft', '--accent-tint', '--rose', '--rose-deep', '--btn', '--btn-ink', '--rose-rgb', '--rose-deep-rgb', '--hairline'];

  st.setProperty('--rose-rgb', c.join(', ')); st.setProperty('--rose-deep-rgb', deep.join(', ')); st.setProperty('--hairline', `rgba(${c}, 0.16)`);

}

// ── 网易云扫码登录：/qr/new 拿钥匙 → 画二维码 → 每 2 秒问一次 /qr/check。
//    801 等扫、802 扫了没确认、803 成功（服务端已把新 cookie 写好）、800 过期。 ──
let qrPoll = null, qrKey = '';
function closeQr() {
  clearInterval(qrPoll); qrPoll = null;
  const el = document.getElementById('qr-sheet');
  if (el) el.classList.add('hidden');
}
function openQrLogin() {
  let el = document.getElementById('qr-sheet');
  if (!el) {
    el = document.createElement('div'); el.id = 'qr-sheet'; el.className = 'qr-sheet';
    el.innerHTML = `<div class="qr-card">

      <div class="qr-box" id="qr-box"></div>
      <div class="qr-msg" id="qr-msg"></div>
      <div class="qr-actions"><button type="button" id="qr-cancel">先不了</button><button type="button" class="primary" id="qr-refresh">换一张</button></div>
    </div>`;
    document.body.appendChild(el);
    el.addEventListener('click', e => { if (e.target === el) closeQr(); });
    el.querySelector('#qr-cancel').addEventListener('click', closeQr);
    el.querySelector('#qr-refresh').addEventListener('click', () => startQr());
  }
  el.classList.remove('hidden');
  startQr();
}
async function startQr() {
  clearInterval(qrPoll); qrPoll = null;
  const box = document.getElementById('qr-box'), msg = document.getElementById('qr-msg');
  box.innerHTML = '<div class="spinner"></div>'; msg.textContent = '找网易要二维码…';
  let d;
  try { d = await api('/music/netease/qr/new'); } catch { msg.textContent = '网易那边没给二维码，待会再试'; box.innerHTML = ''; return; }
  qrKey = d.key;
  try {
    const q = qrcode(0, 'M'); q.addData(d.url); q.make();
    box.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  } catch { box.textContent = d.url; }
  msg.textContent = '打开网易云音乐 app，扫这个';
  const key = qrKey;
  qrPoll = setInterval(async () => {
    let r;
    try { r = await api('/music/netease/qr/check?key=' + encodeURIComponent(key)); } catch { return; }
    if (key !== qrKey) return;
    if (r.code === 800) { clearInterval(qrPoll); qrPoll = null; msg.textContent = '二维码过期了，点「换一张」'; }
    else if (r.code === 802) { msg.textContent = '扫到了，在手机上点一下确认'; }
    else if (r.code === 803) {
      clearInterval(qrPoll); qrPoll = null;
      msg.textContent = '登录好了' + (r.nickname ? ' · ' + r.nickname : '');
      setLoginBanner(false); showToast('网易云登录好了'); loadNeteaseStatus();
      setTimeout(closeQr, 900);
    }
  }, 2000);
}

function readImageAsDataURL(file, maxDim) {

        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

        </div>` : ''}

    </div>`;

function bindDiscoverEvents(container) {
  const searchInput = container.querySelector('#search-input');
  const searchGo = container.querySelector('#search-go');
  const searchClear = container.querySelector('#search-clear');

  searchGo.addEventListener('click', () => doSearch(searchInput.value));
  searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(searchInput.value); });
  searchInput.addEventListener('input', () => {
    searchClear.classList.toggle('hidden', !searchInput.value);
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchClear.classList.add('hidden');
    searchResults = [];
    searchTouched = false;
    renderTab();
  });

  // Daily clicks(点一首,日推后面的整列排进播放上下文)
  container.querySelectorAll('[data-daily]').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('.like-btn')) return;
      const i = parseInt(row.dataset.daily);
      playSong(dailySongs[i], dailySongs.slice(i + 1));
    });
  });
  container.querySelectorAll('[data-like-daily]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.likeDaily);
      likeSong(dailySongs[i]);
    });
  });
}

async function doSearch(q) {
  if (!q?.trim()) return;
  const goBtn = document.getElementById('search-go');
  if (goBtn) goBtn.textContent = '...';
  searchTouched = true;
  try {
    const d = await api('/music/search?q=' + encodeURIComponent(q));
    searchResults = (d.songs || []).map(t => ({
      name: t.name, artist: t.artist, album: t.album, cover: t.cover || '', songId: t.id
    }));
  } catch { searchResults = []; }
  renderSearchResults();
  if (goBtn) goBtn.textContent = 'Go';
}

// 收藏/取消收藏：播放条和歌词页都挂了心，再点一下就从「喜欢」里拿出来。
async function likeSong(s) {
  if (!s?.songId) return;
  /* 红心同步网易云，写的是登录账号的「喜欢的音乐」。旁路异步走，本地红心不等网易；同步失败弹一句，不拦操作。 */
  const syncNe = (like) => {
    if (!/^\d+$/.test(String(s.songId))) return;
    apiPost('/music/netease/like', { songId: String(s.songId), like })
      .then(r => { if (!r.ok) showToast('网易云没记上'); })
      .catch(() => {});
  };
  if (likedIds.has(s.songId)) {
    await apiPost('/music/playlist/remove', { songId: s.songId });
    likedDel(s.songId);
    syncNe(false);
    showToast('取消收藏了');
  } else {
    await apiPost('/music/playlist/add', { song: s, by: 'user' });
    likedAdd(s.songId);
    syncNe(true);
    showToast('收藏了 ♥');
  }
  refreshLikeHearts();
  // Re-render discover to update heart icons
  if (currentTab === 'discover') renderTab();
}
// 只把心的填充状态刷一遍,不重建歌词页——重建会把滚动位置和唱到哪一句都弄丢
function refreshLikeHearts() {
  const id = state.song && state.song.songId;
  const on = !!(id && likedIds.has(id));
  document.querySelectorAll('[data-like-now]').forEach(btn => {
    btn.classList.toggle('liked', on);
    const svg = btn.querySelector('svg');
    if (svg) svg.setAttribute('fill', on ? 'currentColor' : 'none');
    const lab = btn.querySelector('span');   // 歌词页抽屉里那行带字
    if (lab) lab.textContent = on ? '已收藏' : '收藏这首';
  });
}
function heartSvg(on) {
  return `<svg viewBox="0 0 24 24" width="18" height="18" fill="${on ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 000-7.8z"/></svg>`;
}

/* 队列分家：state.queue=优先队列（只装手动/远程插的歌，永远先播，谁也不许覆盖）；
   state.ctx=播放上下文（当前歌单的后续，切歌单只换它）。
   播放模式：顺序 order / 单曲循环 one / 随机 shuffle（播放条上一颗钮循环切）。 */
state.ctx = state.ctx || [];

}

function playSong(s, rest) {
  if (!s) return;
  if (state.song) state.history.push(state.song);

let npSig = '';

  const npLike = document.getElementById('np-like-btn');
  if (npLike) npLike.addEventListener('click', e => { e.stopPropagation(); likeSong(state.song); });
  const npQueue = document.getElementById('np-queue-btn');

  syncMediaSession();
}

/* ── 歌词页的李萨如花 ──
   x = sin(a·t + φ)，y = sin(b·t)。a:b 按这首歌的 id 从几个音程里挑一个（2:3 纯五度 / 3:4 纯四度 / 3:5 大六度 / 4:5 大三度 / 5:6 小三度），
   φ 跟着播放进度慢慢走：歌在放，花就在转；暂停了就停在那一刻。尾迹只留最近一段，像示波器的余辉。减少动效＝静帧。 */
const LISS_RATIOS = [[2, 3], [3, 4], [3, 5], [4, 5], [5, 6], [1, 2]];
let lissRAF = 0, lissLast = 0, lissDrift = 0;   // lissDrift：播放时慢慢攒的相位，暂停就停在攒到的地方
function lissRatio() {
  const id = String((state.song && state.song.songId) || '0');
  let h = 0; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return LISS_RATIOS[h % LISS_RATIOS.length];
}
let lissBase = null, lissBasePhi = null, lissBaseKey = '';
function lissFrame(now) {
  const lv = document.getElementById('lyrics-view'), cv = lv && lv.querySelector('.ly-liss');
  if (!cv) { lissRAF = 0; return; }
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarse = matchMedia('(pointer: coarse)').matches;
  if (now - lissLast > (coarse ? 33 : 16)) {                       // 手机 30fps
    lissLast = now;
    const DPR = Math.min(1.5, devicePixelRatio || 1), W = lv.clientWidth, H = lv.clientHeight;   // 1.5 倍折中
    if (cv.width !== Math.round(W * DPR) || cv.height !== Math.round(H * DPR)) { cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); lissBaseKey = ''; }
    const [a, b] = lissRatio(), cs = getComputedStyle(document.documentElement);
    const ink = cs.getPropertyValue('--rose-deep').trim() || '#984e68', rose = cs.getPropertyValue('--rose').trim() || '#c2708a';
    const cx = W / 2, cy = H * 0.5, r = Math.min(W, H) * 0.34;
    if (!reduce && !audio.paused) lissDrift += 0.01 * Math.min(0.1, (now - (lissFrame._t || now)) / 1000);
    lissFrame._t = now;
    const phi = (audio.currentTime || 0) * 0.06 + lissDrift;
    // 底线：画在暗地里的画布上，相位变了才重画
    const key = a + ':' + b + '|' + W + 'x' + H + '|' + DPR;
    if (!lissBase) lissBase = document.createElement('canvas');
    if (lissBaseKey !== key || lissBasePhi === null || Math.abs(phi - lissBasePhi) > 0.004) {   // 0.004 ≈ 每秒十五次
      lissBase.width = cv.width; lissBase.height = cv.height; lissBaseKey = key; lissBasePhi = phi;
      const bx = lissBase.getContext('2d'); bx.setTransform(DPR, 0, 0, DPR, 0, 0); bx.clearRect(0, 0, W, H);
      bx.lineWidth = 0.8; bx.strokeStyle = rose; bx.globalAlpha = 0.55; bx.beginPath();
      for (let k = 0; k <= 320; k++) { const t = k / 320 * Math.PI * 2, x = cx + r * Math.sin(a * t + phi), y = cy + r * Math.sin(b * t); if (k) bx.lineTo(x, y); else bx.moveTo(x, y); }
      bx.stroke();
      bx.font = '8.5px ui-monospace, Menlo, monospace'; bx.fillStyle = ink; bx.globalAlpha = 0.5; bx.textAlign = 'right';
      bx.fillText(`LISSAJOUS ${a}:${b}`, W - 16, H * 0.5 + r + 22); bx.globalAlpha = 1;
    }
    const ctx = cv.getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(lissBase, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // 每帧只画这一粒点和一小段余辉

    for (let k = 0; k <= seg; k++) { const t = tp - (seg - k) * 0.006, x = cx + r * Math.sin(a * t + lissBasePhi), y = cy + r * Math.sin(b * t); if (k) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
    ctx.stroke();
    const px = cx + r * Math.sin(a * tp + lissBasePhi), py = cy + r * Math.sin(b * tp);
    ctx.fillStyle = rose; ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(px, py, 2.6, 0, 7); ctx.fill();
  }
  lissRAF = requestAnimationFrame(lissFrame);
}

// 歌词对齐（左/中/右）＋ 大小：两个 CSS 变量，记在 localStorage

function getLySize() { try { return LY_SIZES[localStorage.getItem('music_ly_size')] ? localStorage.getItem('music_ly_size') : 'm'; } catch { return 'm'; } }

function setLyAlign(v) { try { localStorage.setItem('music_ly_align', v); } catch {} const st = document.documentElement.style; st.setProperty('--ly-align', v); st.setProperty('--ly-origin', v === 'center' ? 'center' : v + ' center'); document.documentElement.dataset.lyAlign = v; }

function shareCurrentSong() {
  const snap = songSnapshot(); if (!snap) return;
  if (window.parent !== window) {
    try { window.parent.postMessage({ type: 'music:lyric-send', song: snap, hasLyric: false, note: '' }, location.origin); } catch {}
    showToast('放进输入框了，写两句再发'); return;
  }
  const url = 'https://music.163.com/song?id=' + snap.songId, text = `${snap.name} - ${snap.artist}`;
  if (navigator.share) { navigator.share({ title: text, text, url }).catch(() => {}); return; }
  (navigator.clipboard ? navigator.clipboard.writeText(text + ' ' + url) : Promise.reject()).then(() => showToast('链接复制了'), () => showToast(url));
}

let npMode = (() => { try { return localStorage.getItem('music_np_mode') === 'lyrics' ? 'lyrics' : 'cover'; } catch { return 'cover'; } })();

  if (m.textContent !== text) { m.textContent = text; t.textContent = tr; m.parentElement.classList.remove('tick'); void m.offsetWidth; m.parentElement.classList.add('tick'); }
}

// 拨歌词：手指滑动歌词列的时候，中间浮一条线和「▶ 时间」，指着离中线最近那句；点它从那句播
let lyricScrubHideTimer = 0;
function hideLyricScrub() { const el = document.getElementById('ly-scrub'); if (el) el.classList.remove('show'); }
function updateLyricScrub() {
  const c = document.getElementById('ly-lines-container'), sc = document.getElementById('ly-scrub');
  if (!c || !sc || !lyricsLineEls.length) return;
  if (performance.now() >= lyricAutoScrollLockedUntil) { hideLyricScrub(); return; }   // 不是手指在滑（自动跟随），不出
  const mid = c.scrollTop + c.clientHeight / 2;
  let best = -1, bestD = Infinity;
  for (let i = 0; i < lyricsLineEls.length; i++) {
    const el = lyricsLineEls[i], d = Math.abs(el.offsetTop + el.clientHeight / 2 - mid);

  if (best < 0) return;
  const t = parseFloat(lyricsLineEls[best].dataset.time);

  const lvTop = (sc.offsetParent || document.getElementById('lyrics-view')).getBoundingClientRect().top;
  sc.style.setProperty('--scrub-top', (c.getBoundingClientRect().top - lvTop + c.clientHeight / 2) + 'px');

function bindLyricScrub() {

function bindSeekBar() {
  const seekEl = document.getElementById('ly-seek');
  if (!seekEl) return;

  const getPos = (clientX) => {
    const rect = seekEl.getBoundingClientRect();
    return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  };

  const onStart = (clientX) => {
    lyricsDragging = true;
    lyricsDragRatio = getPos(clientX);
    updateSeekUI(lyricsDragRatio);
  };

  const onMove = (clientX) => {
    if (!lyricsDragging) return;
    lyricsDragRatio = getPos(clientX);
    updateSeekUI(lyricsDragRatio);
  };

  const onEnd = () => {
    if (!lyricsDragging) return;
    lyricsDragging = false;
    if (state.duration) {
      audio.currentTime = lyricsDragRatio * state.duration;
    }
  };

  // One pointer stream works for mouse, pen, and touch, without leaking window listeners
  // every time the lyrics view is rendered.
  // Touch gets its own non-passive listeners: inside an Android WebView app shell the touch
  // pointer stream can be cancelled mid-drag (thumb never follows the finger). preventDefault on
  // touchstart/touchmove keeps the whole gesture on the seek bar; pointer handlers skip touch.
  seekEl.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') return;
    e.preventDefault();
    seekEl.setPointerCapture?.(e.pointerId);
    onStart(e.clientX);
  });
  seekEl.addEventListener('pointermove', e => { if (e.pointerType !== 'touch') onMove(e.clientX); });
  seekEl.addEventListener('pointerup', e => { if (e.pointerType !== 'touch') onEnd(); });
  seekEl.addEventListener('pointercancel', e => { if (e.pointerType !== 'touch') onEnd(); });
  seekEl.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    e.preventDefault();
    onStart(e.touches[0].clientX);
  }, { passive: false });
  seekEl.addEventListener('touchmove', e => {
    if (!lyricsDragging || !e.touches.length) return;
    e.preventDefault();
    onMove(e.touches[0].clientX);
  }, { passive: false });
  seekEl.addEventListener('touchend', onEnd);
  seekEl.addEventListener('touchcancel', onEnd);
}

function updateSeekUI(ratio) {
  const fill = document.getElementById('ly-seek-fill');
  const thumb = document.getElementById('ly-seek-thumb');
  const timeCur = document.getElementById('ly-time-current');
  if (fill) fill.style.width = (ratio * 100) + '%';

  if (timeCur && state.duration) timeCur.textContent = fmt(ratio * state.duration);

/* 歌词按歌缓存：同一首只请求+解析一次，重复调用只重画；连续切歌时旧请求作废（songId 校验），不会把上一首的词画到下一首头上。 */
const lyricFetchCache = new Map();
async function loadLyrics() {
  const s = state.song;
  if (!s?.songId) return;
  const sid = String(s.songId);

  lyricLines = [];
  lyricTransMap = new Map();
  currentLyricIdx = -1;

  let entry = lyricFetchCache.get(sid);
  if (!entry) {
    try {
      const d = await api('/music/lyric?id=' + sid);
      entry = { lines: [], trans: new Map() };
      if (d.ok && d.lrc) entry.lines = parseLrc(d.lrc);
      if (d.tlyric) {
        for (const tl of parseLrc(d.tlyric)) entry.trans.set(Math.round(tl.time * 100), tl.text);
      }
      lyricFetchCache.set(sid, entry);
      if (lyricFetchCache.size > 40) lyricFetchCache.delete(lyricFetchCache.keys().next().value);
    } catch { entry = { lines: [], trans: new Map() }; }
  }
  if (String(state.song?.songId) !== sid) return;   // 等待期间又切歌了,这趟作废
  lyricLines = entry.lines;
  lyricTransMap = entry.trans;

  renderLyricLines();
}

/* 「文字PV」动效（概念借鉴 folia-major）：当前句逐字错峰点亮，唱过就恢复整句。 */
function charSpans(text, base = 0) {
  // 字符 span 装台时预拆：渲染歌词列表时就拆好，激活只翻 class，零重建。延迟写在 --d 变量里，只有 .active 时动画才引用它。
  // 词包字（.ly-w）：英文单词不从中间拆行；中日韩整句没有空格，一字一个词才能折行。
  // 延迟步长按句长摊（长句每字间隔小一点），封顶 900ms，尾巴不再挤在同一毫秒闪现。
  const chars = Array.from(String(text)); const n = Math.max(1, chars.filter(c => !/\s/.test(c)).length);
  const step = Math.min(22, Math.max(7, 760 / n));
  const CJK = /[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af\uff00-\uffef]/;
  let i = 0, out = '';
  const ch = c => `<span class="ly-ch" style="--d:${Math.round(base + Math.min(i++ * step, 900))}ms">${esc(c)}</span>`;
  for (const seg of String(text).split(/(\s+)/)) {
    if (!seg) continue;
    if (/^\s+$/.test(seg)) { out += esc(seg); continue; }
    let word = '';
    for (const c of Array.from(seg)) {
      if (CJK.test(c)) { if (word) { out += '<span class="ly-w">' + word + '</span>'; word = ''; } out += '<span class="ly-w">' + ch(c) + '</span>'; }
      else word += ch(c);
    }
    if (word) out += '<span class="ly-w">' + word + '</span>';
  }
  return out;
}

function renderLyricLines() {
  const container = document.getElementById('ly-lines-container');
  if (!container) return;

  if (lyricLines.length === 0) {
    container.innerHTML = '<div class="ly-no-lyrics">no lyrics available</div>';
    lyricsLineEls = [];
    return;
  }

  let html = '';
  lyricLines.forEach((l, i) => {
    const trans = lyricTransMap.get(Math.round(l.time * 100));
    html += `<div class="ly-line" data-line="${i}" data-time="${l.time}"><span class="ly-text">${esc(l.text)}</span>${trans ? '<div class="ly-trans">' + esc(trans) + '</div>' : ''}</div>`;
  });
  container.innerHTML = html;
  lyricsLineEls = container.querySelectorAll('.ly-line');

  // 手指一上来就让位：4 秒内不自动跟，正在滑的也立刻松手
  const pauseAutoScroll = () => {

  };

  container.addEventListener('touchmove', pauseAutoScroll, { passive: true });

  // Click to seek；长按=选句分享。
  // 长按的取消挂位移阈值，挪 >10px 才算想滑动（手指按住必有微抖，不然 550ms 永远数不满）。
  lyricsLineEls.forEach(el => {
    let lpTimer = 0, lpFired = false, lpX = 0, lpY = 0;
    const pt = (e) => e.touches && e.touches[0] ? e.touches[0] : e;
    const lpStart = (e) => {
      lpFired = false;
      const p = pt(e); lpX = p.clientX; lpY = p.clientY;
      window.clearTimeout(lpTimer);
      lpTimer = window.setTimeout(() => {
        lpFired = true;
        const i = parseInt(el.dataset.line);
        if (!isNaN(i)) openLyricChat(i);
      }, 550);
    };
    const lpMove = (e) => {
      const p = pt(e);
      if (Math.abs(p.clientX - lpX) + Math.abs(p.clientY - lpY) > 10) window.clearTimeout(lpTimer);
    };
    const lpEnd = () => window.clearTimeout(lpTimer);
    el.addEventListener('touchstart', lpStart, { passive: true });
    el.addEventListener('touchmove', lpMove, { passive: true });
    el.addEventListener('touchend', lpEnd, { passive: true });
    el.addEventListener('touchcancel', lpEnd, { passive: true });
    el.addEventListener('mousedown', lpStart);
    el.addEventListener('mousemove', lpMove);
    el.addEventListener('mouseup', lpEnd);
    el.addEventListener('mouseleave', lpEnd);
    el.addEventListener('contextmenu', e => e.preventDefault());   // 原生菜单全程谢客,长按只归分享
    el.addEventListener('click', () => {

/* ── 歌词惯性滚动 ──
   不用 container.scrollTo({behavior:'smooth'})（曲线各家不一样，排队会突兀地跳）。自己插值：每帧朝目标补上剩余距离的一小截，越接近越慢（lerp .12）。
   lerp 直接乘会跟帧率绑死（120Hz 屏上快一倍），所以按 dt 归一化到 60fps。 */
const LYRIC_LERP = 0.12;
let lyricGlideRAF = 0;
let lyricGlideTarget = 0;
let lyricGlideLast = 0;

function glideLyricsTo(container, top) {
  const max = Math.max(0, container.scrollHeight - container.clientHeight);
  lyricGlideTarget = Math.max(0, Math.min(top, max));
  if (lyricGlideRAF) return;                       // 已经在滑了，改目标就行
  lyricGlideLast = performance.now();
  const step = now => {
    const dt = Math.min(now - lyricGlideLast, 50); // 切后台回来别一帧跳完
    lyricGlideLast = now;
    const cur = container.scrollTop;
    const diff = lyricGlideTarget - cur;
    if (Math.abs(diff) < 0.5) {
      container.scrollTop = lyricGlideTarget;
      lyricGlideRAF = 0;
      return;
    }
    const t = 1 - Math.pow(1 - LYRIC_LERP, dt / 16.667);
    container.scrollTop = cur + diff * t;
    lyricGlideRAF = requestAnimationFrame(step);
  };
  lyricGlideRAF = requestAnimationFrame(step);
}

function stopLyricGlide() {
  if (lyricGlideRAF) { cancelAnimationFrame(lyricGlideRAF); lyricGlideRAF = 0; }
}

/* 读一个元素当前的旋转角度（从合成后的矩阵反解），用来接着转 / 惯性停。 */
function currentRotation(el) {
  const t = getComputedStyle(el).transform;
  if (!t || t === 'none') return 0;
  const m = new DOMMatrixReadOnly(t);
  return Math.atan2(m.b, m.a) * 180 / Math.PI;
}

/* 唱片起转 / 停转。停转不是急停 —— 断电的唱盘会靠惯性再飘一段才停。 */
function syncDiscSpin() {
  const disc = document.getElementById('ly-disc');
  if (!disc) return;
  const spinning = disc.classList.contains('spinning');
  if (state.playing === spinning) return;              // 状态没变，别打断正在转的动画

  const deg = currentRotation(disc);
  if (state.playing) {
    disc.style.transition = 'none';
    disc.style.transform = '';
    disc.style.setProperty('--spin-from', deg + 'deg');  // 从停下的角度接着转，不回弹到 0
    disc.classList.add('spinning');
  } else {
    disc.classList.remove('spinning');                 // 脱离 animation，改由 transition 接管
    disc.style.transition = 'none';
    disc.style.transform = `rotate(${deg}deg)`;
    void disc.offsetWidth;                             // 定住这一帧，否则下面那句会被合并掉
    disc.style.transition = `transform var(--t-slow) var(--ease-out)`;
    disc.style.transform = `rotate(${deg + 22}deg)`;    // 再飘 22° 慢慢停
  }
}

function renderLyricsProgress() {
  if (!lyricsOpen) return;

  // Update play button
  const playBtn = document.getElementById('ly-play');
  if (playBtn) {
    playBtn.innerHTML = state.playing
      ? '<svg viewBox="0 0 24 24" width="17" height="17"><rect x="5" y="3" width="5" height="18" rx="1" fill="currentColor"/><rect x="14" y="3" width="5" height="18" rx="1" fill="currentColor"/></svg>'
      : '<svg viewBox="0 0 24 24" width="17" height="17"><polygon points="5,2 22,12 5,22" fill="currentColor"/></svg>';
  }
  syncDiscSpin();

  // Update seek bar (only if not dragging)
  if (!lyricsDragging) {
    updateSeekUI(state.progress);
  }
  const timeTotal = document.getElementById('ly-time-total');
  if (timeTotal) timeTotal.textContent = fmt(state.duration);

  // Update current lyric highlight
  if (lyricLines.length > 0) {
    // 入场动画有显影时间，时钟提前 0.3s 点亮对冲——唱到那句时字已经站定，卡拉OK的老规矩
    const LYRIC_LEAD = 0.3;
    let idx = -1;
    for (let i = lyricLines.length - 1; i >= 0; i--) {
      if (state.currentTime + LYRIC_LEAD >= lyricLines[i].time) { idx = i; break; }
    }
    if (idx !== currentLyricIdx) {
      currentLyricIdx = idx;
      updateBigLine(idx);
      // 首次点亮才拆字，拆一次终身保留：切歌=纯文本秒开，每句第一次轮到时拆 20 来个 span，之后永远只翻 class。
      lyricsLineEls.forEach((el, i) => {
        const on = i === idx;
        if (on && !el.dataset.ch) {
          el.dataset.ch = '1';
          const t = el.querySelector('.ly-text');
          if (t) t.innerHTML = charSpans(t.textContent);
          const tr = el.querySelector('.ly-trans');
          if (tr) tr.innerHTML = charSpans(tr.textContent, 140);
        }
        el.classList.toggle('active', on);
      });
      // Auto-scroll
      if (idx >= 0 && lyricsLineEls[idx] && performance.now() >= lyricAutoScrollLockedUntil) {
        const container = document.getElementById('ly-lines-container');
        const el = lyricsLineEls[idx];
        if (container) {
          glideLyricsTo(container,
            el.offsetTop - container.clientHeight / 2 + el.clientHeight / 2);
        }
      }
    }
  }
}

// NetEase play counts: local listenCount can't be pushed up, but NetEase's own
// per-song record (fed by our scrobbles) can be pulled down. Cached 10 min, shown side by side.
let neteaseCounts = null, neteaseCountsAt = 0;
async function loadNeteaseCounts() {
  if (neteaseCounts && Date.now() - neteaseCountsAt < 10 * 60e3) return neteaseCounts;
  try {
    const d = await api('/music/netease/record?type=0');
    const m = new Map(); (d.songs || []).forEach(r => { if (r.songId != null) m.set(String(r.songId), r.playCount || 0); });
    neteaseCounts = m; neteaseCountsAt = Date.now();
  } catch (_) { if (!neteaseCounts) neteaseCounts = new Map(); }
  return neteaseCounts;
}
async function loadMemory(songId) {
  const mv = document.getElementById('memory-view');
  if (!mv) return;
  try {
    const [d, counts] = await Promise.all([api('/music/memory?id=' + songId), loadNeteaseCounts().catch(() => new Map())]);
    const mem = d.memory || {};
    if (counts && counts.has(String(songId))) mem.neteaseCount = counts.get(String(songId));
    renderMemory(mv, mem, songId);
  } catch {
    mv.querySelector('.sm-body').innerHTML = '<div class="sm-empty">批注本没翻开，等会儿再点一下</div>';
  }
}

function renderMemory(mv, mem, songId) {
  const fmtDate = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    return (d.getMonth() + 1) + '/' + d.getDate();
  };

  /* 批注先读后写：已有批注/喜欢的句子/标签摆出来给人读，输入框永远是空的「再记一笔」，保存＝追加，历史永远在上面看得见。 */
  let meta = '';
  if (mem.listenCount > 0) meta += `<span>听过 ${mem.listenCount} 次</span>`;
  if (mem.neteaseCount > 0) meta += `<span>网易云 ×${mem.neteaseCount}</span>`;
  if (mem.togetherCount > 0) meta += `<span>一起听完 ${mem.togetherCount} 次</span>`;
  if (mem.bpm) meta += `<span>${mem.bpm} BPM</span>`;
  if (mem.firstListened) meta += `<span>初遇 ${fmtDate(mem.firstListened)}</span>`;
  if (mem.notedBy) meta += `<span>上次批注：${(mem.notedBy === 'fog' || mem.notedBy === 'ai') ? aiName() : herName()} ${fmtDate(mem.notedAt)}</span>`;
  const cur = state.song && String(state.song.songId) === String(songId) ? state.song : null;
  const cover = (cur && cur.cover) || mem.cover || '';
  const sname = (cur && cur.name) || mem.name || '', sartist = (cur && cur.artist) || mem.artist || '';
  let body = `<div class="sm-song">${coverBox(cover, 'sm-song-cover')}<div class="sm-song-info"><div class="sm-song-name">${esc(sname)}</div><div class="sm-song-artist">${esc(sartist)}</div>${meta ? '<div class="sm-meta">' + meta + '</div>' : ''}</div></div>`;
  if (mem.feeling) body += `<div class="sm-feeling">${esc(mem.feeling)}</div>`;
  const noteLog = (mem.noteLog && mem.noteLog.length) ? mem.noteLog : (mem.notes ? [{ by: mem.notedBy || 'anko', at: mem.notedAt, text: mem.notes }] : []);
  if (noteLog.length) {
    body += '<div class="sm-sec">批注</div>';
    noteLog.forEach(n => {
      const who = (n.by === 'fog' || n.by === 'rime' || n.by === 'ai') ? aiName() : herName();
      body += `<div class="sm-note"><div class="sm-note-hd"><span class="sm-note-who">${esc(who)}</span>${n.at ? '<span class="sm-note-when">' + fmtDate(n.at) + '</span>' : ''}</div><div class="sm-notes">${esc(n.text)}</div></div>`;
    });
  }
  if (mem.favoriteLines && mem.favoriteLines.length > 0) {
    body += '<div class="sm-sec">记过的句子</div><div class="sm-fav-lines">';
    mem.favoriteLines.forEach(l => { body += `<div class="sm-fav-line">${esc(l)}</div>`; });
    body += '</div>';
  }
  if (mem.tags && mem.tags.length > 0) {
    body += '<div class="sm-tags">';
    mem.tags.forEach(t => { body += `<span class="sm-tag">${esc(t)}</span>`; });
    body += '</div>';
  }
  if (!mem.notes && !(mem.favoriteLines || []).length && !mem.feeling) {
    body += '<div class="sm-empty" style="padding:24px 0">这首还没有批注——写下第一笔吧</div>';
  }
  body += `<div class="sm-write"><div class="sm-sec" style="padding-top:0">再记一笔</div>
    <textarea class="sm-edit" id="sm-notes-edit" rows="3" placeholder="听到它的场景、想到的人、随便一句话。保存后接在上面，不覆盖。"></textarea>
    <input class="sm-edit sm-edit-tags" id="sm-tags-edit" placeholder="标签（空格隔开，比如：深夜 通勤 单曲循环）" value="${esc((mem.tags || []).join(' '))}">
    <button class="sm-save" id="sm-save-btn">收进批注本</button></div>`;

  mv.innerHTML = `
    <div class="sm-header">
      <button class="sm-close" id="sm-close-btn">&times;</button>
      <span class="sm-header-title">歌的批注</span>
      <button class="sm-refresh" id="sm-refresh-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      </button>
    </div>
    <div class="sm-body">${body}</div>`;

  document.getElementById('sm-close-btn').addEventListener('click', closeMemory);
  document.getElementById('sm-refresh-btn').addEventListener('click', () => loadMemory(songId));
  const lineForNote = memoryLine; memoryLine = '';
  if (lineForNote) {
    const ta = document.getElementById('sm-notes-edit');
    ta.value = '「' + lineForNote + '」\n';
    document.querySelector('.sm-write')?.scrollIntoView({ block: 'end' });
    ta.focus(); try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch {}
  }
  document.getElementById('sm-save-btn').addEventListener('click', async () => {
    const btn = document.getElementById('sm-save-btn');
    const fresh = document.getElementById('sm-notes-edit').value.trim();
    btn.disabled = true; btn.textContent = '收…';
    try {
      const favs = (mem.favoriteLines || []).slice();
      if (lineForNote && !favs.includes(lineForNote)) favs.push(lineForNote);
      await apiPost('/music/memory', {
        songId,
        action: 'note',
        note: fresh,   // 只递新一笔，服务端记成一条（谁、哪天、写了什么）
        favoriteLines: favs,
        tags: document.getElementById('sm-tags-edit').value.split(/\s+/).filter(Boolean),
        name: state.song?.name || mem.name || '',
        artist: state.song?.artist || mem.artist || '',
        by: 'anko',
      });
      showToast('批注收好了');
      loadMemory(songId);
    } catch {
      showToast('没存上，再试一次');
      btn.disabled = false; btn.textContent = '收进批注本';
    }
  });
}

function openComments(song) {

function cmtCard(c, hot) {
  const d = c.time ? new Date(c.time) : null;
  const when = d ? `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}` : '';
  // 网易给的头像是 http 链接,https 页面下会被拦成混合内容——升成 https(它家 CDN 支持)
  const ava = (c.avatar || '').replace(/^http:/, 'https:');
  return `<div class="cm-item${hot ? ' hot' : ''}">
    <div class="cm-head">${ava ? `<img class="cm-ava" src="${esc(ava)}?param=60y60" loading="lazy" alt="">` : ''}<span class="cm-user">${esc(c.user)}</span>${hot ? '<span class="cm-hot-tag">热评</span>' : ''}</div>
    <div class="cm-text">${esc(c.content)}</div>
    <div class="cm-foot"><span>♥ ${c.liked || 0}</span><span>${when}</span></div>
  </div>`;
}

async function loadComments(songId, first) {
  const bodyEl = document.getElementById('cm-body');
  if (!bodyEl) return;
  try {
    const d = await api(`/music/comments?id=${songId}&offset=${cmtOffset}&limit=20`);
    let html = '';
    if (first && d.hot && d.hot.length) {
      html += d.hot.map(c => cmtCard(c, true)).join('');
      html += '<div class="cm-divider">最新评论</div>';
    }
    html += (d.comments || []).map(c => cmtCard(c, false)).join('');
    if (first) bodyEl.innerHTML = html || '<div class="sm-empty">这首还没人留言</div>';
    else {
      const more = document.getElementById('cm-more'); if (more) more.remove();
      bodyEl.insertAdjacentHTML('beforeend', html);
    }
    cmtOffset += (d.comments || []).length;
    if (d.more) {
      bodyEl.insertAdjacentHTML('beforeend', '<button class="sm-save cm-more" id="cm-more">再翻一页</button>');
      document.getElementById('cm-more').addEventListener('click', () => {
        document.getElementById('cm-more').textContent = '翻…';
        loadComments(songId, false);
      });
    }
  } catch {
    if (first) bodyEl.innerHTML = '<div class="sm-empty">评论暂时取不到（网易那边没应门）</div>';
  }
}

    <div class="qv-item" data-ci="${i}">
      ${coverBox(s.cover, 'qv-cover')}
      <div class="qv-info"><b>${esc(s.name || '')}</b><small>${esc(s.artist || '')}</small></div>

  const total = state.queue.length + state.ctx.length;
  const modeName = { order: '顺序', one: '单曲循环', shuffle: '随机' }[playMode] || '';
  qv.innerHTML = `
    <div class="sm-header">
      <button class="sm-close" id="qv-close">&times;</button>

    </div>
    <div class="sm-body">
      ${rows ? `<div class="qv-sec">插播</div>${rows}` : ''}
      ${ctxRows ? `<div class="qv-sec">歌单接着放${modeName ? ' · ' + modeName : ''}</div>${ctxRows}` : ''}
      ${total ? '' : '<div class="sm-empty">队列空空，点一首或让 ${esc(aiName())} 递一首</div>'}
    </div>`;
  document.getElementById('qv-close').addEventListener('click', closeQueue);
  qv.querySelectorAll('[data-now]').forEach(btn => btn.addEventListener('click', () => {
    const i = Number(btn.dataset.now);
    const song = state.queue.splice(i, 1)[0];
    if (song) loadAndPlay(song);
    renderQueue(); renderNpBar();
  }));
  qv.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', () => {
    state.queue.splice(Number(btn.dataset.del), 1);
    renderQueue(); renderNpBar();
  }));
  qv.querySelectorAll('[data-ctxnow]').forEach(btn => btn.addEventListener('click', () => {
    const i = Number(btn.dataset.ctxnow);
    const song = state.ctx[i];
    if (song) playSong(song, state.ctx.slice(i + 1));
    renderQueue();
  }));
  qv.querySelectorAll('[data-ctxdel]').forEach(btn => btn.addEventListener('click', () => {
    state.ctx.splice(Number(btn.dataset.ctxdel), 1);
    renderQueue(); renderNpBar();
  }));
}

// ── MV：歌词页 🎬 钮 → /music/mv 查片源 → 全屏放；开MV时暂停音乐，关掉接着放。 ──
let mvWasPlaying = false;

async function openMv(song) {
  if (!song || !song.songId) return;
  const btn = document.getElementById('ly-mv-btn');
  if (btn) btn.disabled = true;
  let d;
  try { d = await api('/music/mv?id=' + song.songId); }
  catch { showToast('没找到 MV'); if (btn) btn.disabled = false; return; }
  if (btn) btn.disabled = false;
  if (!d.ok) { showToast(d.msg || '这首没有MV'); return; }
  const mv = document.getElementById('mv-view');
  if (!mv) return;
  mvWasPlaying = state.playing;
  audio.pause();
  const quals = Object.keys(d.urls || {}).sort((a, b) => b - a);
  mv.classList.remove('hidden');
  mv.innerHTML = `
    <div class="mv-top">
      <button class="sm-close" id="mv-close">&times;</button>
      <span class="mv-title">${esc(d.name || song.name)}<small>${esc(d.artist || song.artist || '')}</small></span>
      ${quals.length > 1 ? `<select class="mv-qual" id="mv-qual">${quals.map(q => `<option value="${q}">${q}P</option>`).join('')}</select>` : ''}
      <button class="mv-qual" id="mv-pip" type="button">悬浮</button>
    </div>
    <video id="mv-video" src="${esc(d.url)}" controls autoplay playsinline referrerpolicy="no-referrer"></video>`;
  document.getElementById('mv-close').addEventListener('click', closeMv);
  const qsel = document.getElementById('mv-qual');
  if (qsel) qsel.addEventListener('change', () => {
    const v = document.getElementById('mv-video');
    const t = v.currentTime;
    v.src = d.urls[qsel.value]; v.currentTime = t; v.play().catch(() => {});
  });
  /* 浏览器原生画中画：点「悬浮」→ 视频飘成系统级小窗，放映厅壳自动藏起但不杀视频；关掉小窗时才真正收场（leavepictureinpicture → closeMv）。 */
  const vEl = document.getElementById('mv-video');
  const pipBtn = document.getElementById('mv-pip');
  if (pipBtn && vEl) {
    pipBtn.addEventListener('click', async () => {
      if (!document.pictureInPictureEnabled || !vEl.requestPictureInPicture) {
        showToast('这个浏览器开不了悬浮窗'); return;
      }
      try { await vEl.requestPictureInPicture(); }
      catch { showToast('悬浮窗没开起来，再点一次'); }
    });
    vEl.addEventListener('enterpictureinpicture', () => {
      const mv2 = document.getElementById('mv-view');
      if (mv2) mv2.classList.add('hidden');   // 只藏壳,视频活着飘在外面
      showToast('MV 开在小窗里了');
    });
    vEl.addEventListener('leavepictureinpicture', () => closeMv());
  }
}

function closeMv() {
  const mv = document.getElementById('mv-view');
  if (!mv) return;
  const v = document.getElementById('mv-video');
  if (!v && mv.classList.contains('hidden')) return;   // 早就收干净了
  if (v) {
    try { if (document.pictureInPictureElement === v) document.exitPictureInPicture(); } catch {}
    v.pause(); v.removeAttribute('src'); v.load();
  }
  mv.classList.add('hidden');
  mv.innerHTML = '';
  if (mvWasPlaying) { mvWasPlaying = false; audio.play().catch(() => {}); }
}

// ── 远程点播：5 秒一问 /music/remote，有歌就接。正在放歌 → 排进队列；闲着 → 直接开播。 ──
async function pollRemote() {
  try {
    const d = await api('/music/remote');
    if (d && typeof d.netease_login === 'boolean') setLoginBanner(!d.netease_login);
    if (!d.ok || !d.songs) return;
    for (const raw of d.songs) {
      const song = { name: raw.name || '', artist: raw.artist || '', album: raw.album || '',
                     cover: raw.cover || '', songId: raw.songId || raw.id };
      if (!song.songId) continue;
      if (raw.mode === 'now' || !(state.song && (state.playing || state.queue.length))) {
        // diange --now 或播放器闲着:立刻开播
        showToast(`${aiName()}点了「${song.name}」，现在放`);
        if (raw.at > 0 && state.song && String(state.song.songId) === String(song.songId) && audio.src) {
          try { audio.currentTime = Number(raw.at); } catch (_) {}      // same song already loaded: just move the needle
          audio.play().catch(() => {});
        } else {
          loadAndPlay(song);
          if (raw.at > 0) seekWhenReady(Number(raw.at));
        }   // 官端卡片点歌词句 → 从那句开始放
        } else {
          state.queue.push(song);
        showToast(`${aiName()}插了「${song.name}」，排在后面`);
      }
    }
    renderNpBar(); renderQueue();
  } catch {}
}
setInterval(() => { if (!document.hidden) pollRemote(); }, 1000);   // foreground 1s: card clicks should feel instant   // 前台走定时器；后台由 timeupdate 驱动

// ── 播放心跳：5 秒一报 now-playing 给服务端（存内存），官端 Apps 卡片靠它画进度条+跟唱高亮。 ──
function beatNow() {
  try {
    if (!state.song || !state.song.songId) return;
    apiPost('/music/now', {
      songId: String(state.song.songId), name: state.song.name || '',
      artist: state.song.artist || '',
      position: Math.round((audio.currentTime || 0) * 10) / 10,
      duration: Math.round((audio.duration || state.duration || 0) * 10) / 10,
      playing: !!state.playing && !audio.paused,
    }).catch(() => {});
  } catch {}
}
setInterval(() => { if (!document.hidden) beatNow(); }, 5000);
audio.addEventListener('seeked', () => beatNow());     // report right after a seek so cards catch up at once
audio.addEventListener('play', () => beatNow());   // 前台定时器；后台由 timeupdate 驱动

// ── Init ──
setupMediaSession();
loadLikedIds();   // 红心账本开机就装（本地+网易云合账）
applySkin(getSkin());   // 皮肤：开场就贴好，顺手把玻璃底建出来
init();
</script>
