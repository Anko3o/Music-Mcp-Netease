async function renderDiscover(container) {
  container.innerHTML = '<div class="discover-tab"><div class="spinner"></div></div>';

  // Daily section now shows the account's official NetEase daily recommendations,
  // 正牌 ☁ 网易日推搬进 Discover 常驻(唯一展示位,主页/歌单页的长列表已撤)
  const [plRes, dailyRes] = await Promise.all([
    api('/music/playlist').catch(() => ({})),
    api('/music/netease/daily').catch(() => ({}))
  ]);
  if (plRes.ok) (plRes.songs || []).forEach(s => likedAdd(s.songId));   // merge, never overwrite
  if (dailyRes.ok) {
    dailySongs = (dailyRes.songs || []).map(s => ({
      name: s.name, artist: s.artist, album: s.album, cover: s.cover || '',
      songId: s.songId || s.id, reason: s.reason || ''
    }));
  }

  container.innerHTML = buildDiscoverHTML();
  bindDiscoverEvents(container);
}

function buildDiscoverHTML() {
  let html = `<div class="discover-tab">
    <div class="discover-top">
      <div class="discover-title">Discover</div>
      <div class="search-bar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" opacity="0.4"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input class="search-input" id="search-input" placeholder="search songs or artists..." />
        <button class="search-clear hidden" id="search-clear"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        <button class="search-go" id="search-go">Go</button>
      </div>
    </div>
    <!-- Roam pill retired (engine fallback kept in code). -->
    <div id="search-results"></div>`;

  // Daily picks (show when no search results)
  if (dailySongs.length > 0 && searchResults.length === 0) {
    html += `<div class="section">
      <div class="section-hd">☁ 今日日推</div>
      <div class="recent-list" id="daily-list">`;
    dailySongs.forEach((s, i) => {
      const liked = likedIds.has(s.songId);
      html += `
        <div class="recent-row" data-daily="${i}">
          ${coverBox(s.cover, 'recent-row-cover')}
          <div class="recent-row-info">
            <div class="recent-row-name">${esc(s.name)}</div>
            <div class="recent-row-artist">${esc(s.artist)}${s.reason ? ` <span class="daily-reason">${esc(s.reason)}</span>` : ''}</div>
          </div>
          <button class="like-btn ${liked ? 'liked' : ''}" data-like-daily="${i}">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="${liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </button>
        </div>`;
    });
    html += '</div></div>';
  }

  html += '</div>';
  return html;
}

function bindDiscoverEvents(container) {
  const searchInput = container.querySelector('#search-input');
  const searchGo = container.querySelector('#search-go');
  const searchClear = container.querySelector('#search-clear');

  searchGo.addEventListener('click', () => doSearch(searchInput.value));
  searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(searchInput.value); });
  searchInput.addEventListener('input', () => {
    searchClear.classList.toggle('hidden', !searchInput.value);
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchClear.classList.add('hidden');
    searchResults = [];
    searchTouched = false;
    renderTab();
  });

  // Daily clicks(点一首,日推后面的整列排进播放上下文)
  container.querySelectorAll('[data-daily]').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('.like-btn')) return;
      const i = parseInt(row.dataset.daily);
      playSong(dailySongs[i], dailySongs.slice(i + 1));
    });
  });
  container.querySelectorAll('[data-like-daily]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.likeDaily);
      likeSong(dailySongs[i]);
    });
  });
}

async function doSearch(q) {
  if (!q?.trim()) return;
  const goBtn = document.getElementById('search-go');
  if (goBtn) goBtn.textContent = '...';
  searchTouched = true;
  try {
    const d = await api('/music/search?q=' + encodeURIComponent(q));
    searchResults = (d.songs || []).map(t => ({
      name: t.name, artist: t.artist, album: t.album, cover: t.cover || '', songId: t.id
    }));
  } catch { searchResults = []; }
  renderSearchResults();
  if (goBtn) goBtn.textContent = 'Go';
}

function renderSearchResults() {
  const area = document.getElementById('search-results');
  if (!area) return;
  if (searchResults.length === 0) {
    area.innerHTML = searchTouched ? '<div class="empty-line">没找到这首歌,换个关键词?</div>' : '';
    return;
  }

  // Hide daily
  const dailySection = document.querySelector('#daily-list')?.closest('.section');
  if (dailySection) dailySection.style.display = 'none';

  let html = '<div class="section"><div class="section-hd en">Search Results</div><div class="song-list">';
  searchResults.forEach((s, i) => {
    const liked = likedIds.has(s.songId);
    html += `
      <div class="song-row" data-search="${i}">
        ${coverBox(s.cover, 'song-cover')}
        <div class="song-info">
          <div class="song-name">${esc(s.name)}</div>
          <div class="song-artist">${esc(s.artist)}</div>
        </div>
        <button class="like-btn ${liked ? 'liked' : ''}" data-like-search="${i}">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="${liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </button>
        <button class="queue-btn" data-queue="${i}" title="add to queue">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>`;
  });
  html += '</div></div>';
  area.innerHTML = html;

  // Bind
  area.querySelectorAll('[data-search]').forEach(row => {
    row.querySelector('.song-cover')?.addEventListener('click', () => {
      playSong(searchResults[parseInt(row.dataset.search)]);
    });
    row.querySelector('.song-info')?.addEventListener('click', () => {
      playSong(searchResults[parseInt(row.dataset.search)]);
    });
  });
  area.querySelectorAll('[data-like-search]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.likeSearch);
      likeSong(searchResults[i]);
    });
  });
  area.querySelectorAll('[data-queue]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.queue);
      addToQueue(searchResults[i]);
    });
  });
}

// Like / unlike.
// 以前只有 Discover 和搜索结果的列表里挂了心,正在放的这首反而收藏不了;
// 现在播放条和歌词页都挂了心,而且能取消:再点一下就从「喜欢」里拿出来。)
async function likeSong(s) {
  if (!s?.songId) return;
  /* Hearts sync to the cookie account's own NetEase liked list.
     旁路异步走,本地红心不等网易;同步失败弹一句,不拦操作。 */
  const syncNe = (like) => {
    if (!/^\d+$/.test(String(s.songId))) return;
    apiPost('/music/netease/like', { songId: String(s.songId), like })
      .then(r => { if (!r.ok) showToast('网易云那边没同步上'); })
      .catch(() => {});
  };
  if (likedIds.has(s.songId)) {
    await apiPost('/music/playlist/remove', { songId: s.songId });
    likedDel(s.songId);
    syncNe(false);
    showToast('取消收藏（网易云同步）');
  } else {
    await apiPost('/music/playlist/add', { song: s, by: 'user' });
    likedAdd(s.songId);
    syncNe(true);
    showToast('已收藏 ♥（网易云同步）');
  }
  refreshLikeHearts();
  // Re-render discover to update heart icons
  if (currentTab === 'discover') renderTab();
}
// 只把心的填充状态刷一遍,不重建歌词页——重建会把滚动位置和唱到哪一句都弄丢
function refreshLikeHearts() {
  const id = state.song && state.song.songId;
  const on = !!(id && likedIds.has(id));
  document.querySelectorAll('[data-like-now]').forEach(btn => {
    btn.classList.toggle('liked', on);
    const svg = btn.querySelector('svg');
    if (svg) svg.setAttribute('fill', on ? 'currentColor' : 'none');
  });
}
function heartSvg(on) {
  return `<svg viewBox="0 0 24 24" width="18" height="18" fill="${on ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 000-7.8z"/></svg>`;
}

// ── Play Song helper ──
/* Queue architecture: a manual priority queue (never overwritten)
   点第10首变490;插入的歌应该是候选第一才对」)——她说得全对。病根:手动插的歌和
   「歌单剩余」共用一个 state.queue,后者每次整袋覆盖前者。
   分家:state.queue=优先队列(只装手动/远程插的歌,永远先播,谁也不许覆盖);
        state.ctx=播放上下文(当前歌单的后续,切歌单只换它)。
   随手加播放模式:顺序 order / 单曲循环 one / 随机 shuffle(播放条上一颗钮循环切)。 */
state.ctx = state.ctx || [];
let playMode = (() => { try { const v = localStorage.getItem('music_play_mode');
  return ['order', 'one', 'shuffle'].includes(v) ? v : 'order'; } catch { return 'order'; } })();
function setPlayMode(m) {
  playMode = m;
  try { localStorage.setItem('music_play_mode', m); } catch {}
  renderNpBar();
  showToast({ order: '顺序播放', one: '单曲循环', shuffle: '随机播放' }[m]);
}
const MODE_ICONS = {
  order: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h14"/><path d="M13 6l6 6-6 6"/></svg>',
  one: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 01-4 4H3"/><text x="12" y="15" font-size="8" fill="currentColor" stroke="none" text-anchor="middle">1</text></svg>',
  shuffle: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>',
};

function playSong(s, rest) {
  if (!s) return;
  if (state.song) state.history.push(state.song);
  loadAndPlay(s);
  // rest=这份歌单在这首之后的余下部分 → 只换上下文,不碰优先队列
  state.ctx = (rest && rest.length > 0) ? rest.slice() : [];
  renderNpBar();
}

/* np-bar renders on every audio tick; rebuilding DOM 4-5x/second swallowed taps
   renderNpBar 挂在 onAudioChange 上,timeupdate 每秒喂 4~5 次,整条播放条
   **每秒整块重建 HTML 四五遍**:按钮拆了装装了拆——她手指落下的瞬间按钮正好被换新,
   点击被吞=「放不出去」;持续重建=动画卡,chat 页 iframe 里双倍放大。
   修:指纹比对——歌/播放态/队列数/红心/模式都没变就只挪进度条,不动一根 DOM。 */
let npSig = '';
function renderNpBar() {
  const bar = document.getElementById('np-bar');
  if (!bar) return;
  const s = state.song;
  if (!s) { bar.classList.add('hidden'); npSig = ''; return; }
  bar.classList.remove('hidden');

  const sig = [s.songId, s.name, state.playing, state.queue.length,
               likedIds.has(s.songId), playMode].join('~');
  if (sig === npSig) {
    const fill = bar.querySelector('.np-progress');
    if (fill) fill.style.width = (state.progress * 100) + '%';
    return;
  }
  npSig = sig;

  bar.innerHTML = `
    <div class="np-progress" style="width:${(state.progress * 100)}%"></div>
    ${coverBox(s.cover, 'np-cover')}
    <div class="np-info">
      <div class="np-eyebrow" aria-hidden="true">Now playing…</div>
      <div class="np-name">${esc(s.name)}</div>
      <div class="np-artist">${esc(s.artist)}</div>
    </div>
    <button class="np-queue-btn" id="np-mode-btn" aria-label="播放模式" title="播放模式">${MODE_ICONS[playMode]}</button>
    ${state.queue.length ? `<button class="np-queue-btn" id="np-queue-btn" aria-label="接下来播">▤ ${state.queue.length}</button>` : ''}
    ${s.songId ? `<button class="np-like-btn like-btn${likedIds.has(s.songId) ? ' liked' : ''}" id="np-like-btn" data-like-now aria-label="收藏这首">${heartSvg(likedIds.has(s.songId))}</button>` : ''}
    <button class="np-btn" id="np-play-btn">
      ${state.playing
        ? '<svg viewBox="0 0 24 24" width="20" height="20"><rect x="5" y="3" width="5" height="18" rx="1" fill="currentColor"/><rect x="14" y="3" width="5" height="18" rx="1" fill="currentColor"/></svg>'
        : '<svg viewBox="0 0 24 24" width="20" height="20"><polygon points="5,2 22,12 5,22" fill="currentColor"/></svg>'}
    </button>
    <button class="np-next-btn" id="np-next-btn">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" fill="currentColor"/></svg>
    </button>`;

  const npLike = document.getElementById('np-like-btn');
  if (npLike) npLike.addEventListener('click', e => { e.stopPropagation(); likeSong(state.song); });
  const npQueue = document.getElementById('np-queue-btn');
  if (npQueue) npQueue.addEventListener('click', e => { e.stopPropagation(); openQueue(); });
  const npMode = document.getElementById('np-mode-btn');
  if (npMode) npMode.addEventListener('click', e => {
    e.stopPropagation();
    setPlayMode({ order: 'one', one: 'shuffle', shuffle: 'order' }[playMode]);
  });
  document.getElementById('np-play-btn').addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
  document.getElementById('np-next-btn').addEventListener('click', e => { e.stopPropagation(); playNext(); });
  updatePlayerTitle();
  syncMediaSession();
}

  if (lyLike) lyLike.addEventListener('click', () => likeSong(state.song));

  // Seek bar events
  bindSeekBar();
}

function bindSeekBar() {
  const seekEl = document.getElementById('ly-seek');
  if (!seekEl) return;

  const getPos = (clientX) => {
    const rect = seekEl.getBoundingClientRect();
    return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  };

  const onStart = (clientX) => {
    lyricsDragging = true;
    lyricsDragRatio = getPos(clientX);
    updateSeekUI(lyricsDragRatio);
  };

  const onMove = (clientX) => {
    if (!lyricsDragging) return;
    lyricsDragRatio = getPos(clientX);
    updateSeekUI(lyricsDragRatio);
  };

  const onEnd = () => {
    if (!lyricsDragging) return;
    lyricsDragging = false;
    if (state.duration) {
      audio.currentTime = lyricsDragRatio * state.duration;
    }
  };

  // One pointer stream works for mouse, pen, and touch, without leaking window listeners
  // every time the lyrics view is rendered.
  seekEl.addEventListener('pointerdown', e => {
    e.preventDefault();
    seekEl.setPointerCapture?.(e.pointerId);
    onStart(e.clientX);
  });
  seekEl.addEventListener('pointermove', e => onMove(e.clientX));
  seekEl.addEventListener('pointerup', onEnd);
  seekEl.addEventListener('pointercancel', onEnd);
}

function updateSeekUI(ratio) {
  const fill = document.getElementById('ly-seek-fill');
  const thumb = document.getElementById('ly-seek-thumb');
  const timeCur = document.getElementById('ly-time-current');
  if (fill) fill.style.width = (ratio * 100) + '%';
  if (thumb) thumb.style.left = (ratio * 100) + '%';
  if (timeCur && state.duration) timeCur.textContent = fmt(ratio * state.duration);
}

/* Song-switch speedup: per-song lyric cache; duplicate onSongChange work removed.
   各画一遍整页列表=全部翻倍。加按歌缓存:同一首只请求+解析一次,重复调用只重画;
   连续切歌时旧请求作废(songId 校验),不会把上一首的词画到下一首头上。 */
const lyricFetchCache = new Map();
async function loadLyrics() {
  const s = state.song;
  if (!s?.songId) return;
  const sid = String(s.songId);

  lyricLines = [];
  lyricTransMap = new Map();
  currentLyricIdx = -1;

  let entry = lyricFetchCache.get(sid);
  if (!entry) {
    try {
      const d = await api('/music/lyric?id=' + sid);
      entry = { lines: [], trans: new Map() };
      if (d.ok && d.lrc) entry.lines = parseLrc(d.lrc);
      if (d.tlyric) {
        for (const tl of parseLrc(d.tlyric)) entry.trans.set(Math.round(tl.time * 100), tl.text);
      }
      lyricFetchCache.set(sid, entry);
      if (lyricFetchCache.size > 40) lyricFetchCache.delete(lyricFetchCache.keys().next().value);
    } catch { entry = { lines: [], trans: new Map() }; }
  }
  if (String(state.song?.songId) !== sid) return;   // 等待期间又切歌了,这趟作废
  lyricLines = entry.lines;
  lyricTransMap = entry.trans;

  renderLyricLines();
}

/* Per-character lyric animation, applied in the lyrics list itself:
   概念借鉴 folia-major,代码是自家的):当前句逐字错峰点亮,唱过就恢复整句。 */
function charSpans(text, base = 0) {
  // Chars are split lazily on first activation and kept forever —
  // 旧版每次换句现场 innerHTML 重建+回流+一口气起 30 个动画,句头必卡。
  // 现在渲染歌词列表时就拆好,激活只翻 class,零重建。延迟写在 --d 变量里,
  // 只有 .active 时动画才引用它。词包字(.ly-w):英文单词不从中间拆行。
  let i = 0, out = '';
  for (const seg of String(text).split(/(\s+)/)) {
    if (!seg) continue;
    if (/^\s+$/.test(seg)) { out += esc(seg); continue; }
    out += '<span class="ly-w">' + Array.from(seg).map(ch =>
      `<span class="ly-ch" style="--d:${base + Math.min(i++ * 22, 500)}ms">${esc(ch)}</span>`).join('') + '</span>';
  }
  return out;
}

function renderLyricLines() {
  const container = document.getElementById('ly-lines-container');
  if (!container) return;

  if (lyricLines.length === 0) {
    container.innerHTML = '<div class="ly-no-lyrics">no lyrics available</div>';
    lyricsLineEls = [];
    return;
  }

  let html = '';
  lyricLines.forEach((l, i) => {
    const trans = lyricTransMap.get(Math.round(l.time * 100));
    html += `<div class="ly-line" data-line="${i}" data-time="${l.time}"><span class="ly-text">${esc(l.text)}</span>${trans ? '<div class="ly-trans">' + esc(trans) + '</div>' : ''}</div>`;
  });
  container.innerHTML = html;
  lyricsLineEls = container.querySelectorAll('.ly-line');

  // 她一上手就让位：4 秒内不自动跟，正在滑的也立刻松手（不然会跟她抢滚动条）
  const pauseAutoScroll = () => {
    lyricAutoScrollLockedUntil = performance.now() + 4000;
    stopLyricGlide();
  };
  container.addEventListener('wheel', pauseAutoScroll, { passive: true });
  container.addEventListener('touchmove', pauseAutoScroll, { passive: true });

  // Click to seek;长按=选句分享(8-31)。
  // Long-press with a movement threshold: tiny finger jitter must not cancel the timer,
  // 我们的长按从来没赢过:任何 touchmove/mousemove 都直接取消计时,而手指按住必有微抖,
  // 550ms 永远数不满(之前被原生菜单盖着看不出来)。修:取消挂**位移阈值**,挪 >10px 才算想滑动。
  lyricsLineEls.forEach(el => {
    let lpTimer = 0, lpFired = false, lpX = 0, lpY = 0;
    const pt = (e) => e.touches && e.touches[0] ? e.touches[0] : e;
    const lpStart = (e) => {
      lpFired = false;
      const p = pt(e); lpX = p.clientX; lpY = p.clientY;
      window.clearTimeout(lpTimer);
      lpTimer = window.setTimeout(() => {
        lpFired = true;
        const i = parseInt(el.dataset.line);
        if (!isNaN(i)) openLyricChat(i);
      }, 550);
    };
    const lpMove = (e) => {
      const p = pt(e);
      if (Math.abs(p.clientX - lpX) + Math.abs(p.clientY - lpY) > 10) window.clearTimeout(lpTimer);
    };
    const lpEnd = () => window.clearTimeout(lpTimer);
    el.addEventListener('touchstart', lpStart, { passive: true });
    el.addEventListener('touchmove', lpMove, { passive: true });
    el.addEventListener('touchend', lpEnd, { passive: true });
    el.addEventListener('touchcancel', lpEnd, { passive: true });
    el.addEventListener('mousedown', lpStart);
    el.addEventListener('mousemove', lpMove);
    el.addEventListener('mouseup', lpEnd);
    el.addEventListener('mouseleave', lpEnd);
    el.addEventListener('contextmenu', e => e.preventDefault());   // 原生菜单全程谢客,长按只归分享
    el.addEventListener('click', () => {
      if (lpFired) { lpFired = false; return; }   // 长按抬手别顺手 seek
      const time = parseFloat(el.dataset.time);
      if (!isNaN(time)) audio.currentTime = time;
    });
  });
}

/* ── 歌词惯性滚动（Lenis 的路子）──
   原来用 container.scrollTo({behavior:'smooth'})，曲线是浏览器给的、各家不一样、
   而且一旦排队就会突兀地跳。这里自己插值：每帧朝目标补上剩余距离的一小截，
   越接近越慢 —— 这就是 Lenis 的 lerp，damso 用的是 .12，照抄。

   lerp 直接乘会跟帧率绑死（120Hz 屏上快一倍），所以按 dt 归一化到 60fps。 */
const LYRIC_LERP = 0.12;
let lyricGlideRAF = 0;
let lyricGlideTarget = 0;
let lyricGlideLast = 0;

function glideLyricsTo(container, top) {
  const max = Math.max(0, container.scrollHeight - container.clientHeight);
  lyricGlideTarget = Math.max(0, Math.min(top, max));
  if (lyricGlideRAF) return;                       // 已经在滑了，改目标就行
  lyricGlideLast = performance.now();
  const step = now => {
    const dt = Math.min(now - lyricGlideLast, 50); // 切后台回来别一帧跳完
    lyricGlideLast = now;
    const cur = container.scrollTop;
    const diff = lyricGlideTarget - cur;
    if (Math.abs(diff) < 0.5) {
      container.scrollTop = lyricGlideTarget;
      lyricGlideRAF = 0;
      return;
    }
    const t = 1 - Math.pow(1 - LYRIC_LERP, dt / 16.667);
    container.scrollTop = cur + diff * t;
    lyricGlideRAF = requestAnimationFrame(step);
  };
  lyricGlideRAF = requestAnimationFrame(step);
}

function stopLyricGlide() {
  if (lyricGlideRAF) { cancelAnimationFrame(lyricGlideRAF); lyricGlideRAF = 0; }
}

/* 读一个元素当前的旋转角度（从合成后的矩阵反解），用来接着转 / 惯性停。 */
function currentRotation(el) {
  const t = getComputedStyle(el).transform;
  if (!t || t === 'none') return 0;
  const m = new DOMMatrixReadOnly(t);
  return Math.atan2(m.b, m.a) * 180 / Math.PI;
}

/* 唱片起转 / 停转。停转不是急停 —— 断电的唱盘会靠惯性再飘一段才停。 */
function syncDiscSpin() {
  const disc = document.getElementById('ly-disc');
  if (!disc) return;
  const spinning = disc.classList.contains('spinning');
  if (state.playing === spinning) return;              // 状态没变，别打断正在转的动画

  const deg = currentRotation(disc);
  if (state.playing) {
    disc.style.transition = 'none';
    disc.style.transform = '';
    disc.style.setProperty('--spin-from', deg + 'deg');  // 从停下的角度接着转，不回弹到 0
    disc.classList.add('spinning');
  } else {
    disc.classList.remove('spinning');                 // 脱离 animation，改由 transition 接管
    disc.style.transition = 'none';
    disc.style.transform = `rotate(${deg}deg)`;
    void disc.offsetWidth;                             // 定住这一帧，否则下面那句会被合并掉
    disc.style.transition = `transform var(--t-slow) var(--ease-out)`;
    disc.style.transform = `rotate(${deg + 22}deg)`;    // 再飘 22° 慢慢停
  }
}

function renderLyricsProgress() {
  if (!lyricsOpen) return;

  // Update play button
  const playBtn = document.getElementById('ly-play');
  if (playBtn) {
    playBtn.innerHTML = state.playing
      ? '<svg viewBox="0 0 24 24" width="17" height="17"><rect x="5" y="3" width="5" height="18" rx="1" fill="currentColor"/><rect x="14" y="3" width="5" height="18" rx="1" fill="currentColor"/></svg>'
      : '<svg viewBox="0 0 24 24" width="17" height="17"><polygon points="5,2 22,12 5,22" fill="currentColor"/></svg>';
  }
  syncDiscSpin();

  // Update seek bar (only if not dragging)
  if (!lyricsDragging) {
    updateSeekUI(state.progress);
  }
  const timeTotal = document.getElementById('ly-time-total');
  if (timeTotal) timeTotal.textContent = fmt(state.duration);

  // Update current lyric highlight
  if (lyricLines.length > 0) {
    // Slight lyric lead (0.3s) offsets the entrance animation's reveal time.
    // 唱到那句时字已经站定,卡拉OK的老规矩
    const LYRIC_LEAD = 0.3;
    let idx = -1;
    for (let i = lyricLines.length - 1; i >= 0; i--) {
      if (state.currentTime + LYRIC_LEAD >= lyricLines[i].time) { idx = i; break; }
    }
    if (idx !== currentLyricIdx) {
      currentLyricIdx = idx;
      // Per-char split happens on first activation only (cheap), then class toggles.
      // 的装台成本压在了切歌瞬间。改**首次点亮才拆字,拆一次终身保留**:
      // 切歌=纯文本秒开,每句第一次轮到时拆 20 来个 span(便宜),之后永远只翻 class。
      lyricsLineEls.forEach((el, i) => {
        const on = i === idx;
        if (on && !el.dataset.ch) {
          el.dataset.ch = '1';
          const t = el.querySelector('.ly-text');
          if (t) t.innerHTML = charSpans(t.textContent);
          const tr = el.querySelector('.ly-trans');
          if (tr) tr.innerHTML = charSpans(tr.textContent, 140);
        }
        el.classList.toggle('active', on);
      });
      // Auto-scroll
      if (idx >= 0 && lyricsLineEls[idx] && performance.now() >= lyricAutoScrollLockedUntil) {
        const container = document.getElementById('ly-lines-container');
        const el = lyricsLineEls[idx];
        if (container) {
          glideLyricsTo(container,
            el.offsetTop - container.clientHeight / 2 + el.clientHeight / 2);
        }
      }
    }
  }
}

/* Hand-written song notes:
   上游把面板锁在「先跑频谱分析」后面（librosa 没装，等于从出生就锁死），
   而且只读不写。现在：随时打开、直接写、点保存落进 music_memory.json。 */
function openMemory(songId) {
  memoryOpen = true;
  const mv = document.getElementById('memory-view');
  if (!mv) return;
  mv.classList.remove('hidden');
  mv.innerHTML = '<div class="sm-header"><button class="sm-close" id="sm-close-btn">&times;</button><span class="sm-header-title">歌的批注</span></div><div class="sm-body"><div class="sm-loading">翻批注本…</div></div>';
  document.getElementById('sm-close-btn').addEventListener('click', closeMemory);
  loadMemory(songId);
}

function closeMemory() {
  memoryOpen = false;
  const mv = document.getElementById('memory-view');
  if (mv) mv.classList.add('hidden');
}

async function loadMemory(songId) {
  const mv = document.getElementById('memory-view');
  if (!mv) return;
  try {
    const d = await api('/music/memory?id=' + songId);
    renderMemory(mv, d.memory || {}, songId);
  } catch {
    mv.querySelector('.sm-body').innerHTML = '<div class="sm-empty">批注本没翻开，等会儿再点一下</div>';
  }
}

function renderMemory(mv, mem, songId) {
  const fmtDate = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    return (d.getMonth() + 1) + '/' + d.getDate();
  };

  /* Read-then-write layout: existing notes displayed as text,
     旧版把已有批注塞在 textarea 里当可编辑文本——视觉上等于隐身。
     改成「先读后写」:已有批注/喜欢的句子/标签摆出来给人读,
     输入框永远是空的「再记一笔」,保存＝追加,历史永远在上面看得见。 */
  let body = '';
  if (mem.feeling) body += `<div class="sm-feeling">${esc(mem.feeling)}</div>`;
  if (mem.notes) body += `<div class="sm-notes">${esc(mem.notes)}</div>`;
  if (mem.favoriteLines && mem.favoriteLines.length > 0) {
    body += '<div class="sm-fav-title">♪ 分享过的句子</div><div class="sm-fav-lines">';
    mem.favoriteLines.forEach(l => { body += `<div class="sm-fav-line">${esc(l)}</div>`; });
    body += '</div>';
  }
  if (mem.tags && mem.tags.length > 0) {
    body += '<div class="sm-tags">';
    mem.tags.forEach(t => { body += `<span class="sm-tag">${esc(t)}</span>`; });
    body += '</div>';
  }
  if (!mem.notes && !(mem.favoriteLines || []).length && !mem.feeling) {
    body += '<div class="sm-empty" style="padding:24px 0">这首还没有批注——写下第一笔吧</div>';
  }
  body += `<textarea class="sm-edit" id="sm-notes-edit" rows="3" placeholder="再记一笔——听到它的场景、想到的人、随便一句话。保存后会接在上面，不覆盖。"></textarea>`;
  body += `<input class="sm-edit sm-edit-tags" id="sm-tags-edit" placeholder="标签（空格隔开）" value="${esc((mem.tags || []).join(' '))}">`;
  body += '<button class="sm-save" id="sm-save-btn">收进批注本</button>';
  body += '<div class="sm-meta">';
  if (mem.listenCount > 0) body += `<span>听过 ${mem.listenCount} 次</span>`;
  if (mem.togetherCount > 0) body += `<span>一起听完 ${mem.togetherCount} 次</span>`;
  if (mem.bpm) body += `<span>${mem.bpm} BPM</span>`;
  if (mem.firstListened) body += `<span>初遇 ${fmtDate(mem.firstListened)}</span>`;
  if (mem.notedBy) body += `<span>上次批注：${esc(mem.notedBy)} ${fmtDate(mem.notedAt)}</span>`;
  body += '</div>';

  mv.innerHTML = `
    <div class="sm-header">
      <button class="sm-close" id="sm-close-btn">&times;</button>
      <span class="sm-header-title">歌的批注</span>
      <button class="sm-refresh" id="sm-refresh-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      </button>
    </div>
    <div class="sm-body">${body}</div>`;

  document.getElementById('sm-close-btn').addEventListener('click', closeMemory);
  document.getElementById('sm-refresh-btn').addEventListener('click', () => loadMemory(songId));
  document.getElementById('sm-save-btn').addEventListener('click', async () => {
    const btn = document.getElementById('sm-save-btn');
    const fresh = document.getElementById('sm-notes-edit').value.trim();
    btn.disabled = true; btn.textContent = '收…';
    try {
      await apiPost('/music/memory', {
        songId,
        action: 'note',
        // Append, never overwrite: the input holds only the new entry.
        notes: [mem.notes || '', fresh].filter(Boolean).join('\n'),
        tags: document.getElementById('sm-tags-edit').value.split(/\s+/).filter(Boolean),
        name: state.song?.name || mem.name || '',
        artist: state.song?.artist || mem.artist || '',
        by: 'anko',
      });
      showToast('批注收好了');
      loadMemory(songId);
    } catch {
      showToast('没存上，再试一次');
      btn.disabled = false; btn.textContent = '收进批注本';
    }
  });
}

/* ── Song comments panel ──
   后端 /music/comments 走她自己的网易云 cookie；首页带热评，往下翻是最新。 */
let commentsOpen = false;
let cmtOffset = 0;

function openComments(song) {
  if (!song || !song.songId) return;
  commentsOpen = true;
  cmtOffset = 0;
  const cv = document.getElementById('comments-view');
  if (!cv) return;
  cv.classList.remove('hidden');
  cv.innerHTML = `
    <div class="sm-header">
      <button class="sm-close" id="cm-close-btn">&times;</button>
      <span class="sm-header-title">${esc(song.name)} 的评论区</span>
    </div>
    <div class="sm-body" id="cm-body"><div class="sm-loading">评论在路上…</div></div>`;
  document.getElementById('cm-close-btn').addEventListener('click', closeComments);
  loadComments(song.songId, true);
}

function closeComments() {
  commentsOpen = false;
  const cv = document.getElementById('comments-view');
  if (cv) cv.classList.add('hidden');
}

function cmtCard(c, hot) {
  const d = c.time ? new Date(c.time) : null;
  const when = d ? `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}` : '';
  // 网易给的头像是 http 链接,https 页面下会被拦成混合内容——升成 https(它家 CDN 支持)
  const ava = (c.avatar || '').replace(/^http:/, 'https:');
  return `<div class="cm-item${hot ? ' hot' : ''}">
    <div class="cm-head">${ava ? `<img class="cm-ava" src="${esc(ava)}?param=60y60" loading="lazy" alt="">` : ''}<span class="cm-user">${esc(c.user)}</span>${hot ? '<span class="cm-hot-tag">热评</span>' : ''}</div>
    <div class="cm-text">${esc(c.content)}</div>
    <div class="cm-foot"><span>♥ ${c.liked || 0}</span><span>${when}</span></div>
  </div>`;
}

async function loadComments(songId, first) {
  const bodyEl = document.getElementById('cm-body');
  if (!bodyEl) return;
  try {
    const d = await api(`/music/comments?id=${songId}&offset=${cmtOffset}&limit=20`);
    let html = '';
    if (first && d.hot && d.hot.length) {
      html += d.hot.map(c => cmtCard(c, true)).join('');
      html += '<div class="cm-divider">最新评论</div>';
    }
    html += (d.comments || []).map(c => cmtCard(c, false)).join('');
    if (first) bodyEl.innerHTML = html || '<div class="sm-empty">这首还没人留言</div>';
    else {
      const more = document.getElementById('cm-more'); if (more) more.remove();
      bodyEl.insertAdjacentHTML('beforeend', html);
    }
    cmtOffset += (d.comments || []).length;
    if (d.more) {
      bodyEl.insertAdjacentHTML('beforeend', '<button class="sm-save cm-more" id="cm-more">再翻一页</button>');
      document.getElementById('cm-more').addEventListener('click', () => {
        document.getElementById('cm-more').textContent = '翻…';
        loadComments(songId, false);
      });
    }
  } catch {
    if (first) bodyEl.innerHTML = '<div class="sm-empty">评论暂时取不到（网易那边没应门）</div>';
  }
}

// ── Up-next queue panel: manual/remote inserts, visible and editable ──
//    state.queue 原来是个看不见的口袋,现在播放条挂「▤ N」小牌,点开能看能删能插队 ──
function openQueue() {
  const qv = document.getElementById('queue-view');
  if (!qv) return;
  qv.classList.remove('hidden');
  renderQueue();
}
function closeQueue() {
  const qv = document.getElementById('queue-view');
  if (qv) qv.classList.add('hidden');
}
function renderQueue() {
  const qv = document.getElementById('queue-view');
  if (!qv || qv.classList.contains('hidden')) return;
  const rows = state.queue.map((s, i) => `
    <div class="qv-item" data-i="${i}">
      ${coverBox(s.cover, 'qv-cover')}
      <div class="qv-info"><b>${esc(s.name || '')}</b><small>${esc(s.artist || '')}</small></div>
      <button class="qv-now" data-now="${i}">先播这首</button>
      <button class="qv-del" data-del="${i}" aria-label="移除">✕</button>
    </div>`).join('');
  qv.innerHTML = `
    <div class="sm-header">
      <button class="sm-close" id="qv-close">&times;</button>
      <span class="sm-header-title">接下来播 · ${state.queue.length} 首</span>
    </div>
        <div class="sm-body">${rows || '<div class="sm-empty">队列空空</div>'}</div>`;
  document.getElementById('qv-close').addEventListener('click', closeQueue);
  qv.querySelectorAll('[data-now]').forEach(btn => btn.addEventListener('click', () => {
    const i = Number(btn.dataset.now);
    const song = state.queue.splice(i, 1)[0];
    if (song) loadAndPlay(song);
    renderQueue(); renderNpBar();
  }));
  qv.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', () => {
    state.queue.splice(Number(btn.dataset.del), 1);
    renderQueue(); renderNpBar();
  }));
}

// ── Add current song to a chosen playlist ──
//    她都建好「rime推荐」空等着了。歌词页 ➕ 钮:当前这首→选一个本地歌单→收进去。 ──
function openAddToList(song) {
  if (!song || !song.songId) return;
  const av = document.getElementById('addlist-view');
  if (!av) return;
  av.classList.remove('hidden');
  av.innerHTML = `
    <div class="sm-header">
      <button class="sm-close" id="al-close">&times;</button>
      <span class="sm-header-title">把《${esc(song.name)}》收进…</span>
    </div>
    <div class="sm-body" id="al-body"><div class="sm-loading">翻歌单架…</div></div>`;
  document.getElementById('al-close').addEventListener('click', closeAddToList);
  api('/music/playlists').then(d => {
    const body = document.getElementById('al-body');
    if (!body) return;
    const pls = (d.ok ? d.playlists : []) || [];
    if (!pls.length) { body.innerHTML = '<div class="sm-empty">还没有歌单——去歌单页右上角 + 建一个</div>'; return; }
    body.innerHTML = pls.map((pl, i) => `
      <div class="qv-item" data-al="${i}">
        <div class="qv-cover">${pl.cover ? `<img src="${esc(pl.cover)}" alt="">` : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted)">♪</div>'}</div>
        <div class="qv-info"><b>${esc(pl.name)}</b><small>${pl.count || 0} songs</small></div>
        <button class="qv-now" data-alpick="${i}">收进去</button>
      </div>`).join('');
    body.querySelectorAll('[data-alpick]').forEach(btn => btn.addEventListener('click', async () => {
      const pl = pls[parseInt(btn.dataset.alpick)];
      btn.disabled = true; btn.textContent = '收…';
      try {
        const r = await apiPost('/music/playlists/add-song', { playlistId: pl.id, song: { ...song }, by: 'user' });
        if (r.duplicate) { showToast(`已经在『${pl.name}』里啦`); btn.textContent = '已在单里'; }
        else { showToast(`已收进『${pl.name}』♪`); btn.textContent = '收好了 ✓'; }
      } catch { showToast('没收进去,再试一次'); btn.disabled = false; btn.textContent = '收进去'; }
    }));
  }).catch(() => {
    const body = document.getElementById('al-body');
    if (body) body.innerHTML = '<div class="sm-empty">歌单架没翻开,再点一次</div>';
  });
}
function closeAddToList() {
  const av = document.getElementById('addlist-view');
  if (av) { av.classList.add('hidden'); av.innerHTML = ''; }
}

// ── MV playback ──
//    歌词页 🎬 钮 → /music/mv 查片源 → 全屏放;开MV时暂停音乐,关掉接着放。
let mvWasPlaying = false;

async function openMv(song) {
  if (!song || !song.songId) return;
  const btn = document.getElementById('ly-mv-btn');
  if (btn) btn.disabled = true;
  let d;
  try { d = await api('/music/mv?id=' + song.songId); }
  catch { showToast('MV 查询失败'); if (btn) btn.disabled = false; return; }
  if (btn) btn.disabled = false;
  if (!d.ok) { showToast(d.msg || '这首没有MV'); return; }
  const mv = document.getElementById('mv-view');
  if (!mv) return;
  mvWasPlaying = state.playing;
  audio.pause();
  const quals = Object.keys(d.urls || {}).sort((a, b) => b - a);
  mv.classList.remove('hidden');
  mv.innerHTML = `
    <div class="mv-top">
      <button class="sm-close" id="mv-close">&times;</button>
      <span class="mv-title">${esc(d.name || song.name)}<small>${esc(d.artist || song.artist || '')}</small></span>
      ${quals.length > 1 ? `<select class="mv-qual" id="mv-qual">${quals.map(q => `<option value="${q}">${q}P</option>`).join('')}</select>` : ''}
      <button class="mv-qual" id="mv-pip" type="button">悬浮</button>
    </div>
    <video id="mv-video" src="${esc(d.url)}" controls autoplay playsinline referrerpolicy="no-referrer"></video>`;
  document.getElementById('mv-close').addEventListener('click', closeMv);
  const qsel = document.getElementById('mv-qual');
  if (qsel) qsel.addEventListener('change', () => {
    const v = document.getElementById('mv-video');
    const t = v.currentTime;
    v.src = d.urls[qsel.value]; v.currentTime = t; v.play().catch(() => {});
  });
  /* Native picture-in-picture: the video floats above everything;
     点「悬浮」→ 视频飘成系统级小窗(盖在聊天/别的App上),放映厅壳自动藏起但不杀视频;
     她关掉小窗时才真正收场(leavepictureinpicture → closeMv)。 */
  const vEl = document.getElementById('mv-video');
  const pipBtn = document.getElementById('mv-pip');
  if (pipBtn && vEl) {
    pipBtn.addEventListener('click', async () => {
      if (!document.pictureInPictureEnabled || !vEl.requestPictureInPicture) {
        showToast('这个浏览器不给开悬浮窗'); return;
      }
      try { await vEl.requestPictureInPicture(); }
      catch { showToast('悬浮没开起来,再点一次试试'); }
    });
    vEl.addEventListener('enterpictureinpicture', () => {
      const mv2 = document.getElementById('mv-view');
      if (mv2) mv2.classList.add('hidden');   // 只藏壳,视频活着飘在外面
      showToast('MV 飘出去了~关掉小窗就收场');
    });
    vEl.addEventListener('leavepictureinpicture', () => closeMv());
  }
}

function closeMv() {
  const mv = document.getElementById('mv-view');
  if (!mv) return;
  const v = document.getElementById('mv-video');
  if (!v && mv.classList.contains('hidden')) return;   // 早就收干净了
  if (v) {
    try { if (document.pictureInPictureElement === v) document.exitPictureInPicture(); } catch {}
    v.pause(); v.removeAttribute('src'); v.load();
  }
  mv.classList.add('hidden');
  mv.innerHTML = '';
  if (mvWasPlaying) { mvWasPlaying = false; audio.play().catch(() => {}); }
}

// ── Remote play: poll /music/remote every 5s for songs pushed by the companion ──
//    /music/remote 后端一直在,客户端皮从没接过这条线。现在:5 秒一问,有歌就接。
//    Playing → enqueue; idle → play now.
setInterval(async () => {
  try {
    const d = await api('/music/remote');
    if (!d.ok || !d.songs) return;
    for (const raw of d.songs) {
      const song = { name: raw.name || '', artist: raw.artist || '', album: raw.album || '',
                     cover: raw.cover || '', songId: raw.songId || raw.id };
      if (!song.songId) continue;
      if (raw.mode === 'now' || !(state.song && (state.playing || state.queue.length))) {
        // diange --now 或播放器闲着:立刻开播
                showToast(`点播的「${song.name}」来了,现在就放~`);
        loadAndPlay(song);
      } else {
        state.queue.push(song);
                showToast(`「${song.name}」插进队列了,点 ▤ 看`);
      }
    }
    renderNpBar(); renderQueue();
  } catch {}
}, 5000);

// ── Init ──
setupMediaSession();
loadLikedIds();   // load the liked-song ledger at boot (local + NetEase account merged)
init();
</script>

<!-- ══ Tiny stickers floating up from the play capsule (decorative) ══
     参考里的机制:小图标从播放键胶囊背后往上冒,浮一点点,淡出。一次一两个,不规律。
          Watercolor sprites, fixed-positioned on body; reads np-bar position per spawn.
     定位,每次生成时读一次 np-bar 的位置,所以 mini / embedded / 全屏三种活法都不用管。
     不要了:把这段 <style> 和 <script> 整块删掉即可。 ══ -->
<style>
.np-sticker{
  position: fixed;
  z-index: 60;
  width: 26px; height: 26px;
  pointer-events: none;
  background-position: center;
  background-size: contain;
  background-repeat: no-repeat;
  opacity: 0;
  will-change: transform, opacity;
  filter: drop-shadow(0 2px 5px rgba(176,120,150,.28));
  animation: np-sticker-float 2.3s cubic-bezier(.22,.7,.3,1) forwards;
}
@keyframes np-sticker-float{
  0%   { opacity: 0; transform: translate(-50%, 10px) scale(.55) rotate(var(--rot0)); }
  18%  { opacity: 1; transform: translate(-50%, -6px) scale(1.06) rotate(0deg); }
  32%  { opacity: 1; transform: translate(-50%, -16px) scale(1)   rotate(var(--rot1)); }
  100% { opacity: 0; transform: translate(-50%, -62px) scale(.92) rotate(var(--rot1)); }
}
@media (prefers-reduced-motion: reduce){ .np-sticker{ display: none; } }
</style>
<script>
(function(){
  "use strict";
  var DECOR = "/chat/assets/decor/";
  var PACK = ["think-bow-v1","bow-heart-v1","bunny-v1","fog-cat-v1",
              "drop-lollipop-v1","ferret-v1","plum-branch-v1"];
  var MIN_GAP = 2600, MAX_GAP = 5200;   // 冒一枚之后歇多久
  var timer = null, last = -1;

  function pick(){                       // 别连着两次同一张
    var i = Math.floor(Math.random() * PACK.length);
    if (i === last) i = (i + 1) % PACK.length;
    last = i;
    return PACK[i];
  }

  function pop(){
    var bar = document.getElementById("np-bar");
    if (!bar || bar.classList.contains("hidden") || document.hidden) return;
    var r = bar.getBoundingClientRect();
    if (!r.width) return;

    var el = document.createElement("div");
    el.className = "np-sticker";
    el.style.backgroundImage = "url('" + DECOR + pick() + ".webp')";
    // 横向落在播放条中段偏随机，别每次都从同一个点冒
    el.style.left = Math.round(r.left + r.width * (0.30 + Math.random() * 0.42)) + "px";
    el.style.top  = Math.round(r.top - 6) + "px";
    var a = (Math.random() * 26 - 13).toFixed(1);
    var b = (Math.random() * 20 - 10).toFixed(1);
    el.style.setProperty("--rot0", a + "deg");
    el.style.setProperty("--rot1", b + "deg");
    el.addEventListener("animationend", function(){ el.remove(); });
    document.body.appendChild(el);
  }

  function schedule(){
    stop();
    timer = setTimeout(function(){
      pop();
      schedule();
    }, MIN_GAP + Math.random() * (MAX_GAP - MIN_GAP));
  }
  function stop(){ if (timer){ clearTimeout(timer); timer = null; } }

  function wire(){
    // audio 是这份文件里的全局单例；拿不到就退回监听文档上的任何 <audio>
    var a = (typeof audio !== "undefined") ? audio : document.querySelector("audio");
    if (!a){ setTimeout(wire, 1200); return; }
    a.addEventListener("play",  schedule);
    a.addEventListener("pause", stop);
    a.addEventListener("ended", stop);
    document.addEventListener("visibilitychange", function(){
      if (document.hidden) stop();
      else if (!a.paused) schedule();
    });
    if (!a.paused) schedule();
  }

  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", wire);
  else wire();
})();
</script>
</body>
