<!DOCTYPE html>
<html lang="en">
<head>
<script>/* 皮肤先于样式贴上，免得闪一下粉 */(function(){try{var s=localStorage.getItem('music_skin');if(s&&s!=='rose')document.documentElement.setAttribute('data-skin',s);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>music</title>
<style>
/* ── CSS Variables / Theme ── */
:root {
  /* 主页配色：色卡与 reference/home-index.html 同根：
     深玫瑰灰 #6b4a55 / 柔雾粉棕 #85616f / 玫瑰 #c2708a / 深玫瑰 #984e68 / 奶油黄 #ffedc2，
     半透明奶白玻璃 + 1px 白边 + 柔粉阴影。 */
  --ink: #6b4a55;
  --ink-soft: #85616f;
  --muted: #ab8b98;
  --faint: #cfb6c0;
  --rose: #c2708a;
  --rose-deep: #984e68;
  --butter: #ffedc2;
  --accent: #984e68;                        /* 文字强调:深玫瑰,浅底上对比够(文字继续用它,别拿去刷按钮) */
  --accent-soft: #c2708a;                   /* 次级强调:玫瑰 */
  --btn: #c2708a;                           /* 实心按钮、拖杆、主题色圆同一个玫瑰 */
  --accent-tint: rgba(var(--rose-rgb), 0.14);
  --good: #4d9b7b;
  --bad: #d96a5e;
  --bg: color-mix(in srgb, rgb(var(--rose-rgb)) 6%, #fff);   /* 平坦底色，供 color-mix 使用；从主题色推，不写死粉 */
  --milk: rgba(var(--glass-rgb), calc(0.62 * var(--glass-k)));        /* 奶白玻璃卡 */
  --milk-strong: rgba(var(--glass-rgb), calc(0.82 * var(--glass-k)));
  --line: rgba(var(--glass-rgb), calc(0.9 * var(--glass-k)));         /* 玻璃卡 1px 白边 */
  --hairline: rgba(var(--rose-rgb), 0.16);    /* 卡片之间的发丝线 */
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Cascadia Code", monospace;
  --font-script: "Snell Roundhand", "Savoye LET", "Brush Script MT", cursive;
  --shadow-soft: 0 12px 32px rgba(var(--shadow-rgb), 0.16);
  --shadow-sm: 0 4px 14px rgba(var(--shadow2-rgb), 0.10);
  --r-s: 12px; --r-m: 20px; --r-full: 999px;
  --blur: blur(18px) saturate(1.14);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  /* ── 皮肤地基：上面每一处 rgba 的通道都收到这里，皮肤只改 html[data-skin] 那一块，版式一行不动。
     --glass-k 是玻璃白的透明度倍率，奶油玫瑰是 1，夜里的皮把它压到一成，白玻璃就成了烟色。 ── */
  --rose-rgb: 194, 112, 138; --rose-deep-rgb: 152, 78, 104; --butter-rgb: 255, 237, 194;
  --glass-rgb: 255, 255, 255; --glass-k: 1;
  --shadow-rgb: var(--rose-rgb); --shadow2-rgb: var(--rose-deep-rgb);
  --pop-rgb: 107, 74, 85; --on-pop: #fff6ee; --on-pop-rgb: 255, 246, 238;   /* 提示条、横幅的底与字 */
  --paper: color-mix(in srgb, rgb(var(--rose-rgb)) 9%, #fff);               /* 整页素粉：主题色淡到九分，换色就跟着换 */
  --btn-ink: #fff;                                                           /* 实心按钮上的字 */

  /* ── 运动体系 ──
     只动 transform 和 opacity：这两个走合成器，不触发布局。
     时长全部收在这四个变量里，调一处全站跟着走。 */
  --ease-out:    cubic-bezier(.16, 1, .3, 1);      /* ≈ expo.out：猛起步、极缓收尾，主力 */
  --ease-in-out: cubic-bezier(.87, 0, .13, 1);     /* ≈ expo.inOut：转场用，两头都稳 */
  --ease-spring: cubic-bezier(.22, 1.12, .44, 1);  /* 轻微过冲，按压回弹用 */
  --ease-press:  cubic-bezier(.4, 0, .2, 1);       /* 按下去要跟手，这条不能慢 */

  --t-press: .12s;   /* 按下：必须即时 */
  --t-fast:  .3s;    /* 小元件：药丸、图标、勾选 */
  --t-base:  .55s;   /* 主力：入场、卡片、封面 */
  --t-slow:  .9s;    /* 大转场：页面切换、唱片起转 */
  --stagger: 42ms;   /* 列表逐行错开的间隔 */
}


/* ── 皮肤二：黑白夜：没有一滴粉，玫瑰全换成白，玻璃压成烟色 ── */
html[data-skin="mono"] {
  --ink: #f2f2f2; --ink-soft: #c8c8c8; --muted: #8e8e8e; --faint: #4a4a4a;
  --rose: #d9d9d9; --rose-deep: #ffffff; --butter: #e4e4e4;
  --accent: #ffffff; --accent-soft: #cfcfcf; --btn: #f2f2f2; --btn-ink: #111;
  --accent-tint: rgba(255, 255, 255, 0.1);
  --bg: #141416; --paper: #0c0c0e;
  --milk: rgba(255, 255, 255, 0.07); --milk-strong: rgba(255, 255, 255, 0.12);
  --line: rgba(255, 255, 255, 0.14); --hairline: rgba(255, 255, 255, 0.09);
  --rose-rgb: 255, 255, 255; --rose-deep-rgb: 255, 255, 255; --butter-rgb: 255, 255, 255;
  --glass-rgb: 255, 255, 255; --glass-k: 0.12;
  --shadow-rgb: 0, 0, 0; --shadow2-rgb: 0, 0, 0;
  --shadow-soft: 0 12px 32px rgba(0, 0, 0, 0.55); --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.45);
  --pop-rgb: 236, 236, 236; --on-pop: #111; --on-pop-rgb: 17, 17, 17;
  color-scheme: dark;
}
html[data-skin="mono"] input { color: var(--ink); }

/* ── 皮肤三：自定义：自己传一张图当整页的底（#skin-bg，服务端 /music/skin/bg），卡片透出来；没传图就拿正在放的封面糊一层垫着。
   字色按图的明暗自动挑：html[data-ink="light"] 是浅字那套。 ── */
html[data-skin="custom"] {
  --glass-k: 0.8;                                   /* 传的图多半花，卡片别太透，字要能读 */
  --milk: rgba(255, 255, 255, 0.6); --milk-strong: rgba(255, 255, 255, 0.8);
  --line: rgba(255, 255, 255, 0.8);
  --blur: blur(24px) saturate(1.25);
  --shadow-soft: 0 14px 36px rgba(0, 0, 0, 0.12); --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.1);
  --paper: #f3f0f1; --bg: #f3f0f1;                 /* 自定义皮不借玫瑰皮的粉纸，中性灰白，图自己上色 */
}
html[data-skin="custom"][data-ink="light"] {
  --ink: #ffffff; --ink-soft: rgba(255, 255, 255, 0.84); --muted: rgba(255, 255, 255, 0.62); --faint: rgba(255, 255, 255, 0.36);
  --rose: #ffd6e4; --rose-deep: #ffffff; --butter: #fff3cf;
  --accent: #ffffff; --accent-soft: #ffd6e4; --btn: rgba(255, 255, 255, 0.92); --btn-ink: #6b3d50;
  --accent-tint: rgba(255, 255, 255, 0.16);
  --bg: #4a2d40; --paper: #3a2434;
  --milk: rgba(255, 255, 255, 0.14); --milk-strong: rgba(255, 255, 255, 0.24);
  --line: rgba(255, 255, 255, 0.42); --hairline: rgba(255, 255, 255, 0.2);
  --rose-rgb: 255, 255, 255; --rose-deep-rgb: 255, 255, 255; --butter-rgb: 255, 243, 207;
  --glass-k: 0.3;
  --shadow-rgb: 0, 0, 0; --shadow2-rgb: 0, 0, 0;
  --shadow-soft: 0 18px 44px rgba(0, 0, 0, 0.32); --shadow-sm: 0 6px 16px rgba(0, 0, 0, 0.28);
  --pop-rgb: 40, 20, 32; --on-pop: #fff; --on-pop-rgb: 255, 255, 255;
  color-scheme: dark;
}
/* 玻璃要有东西可透：三套皮底下都铺正在放的封面，糊开、罩各自的纱（--veil）；
   没放歌时两团淡光晕垫着（.empty）。自定义皮传了图就直接铺图、不糊不罩。 */
/* 纱加厚，封面只剩一点点颜色透上来 */
:root { --veil: linear-gradient(to bottom, color-mix(in srgb, var(--paper) 60%, transparent), color-mix(in srgb, var(--paper) 78%, transparent) 55%, color-mix(in srgb, var(--paper) 90%, transparent)); }
html[data-skin="mono"] { --veil: linear-gradient(to bottom, rgba(12, 12, 14, 0.62), rgba(12, 12, 14, 0.82) 55%, rgba(12, 12, 14, 0.92)); }
html[data-skin="custom"] { --veil: none; }
#skin-bg {
  position: fixed; inset: -40px; z-index: 0; pointer-events: none; display: block;
  background: var(--paper) center / cover no-repeat;
  /* 整屏 30px 的 blur 在手机上太贵，底图本来就是 120 像素的小图放大的，自带糊，blur 收到 12 */
  filter: blur(var(--bg-blur, 12px)) saturate(1.05); transform: scale(1.08); will-change: transform;   /* 模糊量交给拖杆 --bg-blur */
  transition: opacity var(--t-slow) var(--ease-in-out);
}
#skin-bg::after { content: ""; position: absolute; inset: 0; background: var(--veil); }
/* --bg-show 0～1，拖到 0 底图全隐、只剩素底 */
#skin-bg { opacity: var(--bg-show, 1); }
.hs-range { flex: 1; min-width: 0; accent-color: var(--btn); height: 28px; }
.hs-sub { display: block; font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
#skin-bg.empty {
  background-image:
    radial-gradient(circle at 18% 12%, rgba(194, 112, 138, 0.38), transparent 46%),
    radial-gradient(circle at 82% 38%, rgba(255, 237, 194, 0.7), transparent 50%),
    radial-gradient(circle at 50% 92%, rgba(194, 112, 138, 0.26), transparent 52%);
}
html[data-skin="mono"] #skin-bg { filter: blur(var(--bg-blur, 12px)) grayscale(1) brightness(0.75); }
html[data-skin="mono"] #skin-bg.empty { background-image: radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.16), transparent 46%), radial-gradient(circle at 80% 45%, rgba(255, 255, 255, 0.1), transparent 50%); }
/* 自定义皮没传图时拿封面垫底：压暗，配浅字 */
html[data-skin="custom"][data-bg="cover"] #skin-bg { filter: blur(var(--bg-blur, 12px)) saturate(1.2) brightness(0.62); }
html[data-skin="custom"][data-bg="own"] #skin-bg { inset: -40px; filter: blur(var(--bg-blur, 14px)); transform: scale(1.08); }   /* 传的图也糊，玻璃才看得出是玻璃 */
html[data-skin="custom"] body { background: linear-gradient(160deg, #5a3550, #2a1a26); }
html[data-skin="custom"]:not([data-ink="light"]) body { background: var(--paper); }
/* 歌词页照网易云/Apple Music：底图留颜色不留细节，纱盖到八成多、糊 28px、再压暗一点，字带一道软影 */
/* 自定义皮的 --paper 罩在图上会整页染色：这三张壳（歌词页/批注本/抽屉）改用中性的黑纱或白纱，图自己的颜色透上来 */
html[data-skin="custom"][data-ink="light"] .lyrics-view { background: #1a1418; --ly-veil: rgba(10, 10, 14, 0.42); }
html[data-skin="custom"]:not([data-ink="light"]) .lyrics-view { background: #e9e5e7; --ly-veil: rgba(255, 255, 255, 0.5); }
html[data-skin="custom"][data-ink="light"] .memory-view { background: rgba(10, 10, 14, 0.62); }
html[data-skin="custom"]:not([data-ink="light"]) .memory-view { background: rgba(255, 255, 255, 0.7); }
html[data-skin="custom"][data-ink="light"] .ly-sheet { background: rgba(14, 12, 18, 0.74); }
html[data-skin="custom"]:not([data-ink="light"]) .ly-sheet { background: rgba(255, 255, 255, 0.78); }
html[data-skin="custom"][data-ink="light"] .lyrics-view .ly-line { text-shadow: 0 1px 10px rgba(0, 0, 0, 0.35); }   /* 浅底深字时这层影子像脏了一块，只给深底浅字 */
html[data-skin="custom"] input { color: var(--ink); }
html[data-skin="custom"] input::placeholder, html[data-skin="mono"] input::placeholder { color: var(--muted); }

/* ── 主页设置行：皮肤色块 + 网易云账号 ── */
.home-settings { margin: 10px 14px 4px; display: flex; flex-direction: column; gap: 8px; }
.hs-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: var(--milk); border: 1px solid var(--line); border-radius: 16px;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
}
.hs-label { font-size: 11.5px; font-weight: 600; color: var(--accent); letter-spacing: 0.18em; flex-shrink: 0; }
.hs-val { flex: 1; min-width: 0; font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hs-sec { margin: 14px 4px 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; color: var(--muted); }
.hs-input { flex: 1; min-width: 0; font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: none; border-bottom: 1px solid var(--hairline); padding: 4px 2px; outline: none; }
.hs-input:focus { border-bottom-color: var(--accent); }
.hs-avatar { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--milk-strong); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); cursor: pointer; }
.hs-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hs-btn {
  background: var(--btn); color: var(--btn-ink); border: none; border-radius: var(--r-full);
  padding: 7px 14px; font-size: 12px; font-weight: 600; flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(var(--rose-deep-rgb), 0.3);
}
.skin-swatches { display: flex; gap: 10px; flex: 1; justify-content: flex-end; }
.skin-sw {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); padding: 0; position: relative;
  transition: transform var(--t-fast) var(--ease-spring), box-shadow var(--t-fast) var(--ease-out);
}
.skin-sw[data-skin="rose"]  { background: linear-gradient(135deg, #fdf4f2 50%, #c2708a 50%); }
.skin-sw[data-skin="mono"]  { background: linear-gradient(135deg, #f2f2f2 50%, #0c0c0e 50%); }
.skin-sw[data-skin="custom"] { background: conic-gradient(from 200deg, #ffd6e4, #fff3cf, #cfe8ff, #e9d6ff, #ffd6e4); }
.skin-sw.active { transform: scale(1.12); box-shadow: 0 0 0 2px var(--btn); }
.skin-sw.active::after {
  content: '✓'; position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 13px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
}

/* ── 网易云扫码登录卡 ── */
.qr-sheet {
  position: fixed; inset: 0; z-index: 9200; display: flex; align-items: center; justify-content: center;
  background: rgba(var(--pop-rgb), 0.42);   /* 整屏的 backdrop blur 撤了，只有卡本身糊 */
  animation: sheetIn var(--t-fast) var(--ease-out);   /* 不借带 translateX(-50%) 的 fadeUp，不然第一帧整层往左挪半屏 */
}
@keyframes sheetIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
.qr-sheet .qr-card { animation: cardIn var(--t-base) var(--ease-out); }
.qr-sheet.hidden { display: none; }
.qr-card {
  width: min(300px, 86vw); background: var(--milk-strong); border: 1px solid var(--line); border-radius: 22px;
  padding: 20px 18px 16px; text-align: center; box-shadow: var(--shadow-soft);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
}
.qr-title { font-size: 11.5px; font-weight: 600; letter-spacing: 0.18em; color: var(--accent); }
.qr-box {
  margin: 14px auto 10px; width: 196px; height: 196px; background: #fff; border-radius: 14px; padding: 8px;
  display: grid; place-items: center;
}
.qr-box svg { width: 100%; height: 100%; display: block; }
.qr-msg { font-size: 12.5px; color: var(--ink-soft); min-height: 1.6em; line-height: 1.6; }
.qr-actions { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
.qr-actions button {
  font: inherit; font-size: 12px; border-radius: var(--r-full); padding: 7px 14px;
  border: 1px solid var(--hairline); background: transparent; color: var(--ink-soft);
}
.qr-actions button.primary { background: var(--btn); color: var(--btn-ink); border-color: transparent; }
.set-card { text-align: left; }
.set-card .qr-title { text-align: center; margin-bottom: 12px; }
.set-card .home-settings { margin: 0; }
.set-card .hs-row { margin-top: 8px; }
.set-card .qr-actions { margin-top: 14px; }
.hs-btn-quiet { background: transparent; color: var(--ink-soft); box-shadow: none; border: 1px solid var(--hairline); }

@media (prefers-reduced-motion: reduce) {
  :root { --t-press: 0s; --t-fast: 0s; --t-base: 0s; --t-slow: 0s; --stagger: 0ms; }
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; width: 100%;
  height: 100dvh;
  font-family: var(--font-ui);
  font-weight: 500;   /* 整站字重底线 500，标题 700/800 */
  color: var(--ink);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  /* 背景就是一块干净的素粉，什么都不贴什么都不叠；玻璃卡的层次交给卡自己的白边和粉影 */
  background: var(--paper);
}
button { font-family: inherit; cursor: pointer; }
input { font-family: inherit; }
img { display: block; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid rgba(var(--rose-deep-rgb), 0.55);
  outline-offset: 2px;
  border-radius: 8px;
}

/* ── App Shell ── */
#app {
  width: 100%; height: 100%; height: 100dvh;
  display: flex; flex-direction: column;
  overflow: hidden; position: relative;
}
/* 桌面独立窗别无限拉开:内容收窄成舞台,两侧留给家的背景。 */
@media (min-width: 560px) {
  #app {
    max-width: 460px; margin: 0 auto;
    border-inline: 1px solid rgba(var(--glass-rgb), calc(0.75 * var(--glass-k)));
    box-shadow: 0 0 60px rgba(var(--shadow-rgb), 0.14);
  }
  .lyrics-view, .memory-view { max-width: 460px; margin-inline: auto; }
}
#app > *:not(.lyrics-view):not(.memory-view):not(.mv-view) { position: relative; z-index: 1; }

/* ── Top Bar ── */
/* 玻璃重排：顶栏那根梁拆了，只剩两颗浮在内容上的玻璃圆钮，页面从最顶上开始铺（歌单封面压进状态栏）。
   各页自己用 --top-inset 让首行别钻到钮底下。 */
:root { --top-inset: calc(54px + env(safe-area-inset-top, 0px)); }
:root { --frame-inset: 0px; }   /* 嵌在聊天页抽屉里时，把手浮在最顶上 26px，顶栏和歌词页头往下让这么多 */
html[data-embedded] { --top-inset: 28px; --frame-inset: 22px; }
.topbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 6;
  padding: calc(8px + env(safe-area-inset-top, 0px) + var(--frame-inset, 0px)) 12px 0;
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  pointer-events: none;
}
.topbar-title { display: none; }
.topbar-btn {
  width: 38px; height: 38px; flex-shrink: 0; pointer-events: auto;
  /* 顶栏浮钮照歌单页封面上那颗返回钮的玻璃：底几乎全透、一圈淡白边、重糊，不要奶白实底和投影 */
  backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2);
  background: rgba(var(--glass-rgb), calc(0.22 * var(--glass-k))); border: 1px solid rgba(var(--glass-rgb), calc(0.55 * var(--glass-k))); border-radius: var(--r-full);
  color: var(--rose-deep); text-decoration: none;
  display: flex; align-items: center; justify-content: center;
  transition: transform var(--t-base) var(--ease-spring), background var(--t-fast) var(--ease-out);
}
.topbar-btn:active { transform: scale(0.9); }
.pls-add { background: rgba(var(--glass-rgb), calc(0.22 * var(--glass-k))) !important; border-color: rgba(var(--glass-rgb), calc(0.55 * var(--glass-k))) !important; box-shadow: none !important; }   /* 加号跟顶上两颗一个材质 */

/* ── Body (tab content) ── */
.tab-body {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
#app > .topbar { position: absolute !important; z-index: 6 !important; }   /* 上面那条 #app > *:not()… 特异性 (1,3,0) 比这条高，只能 !important 压回去 */
/* 给 ::-webkit-scrollbar 定了宽度，安卓 Chrome 会把它画成占位的经典滚动条，封面满幅右边缺 6px。手机上不画，只给有鼠标的设备留细条。 */
@media (hover: hover) and (pointer: fine) {
  .tab-body::-webkit-scrollbar, .ly-lines::-webkit-scrollbar, .sm-body::-webkit-scrollbar { width: 6px; }
  .tab-body::-webkit-scrollbar-thumb,
  .ly-lines::-webkit-scrollbar-thumb,
  .sm-body::-webkit-scrollbar-thumb {
    background: rgba(var(--rose-rgb), 0.35); border-radius: 999px;
  }
}
.tab-body, .ly-lines, .sm-body { scrollbar-width: none; }
@media (hover: hover) and (pointer: fine) { .tab-body, .ly-lines, .sm-body { scrollbar-width: thin; } }

/* ── Bottom Nav ──
   主页 dock 的姊妹件:奶油玻璃长条,圆角收紧,选中项深玫瑰。 */
/* 底栏：一块贴底的平板，只顶上一道发丝线，选中项只换颜色 */
.bottom-nav {
  display: flex; justify-content: space-around; align-items: center;
  margin: 0; padding: 6px 8px calc(var(--safe-bottom) + 6px);
  border-top: 1px solid var(--hairline);
  background: rgba(var(--glass-rgb), calc(0.72 * var(--glass-k)));
  backdrop-filter: blur(22px) saturate(1.15); -webkit-backdrop-filter: blur(22px) saturate(1.15);
  flex-shrink: 0; position: relative;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; color: var(--muted);
  font-size: 10px; letter-spacing: 0.2px; padding: 5px 18px;
  transition: color var(--t-fast) var(--ease-out), transform var(--t-base) var(--ease-spring);
}
.nav-item:active { transform: translateY(1px); }
.nav-item.active { color: var(--accent); }
.nav-item.active span { font-weight: 600; }
.nav-item svg {
  fill: none; stroke: currentColor; stroke-width: 1.5;
  transition: stroke-width var(--t-fast) var(--ease-out);
}
/* 选中态不用 fill: currentColor（音符和放大镜一填就是一坨黑块），改成加粗描边：图标还是同一个图标，只是重了一点 */
.nav-item.active svg { fill: none; stroke-width: 2.1; }

/* ── 通用奶白玻璃卡 / 空状态 ── */
.card {
  background: var(--milk); border: 1px solid var(--line); border-radius: var(--r-m);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--shadow-soft);
}
/* .empty-card 已退役，改用样式表末尾的 .empty-line：一行轻声的字，说完就让位 */

/* ── 封面:缺失时的奶油音符占位 ── */
.coverbx {
  position: relative; overflow: hidden; flex-shrink: 0;
  display: grid; place-items: center;
  background: linear-gradient(150deg, rgba(var(--rose-rgb), 0.2), rgba(var(--butter-rgb), 0.62));
  color: rgba(var(--rose-deep-rgb), 0.6);
}
.coverbx::before {
  content: "♪"; font-size: 1em; line-height: 1;
  text-shadow: 0 1px 0 rgba(var(--glass-rgb), calc(0.7 * var(--glass-k)));
}
.coverbx::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(155deg, rgba(var(--glass-rgb), calc(0.22 * var(--glass-k))), transparent 45%);
}
.coverbx img {
  position: absolute; inset: 0; z-index: 1;
  width: 100%; height: 100%; object-fit: cover;
}
.coverbx img.gone { display: none; }

/* ── Now Playing (mini) Bar ── */
/* 迷你条照网易云/Spotify：一块圆角砖浮在平底栏上，不描边一点影；只留 封面/歌名/播放/下一首（模式、红心、队列在歌词页甲板里，迷你窗 window-mini 才画） */
.np-bar {
  height: 56px; flex-shrink: 0; margin: 0 8px 6px;
  background: rgba(var(--glass-rgb), calc(0.8 * var(--glass-k)));
  backdrop-filter: blur(22px) saturate(1.15); -webkit-backdrop-filter: blur(22px) saturate(1.15);
  border-radius: 14px; box-shadow: 0 6px 18px rgba(var(--shadow2-rgb), 0.12);
  display: flex; align-items: center; gap: 11px; padding: 0 12px 0 8px;
  cursor: pointer; position: relative; overflow: hidden;
}
.np-bar.hidden { display: none; }
.np-cover { width: 40px; height: 40px; border-radius: 8px; font-size: 16px; }
.np-info { flex: 1; min-width: 0; overflow: hidden; }
.np-name { font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-artist { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.np-btn {
  width: 36px; height: 36px; border-radius: var(--r-full); flex-shrink: 0;
  background: transparent; border: 1.6px solid var(--ink); color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  transition: transform var(--t-base) var(--ease-spring);
}
.np-btn svg { width: 16px; height: 16px; }
.np-btn:active { transform: scale(0.9); }
.np-next-btn { background: none; border: none; color: var(--ink); padding: 6px; flex-shrink: 0; border-radius: var(--r-full); }
.np-next-btn svg { width: 22px; height: 22px; }
.np-next-btn:active { transform: scale(0.9); }
.np-progress {
  position: absolute; bottom: 0; left: 0; height: 2px;
  background: var(--btn);
  transition: width 0.3s linear;
}

/* The player lives in its own named window. Mini mode turns that window itself
   into the global floating player; no page or iframe is nested inside another.
   迷你窗目标尺寸 360×150:整窗就是一块玫瑰奶糖。 */
body.window-mini .topbar,
body.window-mini .tab-body,
body.window-mini .bottom-nav,
body.window-mini .lyrics-view,
body.window-mini .memory-view { display: none !important; }
body.window-mini #app { min-height: 112px; }
body.window-mini .np-bar {
  display: flex !important;
  flex: 1 1 auto; height: 100dvh; min-height: 112px;
  gap: 14px; padding: 14px 16px; margin: 0;
  border: 0; border-radius: 0; overflow: hidden;
  background:
    radial-gradient(circle at 85% 20%, rgba(var(--butter-rgb), 0.6), transparent 46%),
    linear-gradient(135deg, rgba(var(--rose-rgb), 0.2), rgba(var(--glass-rgb), calc(0.9 * var(--glass-k))) 70%);
}
body.window-mini .np-cover {
  width: 66px; height: 66px; border-radius: var(--r-full);
  font-size: 22px;
  box-shadow: 0 6px 18px rgba(var(--shadow2-rgb), 0.25), inset 0 0 0 2px rgba(var(--glass-rgb), calc(0.8 * var(--glass-k)));
}
/* 迷你窗里封面做成小唱片:中心一枚奶油唱孔 */
body.window-mini .np-cover::after {
  content: ""; position: absolute; inset: 0; z-index: 2;
  border-radius: 50%;
  background:
    radial-gradient(circle, rgba(var(--glass-rgb), calc(0.95 * var(--glass-k))) 0 3px, rgba(var(--shadow-rgb), 0.25) 3px 6px, transparent 6px),
    repeating-radial-gradient(circle, transparent 0 9px, rgba(var(--glass-rgb), calc(0.16 * var(--glass-k))) 9px 10px);
}
body.window-mini .np-name { font-size: 14px; }
body.window-mini .np-artist { margin-top: 3px; font-size: 11px; }
body.window-mini .np-btn { width: 44px; height: 44px; background: var(--btn); color: var(--btn-ink); border: 0; box-shadow: 0 4px 12px rgba(var(--rose-deep-rgb), 0.35); }
body.window-mini .np-btn svg { width: 20px; height: 20px; }
body.window-mini .np-progress { top: 0; bottom: auto; }
body.window-mini .np-btn svg { width: 24px; height: 24px; }
body.window-mini .np-progress { top: auto; bottom: 0; height: 3px; }

/* ── 抽屉形态（聊天页「一起听」的 iframe）──
   顶栏在 JS 里就没渲染，这里管的是剩下的东西怎么在 561px 里活得好：不是等比缩小，是砍掉「逛」的功能、把高度还给「听」。 */
body.embedded #app { max-width: none; border-inline: 0; box-shadow: none; }

/* 导航：一行横排小药丸，62px → 44px */
body.embedded .bottom-nav { padding: 4px 8px calc(var(--safe-bottom) + 6px); }
body.embedded .nav-item {
  flex-direction: row; gap: 6px; padding: 7px 18px; font-size: 11.5px;
}
body.embedded .nav-item svg { width: 16px; height: 16px; }
body.embedded .np-bar { height: 54px; }
/* 抽屉矮，歌词页的留白按比例收，不然一屏只剩两三行歌词 */
body.embedded .ly-lines { padding: clamp(28px, 12dvh, 80px) 22px clamp(36px, 15dvh, 96px); }
body.embedded .ly-cover-area { padding: 2px 18px 12px; }
body.embedded .ly-controls { padding: 6px 20px calc(var(--safe-bottom) + 10px); }

/* ── 入场编排 ──
   列表逐行错开 --stagger，最多排到第 14 行，再往后一起进。只动 transform / opacity，不碰布局。 */
@keyframes stagger-in {
  from { opacity: 0; transform: translate3d(0, 14px, 0); }
  to   { opacity: 1; transform: none; }
}
.stagger-in {
  animation: stagger-in var(--t-base) var(--ease-out) backwards;
  animation-delay: calc(min(var(--i, 0), 14) * var(--stagger));
}

/* Tab 切换：整页轻轻淡入，行内的错落交给 .stagger-in，两层叠出层次。 */
@keyframes tab-enter { from { opacity: 0; } to { opacity: 1; } }
.tab-body.tab-enter { animation: tab-enter var(--t-fast) var(--ease-out); }

/* ── 空状态：一行轻声细语，不画虚线框 ── */
.empty-line {
  padding: 18px 0; color: var(--muted); font-size: 12.5px;
  letter-spacing: .02em;
}
/* 歌单/搜索结果里的空状态不在 .section 里，得自己补上左右边距 */
.pls-list > .empty-line, .song-list > .empty-line { padding-inline: 16px; }

/* ── Home Tab ── */
.home-tab { padding: var(--top-inset) 0 0; }
.home-tab:last-child, .home-tab:has(> .section) { padding-bottom: 18px; }   /* 第三页（浮现卡＋最近）自己要底边距；主页下面接歌单，不留 */
/* 主页头：头像、名字、数字不装箱，直接浮在底上 */
.home-profile {
  position: relative; display: flex; flex-direction: column; align-items: center;
  padding: 6px 20px 12px;
}
.home-avatar {
  width: 92px; height: 92px; border-radius: 50%; overflow: hidden; cursor: pointer;
  border: 3px solid rgba(var(--glass-rgb), calc(0.95 * var(--glass-k)));
  background: linear-gradient(150deg, rgba(var(--rose-rgb), 0.2), rgba(var(--butter-rgb), 0.65));
  display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 1;
  box-shadow: 0 12px 30px rgba(var(--shadow-rgb), 0.3);
}
/* 两颗头像圆叠一点点 */
.home-avatars { display: flex; align-items: center; justify-content: center; }
.home-name-and { margin: 0 7px; font-size: 13px; font-weight: 500; color: var(--muted); vertical-align: 2px; }
.home-name-fog { color: var(--rose-deep); }
.fog-home .home-sig { cursor: pointer; }
.fog-home .pls-tab { padding-top: 4px; }
.fog-home .fog-recent { padding: 0 16px 24px; }
.home-avatar.fog { margin-left: -18px; z-index: 0; width: 84px; height: 84px; }
.home-avatar span { font-size: 26px; color: var(--rose-deep); opacity: 0.7; font-weight: 300; }
.home-avatar img { width: 100%; height: 100%; object-fit: cover; }
.home-name {
  margin-top: 10px; font-size: 19px; font-weight: 800; color: var(--ink);
  letter-spacing: 0.6px; cursor: pointer;
  padding: 2px 10px; border-radius: var(--r-full);
  transition: background var(--t-fast) var(--ease-out);
}
@media (hover: hover) { .home-name:hover { background: rgba(var(--rose-rgb), 0.1); } }
.home-sig {
  margin-top: 4px; font-size: 12.5px; color: var(--ink-soft);
  cursor: pointer; text-align: center; max-width: 80%; line-height: 1.6;
  border-bottom: 1px dashed rgba(var(--rose-rgb), 0.4);
  padding-bottom: 2px;
}
/* 网易云数字一排 */
.home-ne { margin-top: 14px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.home-ne-nick { font-size: 12px; font-weight: 600; color: var(--accent-soft); letter-spacing: 0.04em; }
.home-stats { display: flex; justify-content: center; gap: 6px; width: 100%; max-width: 340px; }
.home-stat { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; }
.home-stat b { font-size: 14px; font-weight: 700; color: var(--ink); letter-spacing: 0.02em; white-space: nowrap; }
.home-stat span { font-size: 10.5px; color: var(--muted); letter-spacing: 0.12em; }
.home-stat + .home-stat { box-shadow: none; }
.home-stat b { font-size: 15px; font-weight: 800; }
/* 批注浮现卡：第三页顶上，一张玻璃卡，随机一首写过批注的歌 */
.float-card {
  margin: 4px 14px 14px; padding: 12px 14px 10px; border-radius: 20px; cursor: pointer;
  background: var(--milk); border: 1px solid var(--line); box-shadow: var(--shadow-soft);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  transition: transform var(--t-fast) var(--ease-spring);
}
.float-card:active { transform: scale(.985); }
.float-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.float-reroll { font: inherit; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); background: transparent; border: 1px solid var(--hairline); border-radius: var(--r-full); padding: 4px 10px; }
.float-song { display: flex; align-items: center; gap: 10px; }
.float-play { color: var(--rose-deep); width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--milk-strong); display: grid; place-items: center; }
.float-note { margin: 10px 2px 4px; font-size: 13.5px; line-height: 1.65; color: var(--ink); white-space: pre-wrap; word-break: break-word;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.float-note::before { content: '「'; color: var(--accent-soft); } .float-note::after { content: '」'; color: var(--accent-soft); }
.float-meta { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.home-name-static, .home-sig-static { cursor: default; }
.home-sig-static { border-bottom: 0; }
@media (hover: hover) { .home-name-static:hover { background: transparent; } }
.home-edit-wrap { display: flex; gap: 6px; margin-top: 8px; width: 80%; align-items: center; }
.home-edit-input {
  flex: 1; min-width: 0; border: 1px solid var(--hairline); border-radius: var(--r-full);
  background: rgba(var(--glass-rgb), calc(0.75 * var(--glass-k)));
  font-size: 13px; color: var(--ink); outline: none; text-align: center; padding: 8px 14px;
}
.home-edit-input:focus { border-color: var(--accent-soft); }
.home-edit-ok {
  background: var(--btn); border: none; color: var(--btn-ink); border-radius: var(--r-full);
  padding: 8px 16px; font-size: 12px; flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(var(--rose-deep-rgb), 0.3);
}

/* ── Section ── */
.section { padding: 16px 16px 0; }
/* 0.18em 的字距是给全大写英文用的，中文标题会被撑散：中文收到近乎 0，英文标题另开一档 */
.section-hd {
  font-size: 11.5px; font-weight: 600; color: var(--accent);
  margin-bottom: 10px; letter-spacing: 0.02em;
  display: flex; align-items: center; gap: 8px;
}
.section-hd.en { letter-spacing: 0.18em; }
/* 那条横线撤了 —— 拆卡片同理：分区靠间距分，不靠画线分。 */

/* ── Recent List ── */
.recent-list { display: flex; flex-direction: column; gap: 6px; }
.recent-row {
  display: flex; align-items: center; gap: 12px; padding: 8px 10px;
  cursor: pointer; border-radius: 14px;
  background: rgba(var(--glass-rgb), calc(0.55 * var(--glass-k))); border: 1px solid rgba(var(--glass-rgb), calc(0.8 * var(--glass-k)));
  transition: transform var(--t-base) var(--ease-spring), background var(--t-fast) var(--ease-out), border-color var(--t-fast) var(--ease-out);
}
@media (hover: hover) {
  .recent-row:hover { background: rgba(var(--glass-rgb), calc(0.82 * var(--glass-k))); border-color: var(--line); }
}
.recent-row:active { transform: scale(0.985); background: var(--milk-strong); }
.recent-row-cover { width: 46px; height: 46px; border-radius: 11px; font-size: 16px; }
.recent-row-info { flex: 1; min-width: 0; }
.recent-row-name { font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent-row-artist { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

/* ── Playlists Tab ── */
.pls-tab { padding: var(--top-inset) 16px 18px; }
.home-tab + .pls-tab { padding-top: 4px; }
.pls-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; min-height: 34px; }   /* 两排标题等高（第一排有颗 34 的 ＋） */
.pls-title { font-size: 11px; font-weight: 700; color: var(--rose-deep); letter-spacing: 0.18em; }   /* 标题 11/700 */
.pls-add {
  width: 34px; height: 34px; border-radius: var(--r-full); border: 1px solid var(--line);
  background: var(--milk); color: var(--rose-deep); font-size: 17px; line-height: 1; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-sm);
  transition: transform var(--t-base) var(--ease-spring);
}
.pls-add:active { transform: scale(0.9); }
.pls-create { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
.pls-create-input {
  flex: 1; min-width: 0; border: 1px solid var(--hairline); border-radius: var(--r-full);
  background: rgba(var(--glass-rgb), calc(0.75 * var(--glass-k)));
  font-size: 13px; color: var(--ink); outline: none; padding: 9px 16px;
}
.pls-create-input:focus { border-color: var(--accent-soft); }
.pls-create-ok {
  background: var(--btn); border: none; color: var(--btn-ink); border-radius: var(--r-full);
  padding: 9px 16px; font-size: 12px; flex-shrink: 0;
}
.pls-create-cancel {
  background: none; border: none; color: var(--muted); padding: 8px; border-radius: var(--r-full);
}
.pls-list { display: flex; flex-direction: column; gap: 8px; }
/* 主页上两排歌单都是横滑小卡，和网易云歌单同尺寸，两排同一条左边线；节奏统一：数字→标题 16，标题→卡 10，卡→下一个标题 16 */
.pls-count { font-size: 11px; color: var(--muted); font-weight: 600; }
.pls-hd-2 { margin-top: 16px; }
.home-tab ~ .pls-tab .pls-hd { padding-inline: 8px; }   /* 标题文字对齐砖里封面的左边（砖内边距 8） */
/* 我们的专辑：玻璃砖，封面嵌在磨砂玻璃里，名字数目写在砖里；两列，贴 16 的边线 */
.pls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pls-row.pls-tile { flex-direction: column; align-items: stretch; padding: 8px; border-radius: 20px; position: relative; }   /* 写在 .pls-row 后面，不然被它盖掉 */
html[data-skin="mono"] .pls-row.pls-tile { background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.26); }   /* 黑底上砖框要提亮 */
html[data-skin="custom"][data-ink="light"] .pls-row.pls-tile { background: rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.4); }
.pls-tile .pls-row-cover { width: 100%; height: auto; aspect-ratio: 1; border-radius: 14px; }
.pls-tile .pls-row-info { padding: 8px 4px 2px; text-align: left; }
.pls-tile .pls-row-name { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pls-tile .pls-row-count { font-size: 11px; margin-top: 2px; }
.pls-tile .pls-row-del { position: absolute; top: 14px; right: 14px; width: 26px; height: 26px; border-radius: 50%; background: rgba(var(--glass-rgb), calc(0.85 * var(--glass-k))); color: var(--ink-soft); display: grid; place-items: center; padding: 0; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
/* 网易云歌单三列格子，整页只上下滚 */
.pls-grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 10px; padding-inline: 8px; }   /* 和砖里的封面同一条 24 的线 */
.pls-row.pls-card { flex-direction: column; align-items: stretch; padding: 0; gap: 0; position: relative; background: transparent; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; min-width: 0; }
.pls-card .pls-row-cover { width: 100%; height: auto; aspect-ratio: 1; border-radius: 18px; border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.pls-card .pls-row-info { padding: 7px 2px 0; text-align: left; }
.pls-card .pls-row-name { font-size: 12.5px; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pls-card .pls-row-count { font-size: 10.5px; margin-top: 2px; }
.pls-card .pls-row-del { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; background: rgba(var(--glass-rgb), calc(0.85 * var(--glass-k))); color: var(--ink-soft); display: grid; place-items: center; padding: 0; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.pls-row {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  cursor: pointer; border-radius: 16px;
  background: var(--milk); border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  transition: transform var(--t-base) var(--ease-spring), background var(--t-fast) var(--ease-out);
}
@media (hover: hover) { .pls-row:hover { background: var(--milk-strong); } }
.pls-row:active { transform: scale(0.98); }
.pls-row-cover {
  width: 52px; height: 52px; border-radius: 13px; flex-shrink: 0;
  background: linear-gradient(150deg, rgba(var(--rose-rgb), 0.2), rgba(var(--butter-rgb), 0.6));
  background-size: cover; background-position: center;
  display: flex; align-items: center; justify-content: center;
  color: rgba(var(--rose-deep-rgb), 0.55);
  border: 1px solid rgba(var(--glass-rgb), calc(0.8 * var(--glass-k)));
}
.pls-row-info { flex: 1; min-width: 0; }
.pls-row-name {
  font-size: 14.5px; font-weight: 600; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pls-row-count { font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; }
.pls-row-del {
  background: none; border: none; color: var(--faint); flex-shrink: 0; padding: 10px;
  border-radius: var(--r-full); transition: color var(--t-fast) var(--ease-out);
}
.pls-row-del:active { color: var(--bad); transform: scale(0.92); }

/* ── Playlist Detail ── */
.pl-detail { padding: 0 0 18px; }
/* 歌单详情满幅封面 */
.pl-cover {
  position: relative; height: 62dvh; min-height: 380px; max-height: 560px; overflow: hidden;
}
.pl-cover.no-cover { height: 300px; min-height: 0; background: linear-gradient(150deg, rgba(var(--rose-rgb), 0.25), rgba(var(--butter-rgb), 0.6)); }
/* 封面用遮罩往下淡出到透明，底下露皮肤自己的底；.pl-cover-fade 只留顶上一道淡压暗，给返回钮和字垫一下 */
.pl-cover-img {
  position: absolute; inset: 0; background: center / cover no-repeat;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 48%, rgba(0,0,0,.55) 76%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 0%, #000 48%, rgba(0,0,0,.55) 76%, transparent 100%);
}
.pl-cover-fade {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(40, 20, 30, 0.22), rgba(40, 20, 30, 0) 28%);
}
.pl-cover-text { position: absolute; left: 18px; right: 18px; bottom: 20px; z-index: 2; }
.pl-cover-text .pl-hero-eyebrow { color: var(--rose-deep); opacity: 0.9; letter-spacing: 0.2em; font-size: 11px; }
.pl-cover-text .pl-detail-title { font-size: 32px; font-weight: 800; line-height: 1.1; margin-top: 6px; white-space: normal; text-shadow: 0 1px 0 rgba(var(--glass-rgb), 0.5); }
.pl-cover-text .pl-hero-meta { margin-top: 6px; font-size: 12.5px; }
.pl-actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
/* 唯一的重点色：播放全部 */
.pl-play-all {
  height: 44px; padding: 0 20px 0 16px; border-radius: var(--r-full); border: 0;
  background: var(--btn); color: var(--btn-ink); font: inherit; font-size: 14px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 8px 22px rgba(var(--rose-deep-rgb), 0.32);
  transition: transform var(--t-base) var(--ease-spring);
}
.pl-play-all:active { transform: scale(0.95); }
.pl-pill {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); padding: 0;
  background: var(--milk); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  color: var(--rose-deep); display: grid; place-items: center;
  transition: transform var(--t-base) var(--ease-spring);
}
.pl-pill:active { transform: scale(0.9); }
.song-list.bare { background: transparent; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; margin: 4px 10px 0; }
.song-list.bare .song-row { border-bottom: 0; border-radius: 14px; }
.song-list.bare .song-cols { border-bottom: 1px solid var(--hairline); margin-bottom: 4px; }
.song-list.bare .song-cover { width: 46px; height: 46px; border-radius: 11px; }
.pl-detail-hd { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.pl-detail-title { font-size: 17px; font-weight: 700; color: var(--ink); flex: 1; min-width: 0; }
.pl-detail-meta { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 12px; letter-spacing: 0.06em; }
.pl-rename { display: flex; gap: 6px; flex: 1; align-items: center; }
.pl-rename-input {
  flex: 1; min-width: 0; border: 1px solid var(--hairline); border-radius: var(--r-full);
  background: rgba(var(--glass-rgb), calc(0.75 * var(--glass-k)));
  font-size: 14px; color: var(--ink); outline: none; padding: 8px 14px;
}
.pl-rename-ok {
  background: var(--btn); border: none; color: var(--btn-ink); border-radius: var(--r-full);
  padding: 8px 14px; font-size: 12px; flex-shrink: 0;
}
.play-all {
  display: inline-flex; align-items: center; gap: 7px; padding: 9px 22px;
  border-radius: var(--r-full); background: var(--btn); color: var(--btn-ink); border: none;
  font-size: 12.5px; font-weight: 600; margin-bottom: 12px;
  box-shadow: 0 6px 16px rgba(var(--rose-deep-rgb), 0.32);
  transition: transform var(--t-base) var(--ease-spring);
}
.play-all:active { transform: scale(0.95); }
.back-btn {
  background: none; border: none; color: var(--rose-deep); padding: 8px;
  border-radius: var(--r-full); display: flex; align-items: center;
}

/* ── Song List ──
   小奶白大盘子,行与行之间只有发丝线;正在播的那一行是玫瑰糖水。 */
.song-list {
  display: flex; flex-direction: column;
  background: var(--milk); border: 1px solid var(--line); border-radius: var(--r-m);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--shadow-soft);
  overflow: hidden;
}
.song-row {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  border-bottom: 1px solid rgba(var(--rose-rgb), 0.1);
  transition: background var(--t-fast) var(--ease-out);
}
.song-row:last-child { border-bottom: 0; }
@media (hover: hover) { .song-row:hover { background: rgba(var(--glass-rgb), calc(0.5 * var(--glass-k))); } }
.song-row.active {
  background: linear-gradient(90deg, rgba(var(--rose-rgb), 0.16), rgba(var(--rose-rgb), 0.05));
  box-shadow: inset 3px 0 0 var(--accent-soft);
}
.song-idx {
  width: 20px; font-size: 11px; color: var(--faint);
  text-align: center; flex-shrink: 0; font-family: var(--font-mono);
}
.song-row.active .song-idx { color: var(--accent); opacity: 1; font-weight: 700; }
.song-cover { width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-size: 15px; }
.song-info { flex: 1; min-width: 0; cursor: pointer; }
.song-name { font-size: 13.5px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-row.active .song-name { color: var(--accent); font-weight: 700; }
.song-artist { font-size: 11px; color: var(--ink-soft); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-rm { background: none; border: none; color: var(--faint); flex-shrink: 0; padding: 10px 4px; }
.song-rm:active { color: var(--bad); transform: scale(0.92); }

/* ── 歌单详情 · 大头卡：封面 + PLAYLIST 眉题 + 歌单名 + meta + 圆形播放钮；列表顶上一行列头（# TITLE ♡） ── */
.pl-hero {
  position: relative; display: flex; align-items: center; gap: 16px;
  padding: 18px; margin: 2px 0 14px;
  background: var(--milk); border: 1px solid var(--line); border-radius: var(--r-m);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--shadow-soft);
}
.pl-hero-cover {
  width: 96px; height: 96px; border-radius: 16px; flex-shrink: 0; font-size: 34px;
  border: 1px solid var(--line); box-shadow: var(--shadow-sm);
}
.pl-hero-info { flex: 1; min-width: 0; }
.pl-hero-eyebrow {
  font-size: 10px; font-weight: 700; letter-spacing: 0.3em;
  color: var(--accent-soft); margin-bottom: 4px;
}
.pl-hero .pl-detail-title {
  font-size: 21px; font-weight: 800; line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pl-hero-meta { font-size: 11.5px; color: var(--ink-soft); margin-top: 5px; letter-spacing: 0.05em; }
.pl-play-fab {
  width: 46px; height: 46px; border-radius: var(--r-full); border: none; flex-shrink: 0;
  background: var(--btn); color: var(--btn-ink);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 16px rgba(var(--rose-deep-rgb), 0.32);
  transition: transform var(--t-base) var(--ease-spring);
  align-self: flex-end;
}
.pl-play-fab svg { margin-left: 2px; }
.pl-play-fab:active { transform: scale(0.92); }
.song-cols {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px 8px;
  border-bottom: 1px solid var(--hairline);
  font-size: 10px; font-weight: 700; letter-spacing: 0.22em; color: var(--faint);
}
.song-cols-idx { width: 20px; text-align: center; letter-spacing: 0; }
.song-cols-title { flex: 1; }
.song-cols-like { width: 34px; text-align: center; letter-spacing: 0; }
/* 抽屉里空间小,大头卡缩一号(按场景裁,不等比缩) */
body.embedded .pl-hero { gap: 12px; padding: 13px 14px; }
body.embedded .pl-hero-cover { width: 68px; height: 68px; border-radius: 12px; font-size: 24px; }
body.embedded .pl-hero .pl-detail-title { font-size: 17px; }
body.embedded .pl-play-fab { width: 40px; height: 40px; }
.like-btn {
  background: none; border: none; color: var(--faint);
  cursor: pointer; flex-shrink: 0; padding: 8px;
  border-radius: var(--r-full);
  transition: color var(--t-fast) var(--ease-out), transform var(--t-base) var(--ease-spring);
}
.like-btn.liked { color: var(--accent-soft); }
.like-btn:active { transform: scale(0.85); }
.queue-btn {
  background: none; border: none; color: var(--faint);
  cursor: pointer; flex-shrink: 0; padding: 8px;
  border-radius: var(--r-full);
  transition: color var(--t-fast) var(--ease-out), transform var(--t-base) var(--ease-spring);
}
.queue-btn:active { color: var(--accent); transform: scale(0.85); }
.search-clear.hidden { display: none; }

/* ── Discover Tab ── */
.discover-tab { padding-bottom: 18px; }
.discover-top { padding: var(--top-inset) 16px 0; }
.discover-title {
  font-size: 11.5px; font-weight: 600; color: var(--accent); letter-spacing: 0.18em;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.discover-title::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }
.search-bar {
  display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 15px;
  background: var(--milk-strong); border: 1px solid var(--line);
  border-radius: var(--r-full); color: var(--ink-soft);
  box-shadow: var(--shadow-sm);
}
.search-bar:focus-within { border-color: var(--accent-soft); }
.search-input {
  flex: 1; border: none; background: transparent; font-size: 13.5px; color: var(--ink);
  outline: none; min-width: 0; padding: 6px 0;
}
.search-input::placeholder { color: var(--muted); }
.search-clear { background: none; border: none; color: var(--muted); padding: 8px; border-radius: var(--r-full); display: flex; }
.search-go {
  background: var(--milk-strong); border: 1px solid var(--line); color: var(--rose-deep); border-radius: var(--r-full);
  padding: 8px 18px; font-size: 12.5px; font-weight: 600; flex-shrink: 0;
  transition: transform var(--t-base) var(--ease-spring);
}
.search-go:active { transform: scale(0.94); }
.roam-pill {
  display: inline-flex; align-items: center; gap: 6px; margin: 10px 16px 0;
  padding: 7px 15px; border-radius: var(--r-full); font-size: 11.5px; cursor: pointer;
  background: rgba(var(--glass-rgb), calc(0.5 * var(--glass-k))); border: 1px solid var(--hairline);
  color: var(--ink-soft);
  transition: color var(--t-fast) var(--ease-out), background var(--t-fast) var(--ease-out),
              border-color var(--t-fast) var(--ease-out), transform var(--t-base) var(--ease-spring);
}
.roam-pill.active {
  color: var(--btn-ink); background: var(--btn); border-color: transparent;
  box-shadow: 0 4px 12px rgba(var(--rose-deep-rgb), 0.3);
}

/* ── Lyrics View (fullscreen) ──
   布局三件套别动:position:fixed / flex min-height:0 / 手动滚动。这里只换皮肤。 */
.lyrics-view {
  position: fixed; inset: 0; z-index: 100;
  width: 100%; height: 100%; height: 100dvh;
  min-height: 0; overflow: hidden; overscroll-behavior: none;
  display: flex; flex-direction: column;
  /* 三套皮的歌词页都透着底下的封面（#skin-bg 就是这首歌的封面），再糊一层 40px、罩六成纸色。自定义皮那条单独的规则在下面。 */
  background: var(--paper);
  transition: transform var(--t-slow) var(--ease-in-out);
}
/* 歌词页不用整页 backdrop-filter（安卓 Chrome 下面任何合成层增减都会重画一帧，看着整页闪）：
   ::before 自己铺一张糊开的封面（和 #skin-bg 同一张图，--skin-bg-img），::after 罩纸色纱，都是静态层。 */
.lyrics-view::before {
  content: ''; position: absolute; inset: -60px; z-index: 0; pointer-events: none;
  background: var(--skin-bg-img, none) center / cover no-repeat;
  filter: blur(40px) saturate(1.25); transform: translateZ(0);
}
.lyrics-view::after {
  content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: var(--ly-veil, color-mix(in srgb, var(--paper) 84%, transparent));   /* 原来是 #skin-bg 的纱(6~9 成)再叠 58%，合起来约八成多，照旧 */
}
.lyrics-view.hidden { transform: translateY(100%); pointer-events: none; }
/* 歌词页底下一朵跟着歌转的李萨如（两个频率的比＝这首歌的一个音程），1px 线，很淡；画布垫在最底，其余子元素抬到 z-index:1 */
/* 李萨如线默认摘，抽屉里有开关，开着时糊成一层淡影 */
.ly-liss { display: none; position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; isolation: isolate; pointer-events: none; opacity: .16; filter: blur(1.4px); }
html[data-liss="1"] .ly-liss { display: block; }
.lyrics-view > *:not(.ly-liss):not(.ly-scrub):not(.ly-sheet-mask):not(.ly-header) { position: relative; z-index: 1; }
.ly-header { position: relative; z-index: 1; }   /* 上面那条 :not 串权重 0,4,0 会盖掉封面模式的 absolute，这条单独写让下面的 absolute 赢 */
.ly-header {
  padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px + var(--frame-inset, 0px));
  flex-shrink: 0;
}
/* 歌词页材质跟顶栏统一：顶上一排钮全透玻璃，大头卡和甲板也透 */
.ly-close {
  background: rgba(var(--glass-rgb), calc(0.22 * var(--glass-k))); border: 1px solid rgba(var(--glass-rgb), calc(0.55 * var(--glass-k))); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: none; color: var(--rose-deep);
  font-size: 18px; cursor: pointer; padding: 0;
  width: 38px; height: 38px; border-radius: var(--r-full);
  display: flex; align-items: center; justify-content: center;
}
.ly-mem-btn {
  background: rgba(var(--glass-rgb), calc(0.22 * var(--glass-k))); border: 1px solid rgba(var(--glass-rgb), calc(0.55 * var(--glass-k))); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: none; color: var(--rose-deep);
  cursor: pointer; padding: 0;
  width: 36px; height: 36px; border-radius: var(--r-full);
  display: flex; align-items: center; justify-content: center;
  transition: transform var(--t-base) var(--ease-spring);
}
.ly-mem-btn:active { transform: scale(0.9); }
/* 歌词页右上角工具排：全排缩号收腰，不许溢出 */
.ly-head-tools { display: flex; align-items: center; gap: 5px; flex-wrap: nowrap; min-width: 0; }
/* 五颗钮收进一张抽屉 */
.ly-more { width: 38px; height: 38px; }
.ly-sheet-mask { position: absolute; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0); display: flex; align-items: flex-end; transition: background var(--t-fast) var(--ease-out); }
.ly-sheet-mask[hidden] { display: none; }   /* 坑库 display-hides-hidden：display:flex 会盖掉 hidden，蒙层就一直压着整页 */
.ly-sheet-mask.show { background: rgba(0, 0, 0, 0.18); }
.ly-sheet { width: 100%; max-height: calc(100% - var(--frame-inset, 0px) - 10px); overflow-y: auto; overscroll-behavior: contain; padding: 8px 10px calc(var(--safe-bottom) + 12px);   /* 半屏抽屉里面板比窗高：封顶、内部滚 */ border-radius: 26px 26px 0 0; background: color-mix(in srgb, var(--paper) 78%, transparent); border: 1px solid rgba(var(--glass-rgb), calc(0.5 * var(--glass-k))); border-bottom: 0; backdrop-filter: blur(30px) saturate(1.2); -webkit-backdrop-filter: blur(30px) saturate(1.2);   /* 抽屉用这套皮的纸色，不用白玻璃，和批注本壳同一料 */ transform: translateY(100%); transition: transform .32s cubic-bezier(.2, .9, .3, 1.05); touch-action: pan-y; }
.ly-sheet-mask.show .ly-sheet { transform: none; }
.ly-sheet-grip { width: 36px; height: 4px; border-radius: 2px; background: rgba(var(--pop-rgb), 0.25); margin: 2px auto 10px; }
.ly-sheet-grip, .ly-sheet-head { cursor: grab; }
.ly-sheet-row { width: 100%; display: flex; align-items: center; gap: 14px; padding: 13px 14px; font: inherit; font-size: 14.5px; font-weight: 600; color: var(--ink); background: transparent; border: 0; border-radius: 16px; text-align: left; }
.ly-sheet-row svg { width: 20px; height: 20px; color: var(--rose-deep); flex-shrink: 0; }
.ly-sheet-row.liked svg { color: var(--accent); }
.ly-sheet-row:active { background: rgba(var(--glass-rgb), calc(0.4 * var(--glass-k))); }
/* 抽屉照网易云：歌头 + 三颗大钮 + 功能行 + 歌词排版 */
.ly-sheet-head { display: flex; align-items: center; gap: 12px; padding: 4px 8px 12px; }
.ly-sheet-cover { width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0; font-size: 16px; border: 1px solid var(--line); }
.ly-sheet-info { min-width: 0; }
.ly-sheet-name { font-size: 15px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ly-sheet-artist { font-size: 12px; color: var(--ink-soft); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ly-sheet-big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 2px 4px 10px; }
.ly-sheet-bigbtn { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 6px 10px; font: inherit; font-size: 12px; font-weight: 600; color: var(--ink); background: rgba(var(--glass-rgb), calc(0.22 * var(--glass-k))); border: 1px solid rgba(var(--glass-rgb), calc(0.5 * var(--glass-k))); border-radius: 16px; }
.ly-sheet-bigbtn svg { width: 22px; height: 22px; color: var(--rose-deep); }
.ly-sheet-bigbtn.liked svg { color: var(--accent); }
.ly-sheet-bigbtn:active { transform: scale(0.96); }
.ly-sheet-sep { height: 1px; background: rgba(var(--pop-rgb), 0.1); margin: 4px 10px 6px; }
.ly-sheet-opt { cursor: default; }
.ly-sheet-opt > span { flex: 1; }
.ly-seg { display: flex; gap: 2px; padding: 2px; border-radius: var(--r-full); background: rgba(var(--pop-rgb), 0.08); }
.ly-seg button { font: inherit; font-size: 12px; font-weight: 600; color: var(--ink-soft); background: transparent; border: 0; border-radius: var(--r-full); padding: 5px 12px; }
.ly-seg button.on { background: var(--btn); color: var(--btn-ink); }
.ly-head-tools .ly-mem-btn { width: 32px; height: 32px; flex: 0 0 auto; }
.ly-head-tools .ly-mem-btn svg { width: 15px; height: 15px; }
.ly-like-btn.liked, .np-like-btn.liked { color: var(--accent); }
.np-like-btn {
  background: none; border: none; color: var(--accent-soft);
  padding: 8px; flex-shrink: 0; border-radius: var(--r-full);
  display: flex; align-items: center; justify-content: center;
  transition: color var(--t-fast) var(--ease-out), transform var(--t-base) var(--ease-spring);
}
.np-like-btn:active { transform: scale(0.85); }
.ly-cover-area { display: flex; align-items: center; gap: 14px; padding: 2px 20px 16px; flex-shrink: 0; }

/* ── 唱片：封面裁成圆、中心一个孔、外圈一道压印。
   暂停不急停：spinDown() 读下当前角度、脱离 animation、再用 ease-out 多转 22° 停下；起转从当前角度接着转，不回弹到 0。 ── */
.ly-disc-wrap { flex-shrink: 0; padding: 3px; }
.ly-disc {
  position: relative; width: 62px; height: 62px; border-radius: 50%;
  box-shadow: 0 8px 22px rgba(var(--shadow2-rgb), 0.26),
              inset 0 0 0 1px rgba(var(--glass-rgb), calc(0.55 * var(--glass-k)));
  /* 唱片压纹：一圈极淡的同心线，转起来才看得出在动 */
  background:
    repeating-radial-gradient(circle at 50% 50%,
      rgba(var(--pop-rgb), 0.09) 0 1px, transparent 1px 4px),
    var(--rose-deep);
  will-change: transform;
}
.ly-disc .ly-cover {
  width: 100%; height: 100%; border-radius: 50%; font-size: 18px;
  /* 封面稍微内缩，露出一圈黑胶边 */
  transform: scale(.82); box-shadow: none;
}
.ly-disc-hole {
  position: absolute; left: 50%; top: 50%; width: 13px; height: 13px;
  transform: translate(-50%, -50%); border-radius: 50%;
  background: var(--bg);
  box-shadow: inset 0 0 0 1px rgba(var(--pop-rgb), 0.22),
              0 0 0 3px rgba(var(--glass-rgb), calc(0.5 * var(--glass-k)));
}
@keyframes disc-spin {
  from { transform: rotate(var(--spin-from, 0deg)); }
  to   { transform: rotate(calc(var(--spin-from, 0deg) + 360deg)); }
}
.ly-disc.spinning { animation: disc-spin 9s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .ly-disc.spinning { animation: none; }
}
/* ── 歌词页大头卡 + 底部甲板 ── */
.ly-card {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px;
  /* 大头卡不装箱，封面和字直接浮在底上，和主页头像一个做法 */
  padding: 4px 4px 6px; background: transparent; border: 0; border-radius: 0;
}
.ly-card .ly-cover-sq { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 10px 26px rgba(var(--shadow2-rgb), 0.32); }
.ly-cover-sq {
  width: 72px; height: 72px; border-radius: 14px; flex-shrink: 0; font-size: 24px;
  border: 1px solid var(--line); box-shadow: var(--shadow-sm);
}
/* 甲板：上一行通栏进度条、时间在条下面两头；下一行 模式/上一首/播放/下一首/队列 裸字形不套圈 */
.ly-deck { flex-shrink: 0; display: flex; flex-direction: column; align-items: stretch; gap: 4px; margin: 0; padding: 4px 22px calc(var(--safe-bottom) + 14px); }
.ly-seek-row { display: flex; align-items: center; }
.ly-seek-row .ly-seek { margin: 0; flex: 1; }
.ly-times { display: flex; justify-content: space-between; margin-top: -6px; padding: 0 1px; }
.ly-t { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.ly-deck .ly-seek-track { height: 5px; background: rgba(var(--pop-rgb), 0.14); }
.ly-deck .ly-seek-fill { background: var(--ink); opacity: .75; }
.ly-deck .ly-seek-thumb { opacity: 0; transition: opacity var(--t-fast) var(--ease-out); }
.ly-deck .ly-seek:active .ly-seek-thumb { opacity: 1; }
.ly-ctrl-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px 0; }
.ly-ctrl-btn { width: 40px; height: 40px; display: grid; place-items: center; color: var(--ink-soft); background: transparent; border: 0; padding: 0; border-radius: 50%; }
.ly-ctrl-btn svg { width: 20px; height: 20px; }
.ly-ctrl-btn:active, .ly-deck .ly-skip-btn:active { transform: scale(0.9); }
.ly-deck .ly-skip-btn { padding: 8px; color: var(--ink); }
.ly-deck .ly-skip-btn svg { width: 32px; height: 32px; }
.ly-deck .ly-play-btn { width: 64px; height: 64px; background: transparent; color: var(--ink); box-shadow: none; }
.ly-deck .ly-play-btn svg { width: 40px; height: 40px; }
.ly-deck .ly-play-btn:active { transform: scale(.9); }
.ly-deck .ly-skip-btn { padding: 8px 5px; }
.ly-deck .ly-seek { margin-left: 6px; }
/* 兔头滑块：内联 SVG 剪影，颜色吃 --btn，和播放钮/进度线一个血 */
.ly-deck .ly-seek-thumb {
  width: 22px; height: 22px; border: none; border-radius: 0;
  background: none; box-shadow: none;
  color: var(--btn);
  display: flex; align-items: center; justify-content: center;
  transform: translate(-50%, -56%);
}
/* ── 同一个视图两页：data-mode="cover" 大封面居中 + 歌名；data-mode="lyrics" 小封面卡 + 歌词列。点大封面翻过去，点小卡翻回来。 ── */
.ly-big { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 0; padding: 0; cursor: pointer; position: relative; }
/* 封面通栏顶到天花板（顶钮浮在上面）、底边用遮罩淡出，不描边不装箱 */
.lyrics-view[data-mode="cover"] .ly-header { position: absolute; left: 0; right: 0; top: 0; z-index: 3; }
.lyrics-view[data-mode="cover"] .ly-big { margin-top: 0; }
/* 封面页 ↔ 歌词页 淡入淡出 */
.ly-big, .ly-cover-area, .ly-lines-wrap { transition: opacity .22s var(--ease-out), transform .22s var(--ease-out); }
.lyrics-view.ly-swap .ly-big, .lyrics-view.ly-swap .ly-cover-area, .lyrics-view.ly-swap .ly-lines-wrap { opacity: 0; transform: scale(.985); }
.ly-big-cover { width: 100%; flex: 1 1 auto; min-height: min(46dvh, 100vw); height: auto; aspect-ratio: auto; border-radius: 0; font-size: 48px; border: 0; box-shadow: none; flex-shrink: 0;
  -webkit-mask-image: linear-gradient(to bottom, #000 58%, rgba(0,0,0,.6) 80%, transparent 100%); mask-image: linear-gradient(to bottom, #000 58%, rgba(0,0,0,.6) 80%, transparent 100%); }
.ly-big-cover img { object-fit: cover; }
.ly-big-info { text-align: left; min-width: 0; width: 100%; padding: 0 24px 8px; margin-top: -14px; flex-shrink: 0; }
/* 封面页顶上两颗钮浮在图上，用深玻璃白图标，什么封面都看得见 */
.lyrics-view[data-mode="cover"] .ly-close, .lyrics-view[data-mode="cover"] .ly-more { color: #fff; background: rgba(0, 0, 0, 0.22); border-color: rgba(255, 255, 255, 0.28); }
.ly-big-row { display: flex; align-items: center; gap: 12px; }
.ly-big-text { flex: 1; min-width: 0; }
.ly-big-name { font-size: 24px; font-weight: 800; color: var(--ink); line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ly-big-artist { font-size: 15px; font-weight: 500; color: var(--ink-soft); margin-top: 4px; }
.ly-big-like { width: 40px; height: 40px; padding: 0; display: grid; place-items: center; flex-shrink: 0; color: var(--ink-soft); }
.ly-big-like.liked { color: var(--accent); }
.ly-big-line { display: grid; gap: 3px; margin-top: 18px; min-height: 2.9em; }
.ly-big-line-main { font-size: 17px; font-weight: 700; color: var(--ink); line-height: 1.35; }
.ly-big-line-tr { font-size: 13.5px; font-weight: 500; color: var(--ink-soft); }
.ly-big-line-main:empty + .ly-big-line-tr::before { content: '点封面看歌词'; font-size: 11px; letter-spacing: .14em; color: var(--muted); }
@keyframes ly-big-tick { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.ly-big-line.tick { animation: ly-big-tick .28s var(--ease-out); }
/* 抽屉只有半屏高时，封面页装不下全套：封面让到 120px、歌词那句藏起、歌名一行 */
@media (max-height: 560px) {
  .ly-big-cover { min-height: 120px; }
  .ly-big-line { display: none; }
  .ly-big-name { -webkit-line-clamp: 1; font-size: 20px; }
  .ly-big-info { margin-top: -6px; padding-bottom: 2px; }
  .ly-deck.ly-deck { padding-top: 0; padding-bottom: calc(var(--safe-bottom) + 6px); }
  .ly-ctrl-row { padding-top: 0; }
}
.lyrics-view[data-mode="cover"] .ly-lines-wrap, .lyrics-view[data-mode="cover"] .ly-cover-area, .lyrics-view[data-mode="cover"] .ly-scrub { display: none; }
.lyrics-view[data-mode="lyrics"] .ly-big { display: none; }
.ly-card { cursor: pointer; }
/* 拨歌词时中间浮出的那条线＋「▶ 0:26」：点它从那句播 */
.ly-scrub { position: absolute; left: 0; right: 0; top: var(--scrub-top, 50%); z-index: 2; display: flex; align-items: center; pointer-events: none; transform: translateY(-50%); opacity: 0; transition: opacity var(--t-fast) var(--ease-out); }
.ly-scrub.show { opacity: 1; }
.ly-scrub-line { flex: 1; height: 1px; background: rgba(var(--pop-rgb), 0.22); margin-left: 20px; }
.ly-scrub-go { pointer-events: auto; margin: 0 14px 0 8px; font: inherit; font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--ink); background: var(--milk-strong); border: 1px solid var(--line); border-radius: var(--r-full); padding: 5px 10px 5px 9px; display: flex; align-items: center; gap: 4px; box-shadow: var(--shadow-sm); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.ly-scrub-go svg { width: 10px; height: 10px; fill: var(--accent); }
/* 歌词排版在右边时小标尺在左边，在左边/中间时在右边 */
html[data-ly-align="right"] .ly-scrub { flex-direction: row-reverse; }
html[data-ly-align="right"] .ly-scrub-line { margin-left: 0; margin-right: 20px; }
html[data-ly-align="right"] .ly-scrub-go { margin: 0 8px 0 14px; }
.ly-song-info { min-width: 0; flex: 1; }
.ly-song-name {
  /* 封面旁边直接粗体歌名＋歌手 */
  font-size: 20px; font-weight: 800; color: var(--ink); line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ly-song-artist { font-size: 14px; font-weight: 500; color: var(--ink-soft); margin-top: 4px; }
/* 上下淡出的 mask 套在这层不滚的壳上，里面只管滚（套在会滚、跑逐字动画的那层上，安卓 Chrome 每帧都重新栅格化整块遮罩，整页闪） */
.ly-lines-wrap {
  position: relative; flex: 1 1 0; min-height: 0; display: flex; flex-direction: column;
  -webkit-mask-image: linear-gradient(transparent, black 20%, black 80%, transparent);
  mask-image: linear-gradient(transparent, black 20%, black 80%, transparent);
}
.ly-lines {
  position: relative;
  flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden;
  padding: clamp(56px, 18dvh, 150px) 24px clamp(72px, 22dvh, 180px);
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  touch-action: pan-y;
  /* scroll-behavior:smooth 已撤 —— 自动跟随改走 glideLyricsTo() 的 lerp 惯性，
     两套一起开会打架（原生平滑会吃掉我们每帧写的 scrollTop）。 */
  scroll-padding-block: 42%;
}
.ly-loading, .ly-no-lyrics {
  text-align: center; color: var(--muted); padding: 40px 0; font-size: 13px;
}
/* 不动 font-size 和字重（每帧重排整列歌词，移动端掉帧）：字号固定，大小差交给 scale，层次由 opacity + 颜色 + 缩放一起给 */
/* 居中后 transform-origin 跟着改成 center，不然放大时整行往右甩 */
.ly-line {
  /* 照 Apple Music：字 24 特粗、靠左、当下那句清楚，别的行糊着（静态 blur，不逐帧动） */
  padding: 12px 0; font-size: var(--ly-size, 24px); font-weight: 800; line-height: 1.22; letter-spacing: -0.01em;
  color: var(--ink); opacity: 0.4;
  text-align: var(--ly-align, left);
  filter: blur(1.6px);
  transform: scale(0.96); transform-origin: var(--ly-origin, left center);
  transition: opacity var(--t-base) var(--ease-out),
              transform var(--t-base) var(--ease-out),
              color var(--t-base) var(--ease-out),
              filter var(--t-base) var(--ease-out);
  cursor: pointer;
}
.ly-line.active {
  opacity: 1; color: var(--ink); filter: none;
  transform: scale(1.04);
}
.ly-lines { padding-inline: 24px 28px; }
.ly-line .ly-w, .ly-line .ly-ch { font-weight: inherit; }
/* 居中版不要左侧那根标尺了（贴在左边缘会和居中的字脱节）。
   当下那句靠字号、颜色、亮度自己站出来就够 —— Apple Music 也是这么干的。 */
.ly-trans {
  font-size: 14px; opacity: 0.7; margin-top: 5px; font-weight: 600; color: var(--ink-soft); letter-spacing: 0; line-height: 1.35;
}
.ly-line.active .ly-trans { opacity: 0.9; color: var(--ink-soft); }
/* ── 文字PV动效＋封面糊底：封面放大重糊铺满歌词页，叠一层奶纱保字色 ── */
/* 歌词行免疫原生选中，长按完整归选句分享 */
.ly-line { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.ly-w { display: inline-block; white-space: pre; }   /* 词包字：英文单词不从中间拆行（CJK 一字一词，整句能折行） */
.ly-line { overflow-wrap: anywhere; }
.ly-ch { display: inline-block; white-space: pre; }  /* 平时就是普通字,激活才有戏 */
.ly-line.active .ly-ch {
  opacity: 0; animation: lyChar .34s cubic-bezier(.2,.8,.2,1) var(--d, 0ms) forwards;
}
@keyframes lyChar {
  /* 不透明度在前 45% 拉满（字先看清），位移把余下动作演完。只动 transform 和 opacity，不用 filter:blur 动画。 */
  0%   { opacity: 0; transform: translateY(.4em) rotate(3deg); }
  45%  { opacity: 1; }
  100% { opacity: 1; transform: none; }
}
/* ── 「接下来播」队列：播放条小牌 + 清单面板 ── */
.np-queue-btn {
  flex: 0 0 auto; border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 10px; margin-right: 2px;
  background: var(--accent-tint); color: var(--accent);
  font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer;
}
.qv-item { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid rgba(var(--rose-rgb), .12); }
.qv-sec { font-size: 11px; letter-spacing: .14em; color: var(--muted); padding: 14px 2px 4px; }
.qv-cover { width: 42px; height: 42px; border-radius: 10px; flex: 0 0 auto; overflow: hidden; }
.qv-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.qv-info { flex: 1; min-width: 0; display: grid; }
.qv-info b { font-size: 13.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qv-info small { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qv-now {
  flex: 0 0 auto; border: 0; border-radius: 999px; padding: 6px 12px;
  background: var(--accent-tint); color: var(--accent);
  font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
}
.qv-del {
  flex: 0 0 auto; width: 26px; height: 26px; border: 0; border-radius: 50%;
  background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
}
/* ── 播放器内直聊小条 ── */
.ly-chatline {
  position: sticky; bottom: 0; z-index: 5;
  margin: 8px 12px; padding: 10px 12px;
  background: var(--milk, rgba(255,250,253,.96)); border: 1px solid var(--line, #f1c3d7);
  border-radius: 16px; box-shadow: 0 8px 24px rgba(var(--shadow2-rgb), .16);
}
.ly-chatline[hidden] { display: none; }
.ly-chatline-quote {
  font-size: 12px; color: var(--accent, #c2708a); font-style: italic;
  margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ly-chatline-row { display: flex; gap: 8px; align-items: center; }
.ly-chatline-input {
  flex: 1; min-width: 0; padding: 8px 12px; font: inherit; font-size: 13px;
  border: 1px solid var(--line, #f1c3d7); border-radius: 999px;
  background: var(--milk-strong); color: var(--ink, #6b4a5c); outline: none;
}
.ly-chatline-send {
  flex: 0 0 auto; padding: 8px 14px; border: 0; border-radius: 999px;
  background: var(--accent, #c2708a); color: var(--on-pop);
  font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
}
/* 长按那条小条上多一颗「批注」，把这句带进批注本；独立窗没聊天可寄就只剩它 */
.ly-chatline-note {
  flex: 0 0 auto; padding: 8px 12px; border: 1px solid var(--accent, #c2708a); border-radius: 999px;
  background: transparent; color: var(--accent, #c2708a);
  font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.ly-chatline.standalone .ly-chatline-send, .ly-chatline.standalone .ly-chatline-input { display: none; }
.ly-chatline-close {
  flex: 0 0 auto; width: 28px; height: 28px; border: 0; border-radius: 50%;
  background: transparent; color: var(--muted, #9b7d8c); cursor: pointer;
}
.daily-reason {
  font-size: 9.5px; padding: 1px 6px; margin-left: 4px;
  border-radius: 999px; background: var(--accent-tint); color: var(--accent);
  vertical-align: 1px;
}
/* ── MV 放映厅 ── */
.mv-view {
  position: fixed; inset: 0; z-index: 140;
  background: #0b0910;
  display: flex; flex-direction: column;
}
.mv-view.hidden { display: none; }
.mv-top {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  color: #f5edf7;
}
.mv-title { flex: 1; font-size: 14px; font-weight: 600; display: grid; }
.mv-title small { font-size: 11px; font-weight: 400; opacity: .7; }
.mv-qual {
  background: rgba(255,255,255,.1); color: #f5edf7;
  border: 1px solid rgba(255,255,255,.2); border-radius: 999px;
  padding: 4px 10px; font: inherit; font-size: 12px;
}
#mv-video { flex: 1; width: 100%; min-height: 0; object-fit: contain; background: #000; }
.ly-bottom { display: flex; align-items: center; gap: 8px; padding: 8px 20px; flex-shrink: 0; }
.ly-time { font-size: 10px; color: var(--muted); flex-shrink: 0; width: 32px; font-family: var(--font-mono); }
.ly-time-end { text-align: right; }
.ly-seek {
  flex: 1; height: 22px; cursor: pointer; position: relative; touch-action: none;
  display: flex; align-items: center;
}
.ly-seek-track {
  width: 100%; height: 4px;
  background: rgba(var(--rose-rgb), 0.18);
  border-radius: 999px; position: relative;
}
.ly-seek-fill {
  height: 100%; border-radius: 999px;
  background: var(--btn);
  transition: width 0.15s linear;
}
.ly-seek-thumb {
  position: absolute; top: 50%; width: 13px; height: 13px;
  background: #fff; border: 3px solid var(--accent); border-radius: 50%;
  transform: translate(-50%, -50%); pointer-events: none;
  box-shadow: 0 2px 8px rgba(var(--rose-deep-rgb), 0.3);
}
.ly-controls {
  display: flex; align-items: center; justify-content: center; gap: 30px;
  padding: 8px 20px calc(var(--safe-bottom) + 16px); color: var(--accent);
  flex-shrink: 0;
}
.ly-play-btn {
  width: 54px; height: 54px; border-radius: 50%;
  background: var(--btn); color: var(--btn-ink);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  border: none;
  box-shadow: 0 8px 22px rgba(var(--rose-deep-rgb), 0.4);
  transition: transform var(--t-base) var(--ease-spring);
}
.ly-play-btn:active { transform: scale(0.92); }
.ly-skip-btn {
  background: none; border: none; color: var(--accent-soft);
  cursor: pointer; padding: 10px; border-radius: var(--r-full);
  transition: transform var(--t-base) var(--ease-spring);
}
.ly-skip-btn:active { transform: scale(0.9); }

@media (prefers-reduced-motion: reduce) {
  .lyrics-view, .ly-line, .ly-seek-fill { transition: none; }
  .ly-lines { scroll-behavior: auto; }
}

/* ── Song Memory Panel ── */
/* 批注本/评论区玻璃版：壳透着底下那页糊成一片，顶上两颗钮和顶栏同材质，内容一段一张玻璃卡，输入落在最底下一张卡里 */
.memory-view {
  position: fixed; inset: 0; z-index: 110;
  display: flex; flex-direction: column;
  background: color-mix(in srgb, var(--paper) 74%, transparent);
  backdrop-filter: blur(26px) saturate(1.15); -webkit-backdrop-filter: blur(26px) saturate(1.15);
}
.memory-view.hidden { display: none; }
.sm-header {
  display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; gap: 10px; padding: 16px 20px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
}
/* 面板头三格：叉固定右格、刷新左格、标题正中央 */
.sm-header .sm-close { grid-column: 3; grid-row: 1; }
.sm-header .sm-refresh { grid-column: 1; grid-row: 1; }
.sm-header .sm-header-title { grid-column: 2; grid-row: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sm-close {
  background: rgba(var(--glass-rgb), calc(0.22 * var(--glass-k))); border: 1px solid rgba(var(--glass-rgb), calc(0.55 * var(--glass-k))); color: var(--rose-deep);
  font-size: 20px; cursor: pointer; padding: 0;
  width: 38px; height: 38px; border-radius: var(--r-full);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.sm-header-title { font-size: 15px; font-weight: 600; color: var(--ink); flex: 1; }
.sm-refresh {
  background: rgba(var(--glass-rgb), calc(0.22 * var(--glass-k))); border: 1px solid rgba(var(--glass-rgb), calc(0.55 * var(--glass-k))); color: var(--rose-deep);
  cursor: pointer; padding: 0; width: 38px; height: 38px; border-radius: var(--r-full);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.sm-header-title { text-align: center; }
/* 歌头卡：封面 + 歌名 + 歌手 + 小字数据 */
.sm-song { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 12px; background: var(--milk); border: 1px solid var(--line); border-radius: 18px; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.sm-song-cover { width: 58px; height: 58px; border-radius: 14px; flex-shrink: 0; font-size: 20px; border: 1px solid var(--line); }
.sm-song-info { min-width: 0; flex: 1; }
.sm-song-name { font-size: 15px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sm-song-artist { font-size: 12px; color: var(--ink-soft); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sm-song .sm-meta { padding: 6px 0 0; gap: 8px; }
.sm-sec { font-size: 10.5px; font-weight: 700; letter-spacing: 0.18em; color: var(--rose-deep); opacity: 0.85; padding: 10px 4px 6px; }
.sm-write { padding: 12px 14px 14px; margin-top: 12px; background: var(--milk); border: 1px solid var(--line); border-radius: 18px; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.sm-write .sm-edit { margin: 0 0 8px; background: rgba(var(--glass-rgb), calc(0.35 * var(--glass-k))); }
.sm-write .sm-save { margin: 4px auto 0; }
.sm-body { flex: 1; overflow-y: auto; padding: 0 20px 24px; }
.sm-feeling {
  font-size: 14px; line-height: 1.7; color: var(--ink);
  padding: 14px 16px; margin-bottom: 10px;
  background: var(--milk); border: 1px solid var(--line);
  border-radius: 18px; border-left: 3px solid var(--accent);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
}
.sm-note { padding: 10px 12px; border-radius: 14px; background: var(--milk); border: 1px solid var(--line); margin-bottom: 8px; }
.sm-note-hd { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; font-size: 11px; letter-spacing: .04em; color: var(--muted); }
.sm-note-who { font-weight: 600; color: var(--accent); }
.sm-note .sm-notes { margin: 0; padding: 0; background: none; border: 0; }
.sm-notes {
  font-size: 13.5px; line-height: 1.7; color: var(--ink);
  padding: 12px 14px; white-space: pre-wrap;
  /* 批注是拿来读的，给它一张纸卡 */
  background: var(--milk); border: 1px solid var(--line);
  border-radius: 18px; margin-bottom: 10px; padding: 14px 16px;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
}
.sm-fav-title { font-size: 11.5px; color: var(--muted); padding: 6px 2px 2px; }
.sm-fav-lines { padding: 10px 14px 6px; margin-bottom: 10px; background: var(--milk); border: 1px solid var(--line); border-radius: 18px; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.sm-fav-line {
  font-size: 13px; color: var(--ink);
  padding: 6px 0 8px 12px;
  border-left: 2px solid var(--accent);
  line-height: 1.55;
}
.sm-fav-line + .sm-fav-line { margin-top: 2px; }
.sm-meta {
  display: flex; flex-wrap: wrap; gap: 12px; padding: 12px 2px;
  font-size: 11px; color: var(--muted);
}
.sm-tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; }
.sm-tag {
  font-size: 11.5px; padding: 4px 12px; border-radius: var(--r-full);
  background: rgba(var(--glass-rgb), calc(0.3 * var(--glass-k))); border: 1px solid rgba(var(--glass-rgb), calc(0.6 * var(--glass-k))); color: var(--rose-deep);
}
.sm-loading, .sm-empty {
  text-align: center; color: var(--muted); padding: 60px 0; font-size: 13px;
}
/* ── 批注手写件 ＋ 评论区 ── */
.sm-edit {
  width: 100%; box-sizing: border-box; margin: 10px 0 0;
  padding: 12px 14px; font: inherit; font-size: 13.5px; line-height: 1.7; color: var(--ink);
  background: var(--milk); border: 1px solid var(--line); border-radius: 14px;
  resize: vertical; outline: none;
}
.sm-edit:focus { border-color: var(--accent-soft); }
.sm-edit-tags { resize: none; }
.sm-save {
  display: block; margin: 12px auto 4px; padding: 9px 26px;
  font: inherit; font-size: 13px; font-weight: 600; color: var(--on-pop);
  background: var(--btn); color: var(--btn-ink); border: 0; border-radius: var(--r-full); cursor: pointer;
  box-shadow: 0 6px 18px rgba(var(--shadow2-rgb), 0.3);
}
.sm-save:disabled { opacity: .6; }
.cm-item {
  padding: 12px 2px 10px; border-bottom: 1px solid rgba(var(--rose-rgb), 0.12);
}
.cm-item.hot { background: linear-gradient(150deg, var(--accent-tint), transparent);   /* 热评底用主题色 */ border-radius: 12px; padding-inline: 10px; margin-bottom: 4px; border-bottom: 0; }
.cm-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.cm-ava { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
.cm-user { font-size: 12px; font-weight: 600; color: var(--rose-deep); }
.cm-hot-tag { font-size: 10px; padding: 1px 8px; border-radius: var(--r-full); background: var(--accent-tint); color: var(--accent); }
.cm-text { font-size: 13.5px; line-height: 1.7; color: var(--ink); white-space: pre-wrap; overflow-wrap: break-word; }
.cm-foot { display: flex; gap: 14px; margin-top: 6px; font-size: 11px; color: var(--muted); }
.cm-divider { text-align: center; font-size: 11.5px; color: var(--muted); padding: 16px 0 6px; }
.cm-more { margin-bottom: 20px; }


/* ── Toast ── */
.toast {
  position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
  background: rgba(var(--pop-rgb), 0.95); color: var(--on-pop); padding: 9px 20px; border-radius: 999px;
  font-size: 13px; font-weight: 600; z-index: 9000; pointer-events: none;
  box-shadow: 0 10px 26px rgba(var(--pop-rgb), 0.35); animation: fadeUp var(--t-fast) var(--ease-out);
  opacity: 0; transition: opacity var(--t-fast) var(--ease-out);
}
.toast.show { opacity: 1; }
/* 网易登录过期横幅：贴在顶栏下面常驻，不挡操作 */
.nl-banner {
  position: fixed; top: calc(52px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px;
  z-index: 8900; padding: 8px 14px; border-radius: 12px;
  background: rgba(var(--pop-rgb), 0.92); color: var(--on-pop); font-size: 12.5px; line-height: 1.45; font-weight: 600;
  box-shadow: 0 8px 22px rgba(var(--pop-rgb), 0.3); pointer-events: auto; cursor: pointer; text-align: center;
}

/* ── 「切标签就好」提示条：默认留在后台继续唱，真要跳走得自己按 ── */
.stuck-hint {
  position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
  z-index: 9100; display: flex; flex-direction: column; gap: 8px;
  background: rgba(var(--pop-rgb), 0.96); color: var(--on-pop);
  padding: 13px 15px; border-radius: 16px; font-size: 13px; line-height: 1.6;
  box-shadow: 0 14px 34px rgba(60, 34, 44, 0.42);
  animation: sheetIn var(--t-fast) var(--ease-out);   /* 同设置卡：fadeUp 带 translateX(-50%)，这条是 left/right 撑开的 */
}
.stuck-hint button {
  appearance: none; border: 1px solid rgba(var(--on-pop-rgb), 0.34); border-radius: 999px;
  background: transparent; color: var(--on-pop); font: inherit; font-size: 12.5px;
  padding: 7px 12px; cursor: pointer;
}
.stuck-hint button[data-act="stay"] { background: rgba(var(--on-pop-rgb), 0.16); border-color: transparent; }
.stuck-hint button:active { transform: scale(.97); }

@keyframes fadeUp {
