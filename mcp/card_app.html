<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>music card</title>
<style>
  :root { color-scheme: dark; }
  /* 宿主 iframe 可能比内容高——html 打同色底，别让下边缘露出窟窿（9-01 真机） */
  html { background: #12151c; min-height: 100%; }
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
    background: linear-gradient(180deg, #2b3140, #12151c);
    color: #fff; padding: 12px 14px; border-radius: 14px;
    /* 别钳高度：claude.ai 是直接量 iframe 里 DOM 的真实高度来定卡片高的
       （anthropics/claude-ai-mcp#69），max-height 一夹它就永远量到「刚好装满」，
       卡片再也长不高。让文档诚实报身高，宿主自然把框拉够。 */
  }
  .card { display: flex; gap: 12px; align-items: flex-start; }
  .cover {
    width: 84px; height: 84px; border-radius: 10px; flex: none;
    background: #3a4150 center/cover no-repeat; overflow: hidden;
    display: flex; align-items: center; justify-content: center; font-size: 34px;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .meta { min-width: 0; flex: 1; }
  .name { font-size: 16px; font-weight: 700; line-height: 1.3;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .artist { font-size: 12px; color: #c5cbd6; margin-top: 2px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 卡片高度已随内容自适应（宿主量 DOM 身高）——歌词句和配文不再截断，放开长 */
  .line { font-size: 13px; color: #9fd0c9; margin-top: 5px; line-height: 1.45; }
  .line .t { color: #7d8595; font-size: 11px; margin-left: 6px; }
  .note { font-size: 12px; color: #aeb6c4; margin-top: 4px; font-style: italic; }
  .note[hidden], .line[hidden], button[hidden] { display: none; }
  /* 展开=整篇铺开不搞内部滚动：手机上嵌套滚动会被外层聊天页抢走（9-01 真机），
     反正卡片高度随 DOM 自适应，让聊天页自己滚最顺手 */
  .lyrics { margin-top: 8px; font-size: 12px;
            line-height: 1.7; color: #aeb6c4; border-top: 1px solid rgba(255,255,255,.08);
            padding-top: 6px; }
  .lyrics div.cur { color: #9fd0c9; font-weight: 700; }
  .lyrics span.tr { color: #7d8595; font-size: 11px; margin-left: 6px; }
  .np { margin-top: 8px; }
  .np[hidden] { display: none; }
  .np-bar { height: 4px; border-radius: 999px; background: rgba(255,255,255,.14); overflow: hidden; }
  .np-fill { height: 100%; width: 0%; border-radius: 999px; background: #9fd0c9; transition: width .4s linear; }
  .np-time { display: flex; justify-content: space-between; font-size: 10px; color: #8b93a2; margin-top: 3px; }
  .btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 12px; color: #fff; cursor: pointer;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px; padding: 5px 12px;
  }
  button:hover { background: rgba(255,255,255,.18); }
  button:disabled { opacity: .5; cursor: default; }
  .status { font-size: 11px; color: #8b93a2; margin-top: 5px; min-height: 13px; white-space: pre-line; }
  .foot { text-align: right; font-size: 10px; color: #6d7585; margin-top: 3px; }
</style>
</head>
<body>
<div class="card">
  <div class="cover" id="cover">♪</div>
  <div class="meta">
    <div class="name" id="name">…</div>
    <div class="artist" id="artist"></div>
    <div class="line" id="line" hidden></div>
    <div class="note" id="note" hidden></div>
    <div class="btns">
      <button id="btn-queue">⏯ 插进接下来播</button>
      <button id="btn-now">▶ 立刻开播</button>
      <button id="btn-player" hidden>🎧 打开播放器</button>
      <button id="btn-lyrics" hidden>📜 歌词</button>
    </div>
    <div class="np" id="np" hidden>
      <div class="np-bar"><div class="np-fill" id="np-fill"></div></div>
      <div class="np-time"><span id="np-cur">0:00</span><span id="np-tot">0:00</span></div>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>
<div class="lyrics" id="lyrics" hidden></div>
<div class="foot">♪ music-mcp</div>
<script>
(function () {
  "use strict";
  var seq = 0, pending = {}, song = null;
  function rpc(method, params) {
    return new Promise(function (resolve, reject) {
      var id = "app-" + (++seq);
      pending[id] = { ok: resolve, no: reject };
      window.parent.postMessage({ jsonrpc: "2.0", id: id, method: method, params: params || {} }, "*");
    });
  }
  window.addEventListener("message", function (ev) {
    var m = ev.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id && pending[m.id] && !m.method) {        // response to our request
      // （!m.method 防卫：带 method 的是请求不是响应——同窗测试环境里会听到
      //   自己发出去的请求回声，别把它误当空响应吞掉）
      var p = pending[m.id]; delete pending[m.id];
      if (m.error) p.no(m.error); else p.ok(m.result);
      return;
    }
    if (m.method === "ui/notifications/tool-result" && m.params) {
      render((m.params.structuredContent) || (m.params.result && m.params.result.structuredContent));
    } else if (m.method === "ui/notifications/tool-input" && m.params && m.params.arguments) {
      var a = m.params.arguments;
      if (!song && (a.name || a.query)) byId("name").textContent = a.name || a.query;
    }
  });
  function byId(i) { return document.getElementById(i); }
  function mmss(t) { t = Math.max(0, Math.round(t)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
  function render(sc) {
    if (!sc || !sc.song) return;
    song = sc.song;
    setTimeout(function () { try { npPoll(); } catch (e) {} }, 300);
    byId("name").textContent = song.name || "";
    byId("artist").textContent = song.artist + (song.album ? " · " + song.album : "");
    if (song.cover) {
      var img = new Image();
      img.onload = function () { var c = byId("cover"); c.textContent = ""; c.appendChild(img); };
      img.src = String(song.cover).replace(/^http:/, "https:") + (String(song.cover).indexOf("?") < 0 ? "?param=200y200" : "");
    }
    var lineEl = byId("line");
    if (sc.kind === "lyric" && sc.lyric && sc.lyric.line) {
      var l = sc.lyric.line;
      lineEl.innerHTML = "";
      lineEl.appendChild(document.createTextNode("「" + l.text + "」" + (l.trans ? " " + l.trans : "")));
      var t = document.createElement("span"); t.className = "t"; t.textContent = mmss(sc.lyric.at);
      lineEl.appendChild(t);
      lineEl.hidden = false;
    }
    if (sc.note) { byId("note").textContent = sc.note; byId("note").hidden = false; }
    if (sc.player_url) {
      var pb = byId("btn-player");
      pb.hidden = false;
      pb.onclick = function () { rpc("ui/open-link", { url: sc.player_url }); };
    }
    // 滚动歌词（9-01 安可:「是不是能够塞一个滚动歌词呢！」）：
    // 点「📜 歌词」展开整篇，面板内滚动；歌词卡分享的那句高亮并居中
    if (sc.lyrics && sc.lyrics.length) {
      var panel = byId("lyrics");
      panel.innerHTML = "";
      var curAt = (sc.kind === "lyric" && sc.lyric) ? sc.lyric.at : null;
      var curEl = null;
      sc.lyrics.forEach(function (l) {
        if (!l.x) return;
        var d = document.createElement("div");
        d.dataset.t = l.t;   // 跟唱高亮用：每行记住自己的时间戳
        d.appendChild(document.createTextNode(l.x));
        if (l.tr) { var s = document.createElement("span"); s.className = "tr"; s.textContent = l.tr; d.appendChild(s); }
        if (curAt !== null && Math.abs(l.t - curAt) < 0.5) { d.className = "cur"; curEl = d; }
        panel.appendChild(d);
      });
      var lb = byId("btn-lyrics");
      lb.hidden = false;
      lb.onclick = function () {
        panel.hidden = !panel.hidden;
        lb.textContent = panel.hidden ? "📜 歌词" : "📜 收起";
      };
    }
  }
  function play(mode, label) {
    if (!song) { byId("status").textContent = "还没拿到歌曲信息…"; return; }
    var btns = document.querySelectorAll("button");
    btns.forEach(function (b) { b.disabled = true; });
    byId("status").textContent = "…";
    rpc("tools/call", { name: "song_share", arguments: { song_id: String(song.songId), mode: mode } })
      .then(function (r) {
        var txt = (r && r.content && r.content[0] && r.content[0].text) || "";
        byId("status").textContent = txt || (label + " ✓");
      })
      .catch(function (e) { byId("status").textContent = "❌ " + (e && e.message || "没成功"); })
      .then(function () { btns.forEach(function (b) { b.disabled = false; }); });
  }
  byId("btn-queue").addEventListener("click", function () { play("queue", "已插队"); });
  byId("btn-now").addEventListener("click", function () { play("now", "已开播"); });
  // 进度条＋跟唱（9-01 安可点单「优化一下嵌入进度条」）：播放器 5 秒一跳心跳 →
  // 服务端 /music/now → MCP 的 music://now 资源 → 这里轮询。只在卡片这首正在播时亮，
  // 本地 1s 插值让指针平滑走；歌词面板开着时顺带点亮当前行＝真·跟唱。
  var np = { pos: 0, dur: 0, playing: false, ok: false, fails: 0 };
  function npRender() {
    var box = byId("np");
    if (!np.ok || !np.dur) { box.hidden = true; return; }
    box.hidden = false;
    byId("np-fill").style.width = Math.min(100, np.pos / np.dur * 100) + "%";
    byId("np-cur").textContent = mmss(np.pos);
    byId("np-tot").textContent = mmss(np.dur);
    var panel = byId("lyrics");
    if (!panel.hidden) {
      var rows = panel.children, want = null;
      for (var i = 0; i < rows.length; i++) {
        var t = parseFloat(rows[i].dataset.t);
        if (!isNaN(t) && t <= np.pos) want = rows[i];
      }
      for (var j = 0; j < rows.length; j++) rows[j].classList.toggle("cur", rows[j] === want);
    }
  }
  function npPoll() {
    if (!song) return;
    rpc("resources/read", { uri: "music://now" }).then(function (res) {
      np.fails = 0;
      var d = {};
      try { d = JSON.parse(res.contents[0].text); } catch (e) {}
      if (d.ok && String(d.songId) === String(song.songId)) {
        np.ok = true; np.dur = d.duration || 0; np.playing = !!d.playing;
        // 消滞后（9-01 安可耳测慢 0.5-0.7s）：位置要加回服务端存龄 age，
        // 再补 0.35s 链路半程（上报+轮询往返），不然高亮永远追着唱
        np.basePos = (d.position || 0) + (np.playing ? (d.age || 0) + 0.35 : 0);
        np.baseAt = performance.now();
        np.pos = np.basePos;
      } else { np.ok = false; }
      npRender();
    }).catch(function () { np.fails += 1; if (np.fails >= 3) { clearInterval(npTimer); } });
  }
  var npTimer = setInterval(npPoll, 5000);
  // 插值改真实时钟：每 0.4s 按毫秒推算，不再整秒跳
  setInterval(function () {
    if (np.ok && np.playing) {
      np.pos = np.basePos + (performance.now() - np.baseAt) / 1000;
      npRender();
    }
  }, 400);

  // 身高播报：claude.ai 直接量 DOM，但守规矩的宿主听 size-changed 通知——两头都照顾
  function reportSize() {
    try {
      window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/size-changed",
        params: { height: document.documentElement.scrollHeight } }, "*");
    } catch (e) { /* 无伤 */ }
  }
  if (window.ResizeObserver) { new ResizeObserver(reportSize).observe(document.body); }
  window.addEventListener("load", reportSize);
  rpc("ui/initialize", { protocolVersion: "2026-01-26", appInfo: { name: "music card", version: "1.0.0" } })
    .then(function (res) {
      // 握手回执：MCP 惯例 initialize 后要跟一条 initialized 通知，宿主才开始推数据
      // （9-01 真机首测：漏了这条，卡片渲染成空壳「…」）
      window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized" }, "*");
      // 有的宿主把触发本视图的工具结果直接塞在 initialize 结果里
      var tr = res && (res.toolResult || res.result);
      if (tr && tr.structuredContent) render(tr.structuredContent);
    })
    .catch(function () { /* 不支持也不至于白屏：等 tool-result 通知 */ });
})();
</script>
</body>
</html>
